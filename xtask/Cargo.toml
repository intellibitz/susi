[package]
name = "xtask"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
default-run = "xtask"

[dependencies]
susi-build-os-ucrt = { workspace = true }
susi-build-policy = { workspace = true }
sha2 = { package = "susi-vendor-sha2", path = "../crates/susi-vendor-sha2" }
sha1 = { package = "susi-vendor-sha1", path = "../crates/susi-vendor-sha1", optional = true }
serde_json = { package = "susi-vendor-serde-json", path = "../crates/susi-vendor-serde-json" }
susi-config = { workspace = true }

[build-dependencies]
susi-build-os-ucrt = { workspace = true }

[features]
release-tooling = ["dep:sha1"]

[lints]
workspace = true

[[bin]]
name = "local-release"
path = "src/bin/local-release.rs"
required-features = ["release-tooling"]

[target.'cfg(windows)'.dependencies]
susi-windows-runtime = { path = "../crates/susi-windows-runtime" }

[[bin]]
name = "susi-dev"
path = "src/bin/susi-dev.rs"

[[bin]]
name = "local-channel"
path = "src/bin/local-channel.rs"
