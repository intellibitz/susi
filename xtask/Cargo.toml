[package]
name = "xtask"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
default-run = "xtask"

[dependencies]
sha2 = { package = "susi-vendor-sha2", path = "../crates/susi-vendor-sha2" }
serde_json = { package = "susi-vendor-serde-json", path = "../crates/susi-vendor-serde-json" }
susi-config = { workspace = true }
susi-core = { workspace = true }
susi-paths = { workspace = true }

[build-dependencies]

[features]
release-tooling = []

[lints]
workspace = true

[[bin]]
name = "local-release"
path = "src/bin/local-release.rs"
required-features = ["release-tooling"]


[[bin]]
name = "release-lanes"
path = "src/bin/release-lanes.rs"

[[bin]]
name = "susi-dev"
path = "src/bin/susi-dev.rs"

[[bin]]
name = "local-channel"
path = "src/bin/local-channel.rs"

[[bin]]
name = "local-harvest"
path = "src/bin/local-harvest.rs"
