{{- if .Values.operator.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: susistacks.susi.dev
spec:
  group: susi.dev
  names:
    kind: SusiStack
    plural: susistacks
    singular: susistack
    shortNames: ["sstk"]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                engines:
                  type: array
                  items:
                    type: string
                gpu:
                  type: object
                  properties:
                    enabled: {type: boolean}
                    count: {type: integer}
                    resourceName: {type: string}
                secretsRef:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
{{- end }}
