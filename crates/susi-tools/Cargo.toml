[package]
name = "susi-tools"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
crossbeam = "0.8"
regex = "1.13"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
flume = { workspace = true }
ureq = { version = "3.4.2", features = ["json"] }
parking_lot = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
tracing = { workspace = true }

tokio = { workspace = true }
rmcp = { version = "3.4.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "elicitation"] }
reqwest = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
