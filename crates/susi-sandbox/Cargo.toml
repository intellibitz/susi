[package]
name = "susi-sandbox"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
bollard = "0.21.1"
futures = "0.3"
ureq = { version = "3.4.2", features = ["json"] }
tracing = "0.1"
susi-error = { path = "../susi-error" }
susi-paths = { path = "../susi-paths" }
susi-core = { path = "../susi-core" }
