[package]
name = "susi-vendor-tokio-rustls"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "Async native OS TLS and PEM identity validation; legacy package name preserves workspace imports."

[dependencies]
native-tls = { version = "0.2.18", features = ["alpn", "alpn-accept"] }
tokio-native-tls = "0.3"
tokio = { package = "susi-vendor-tokio", path = "../susi-vendor-tokio" }

[dev-dependencies]
pkcs1 = { version = "0.7", features = ["pem", "alloc", "pkcs8"] }
pkcs8 = { version = "0.10", features = ["pem"] }
zeroize = "1"
susi-vendor-rcgen = { path = "../susi-vendor-rcgen" }

[lints]
workspace = true
