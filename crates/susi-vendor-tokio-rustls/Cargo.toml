[package]
name = "susi-vendor-tokio-rustls"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "Async native OS TLS and PEM identity validation; legacy package name preserves workspace imports."

[dependencies]
native-tls = { version = "0.2.18", features = ["alpn", "alpn-accept"] }
tokio-native-tls = "0.3"
rustls-pki-types = { version = "1", features = ["std"] }
x509-cert = { version = "0.2", features = ["pem"] }
rsa = "0.9"

[dev-dependencies]
susi-vendor-rcgen = { path = "../susi-vendor-rcgen" }
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }

[lints]
workspace = true
