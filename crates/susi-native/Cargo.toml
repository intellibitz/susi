[package]
name = "susi-native"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.9"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
wasmer-types = "7.4.2"

[target.'cfg(not(windows))'.dependencies]
wasmer = { version = "7.4.2", features = ["cranelift", "sys"] }
wasmer-wasix = { version = "0.704.2", features = ["sys"] }

[target.'cfg(windows)'.dependencies]
wasmer = { version = "7.4.2", features = ["singlepass", "sys"] }
wasmer-wasix = { version = "0.704.2", features = ["sys"] }

[lints]
workspace = true
