[package]
name = "susi-vendor-wasmer"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
susi-error = { workspace = true }
wasmer-types = "7.4.2"
# In-process cell runtime (`cell.rs`): fuel metering and the memory-cap
# rewrite of the module's memory section.
wasmer-middlewares = "7.4.2"
wasm-encoder = "0.259"
tracing = { workspace = true }

# wasmer-wasix `sys-minimal`, not `sys`: we only run a WASI module with a
# stdout pipe (wasm.rs). `sys` adds journaling, a host network stack
# (virtual-net), host-fs, reqwest and ctrlc — none reachable from here, and
# ~190s of the cold build's tail compile. `wat` was only arriving via `sys`.
[target.'cfg(not(windows))'.dependencies]
wasmer = { version = "7.4.2", features = ["cranelift", "sys", "wat"] }
wasmer-wasix = { version = "0.704.2", default-features = false, features = ["sys-minimal"] }

[target.'cfg(windows)'.dependencies]
wasmer = { version = "7.4.2", features = ["singlepass", "sys", "wat"] }
wasmer-wasix = { version = "0.704.2", default-features = false, features = ["sys-minimal"] }

[lints]
workspace = true
