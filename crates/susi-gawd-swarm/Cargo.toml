[package]
name = "susi-gawd-swarm"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
susi-gawd-agents = { workspace = true }
crossbeam = "0.8"
regex = "1.13"
ureq = { version = "3.4.2", features = ["json"] }
hex = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
rayon = "1.12"
log = "0.4"
tokio = { workspace = true }
parking_lot = { workspace = true }
flume = { workspace = true }
dashmap = { workspace = true }
md5 = "0.8.1"
tracing = { workspace = true }

[features]
default = []
cuda = ["susi-gawd-agents/cuda"]
metal = ["susi-gawd-agents/metal"]

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
