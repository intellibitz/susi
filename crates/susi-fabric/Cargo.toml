[package]
name = "susi-fabric"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "susi provider fabric: registry and adapters for external agents, engines, models, and MCP components"

[dependencies]
susi-error = { workspace = true }
susi-paths = { path = "../susi-paths" }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "3.4.2", features = ["json"] }
