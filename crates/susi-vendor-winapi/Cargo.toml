[package]
name = "susi-vendor-winapi"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "SUSI vendor facade: sole workspace owner of `winapi`; susi-* crates declare zero third-party dependencies and consume it through this facade (AGENTS.md)."

[dependencies]
winapi = { version = "0.3", features = ["accctrl", "aclapi", "errhandlingapi", "fileapi", "jobapi2", "handleapi", "memoryapi", "minwinbase", "minwindef", "ntdef", "processthreadsapi", "psapi", "securitybaseapi", "shellapi", "stringapiset", "sysinfoapi", "tlhelp32", "winbase", "winerror", "winnt"] }

[lints]
workspace = true
