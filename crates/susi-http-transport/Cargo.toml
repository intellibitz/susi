[package]
name = "susi-http-transport"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "Shared TLS-sniffing HTTP accept loop, Hyper connection builder, and outbound http_call over crate-private ureq (GET/HEAD/DELETE/POST/PUT/PATCH)."

[dependencies]
tokio = { workspace = true, features = ["io-util", "net", "time"] }
tokio-rustls = { workspace = true }
hyper-util = { version = "0.1", features = ["full"] }
ureq = { version = "3.4.2", features = ["json"] }

[lints]
workspace = true
