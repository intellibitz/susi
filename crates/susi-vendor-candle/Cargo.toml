[package]
name = "susi-vendor-candle"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "Candle/CUDA/Metal vendor substrate: device probe, Qwen2 GGUF split, and Hugging Face tokenizers."

[dependencies]
tracing = { workspace = true }
# Pretrained inference does not use the optional C++ suffix-array trainer.
# Keep regex/progress behavior; unigram training uses tokenizers' Rust suffix_rs path.
tokenizers = { version = "0.23.2", default-features = false, features = ["onig", "progressbar"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { version = "0.11.1" }
candle-nn = { version = "0.11.1" }
candle-transformers = { version = "0.11.1" }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.1", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11.1", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.11.1", features = ["metal", "accelerate"] }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[lints]
workspace = true

[dev-dependencies]
susi-paths = { workspace = true }
