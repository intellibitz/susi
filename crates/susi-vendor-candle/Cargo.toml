[package]
name = "susi-vendor-candle"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "Candle CPU/Metal vendor substrate: device probe, Qwen2 GGUF split, and Hugging Face tokenizers."

[dependencies]
tracing = { workspace = true }
# Pretrained inference does not use the optional C++ suffix-array trainer.
# Rust regex and suffix-array implementations avoid native Oniguruma/C++ builds.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex", "progressbar"] }

# The default uses Rust CPU inference on every host. Metal retains its own
# platform qualification. CUDA/MKL are not supported product features: the
# former bundles CUDA/C++ kernels and the latter requires Intel-only terms.
candle-core = { version = "0.11.1" }
candle-nn = { version = "0.11.1" }
candle-transformers = { version = "0.11.1" }

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[lints]
workspace = true

[dev-dependencies]
susi-paths = { workspace = true }
