[package]
name = "susi-core"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
susi-abi = { workspace = true }
susi-config = { workspace = true }
susi-error = { workspace = true }
susi-paths = { workspace = true }
serde = { package = "susi-vendor-serde", path = "../susi-vendor-serde" }
serde_json = { package = "susi-vendor-serde-json", path = "../susi-vendor-serde-json" }
sha2 = { package = "susi-vendor-sha2", path = "../susi-vendor-sha2" }
hex = { package = "susi-vendor-hex", path = "../susi-vendor-hex" }
regex = { package = "susi-vendor-regex", path = "../susi-vendor-regex" }
tracing = { package = "susi-vendor-tracing", path = "../susi-vendor-tracing" }
getrandom = { package = "susi-vendor-getrandom", path = "../susi-vendor-getrandom" }

# Owner-only ACL on the plane-bus secret, set through Win32 (no `icacls`
# process, which opened a console window from the windowless daemon).
[target.'cfg(windows)'.dependencies]
winapi = { package = "susi-vendor-winapi", path = "../susi-vendor-winapi" }

[dev-dependencies]
criterion = { package = "susi-vendor-criterion", path = "../susi-vendor-criterion" }
proptest = { package = "susi-vendor-proptest", path = "../susi-vendor-proptest" }
tempfile = { package = "susi-vendor-tempfile", path = "../susi-vendor-tempfile" }
# Test-only: foreign-member Ed25519 signatures for the endorsement gates —
# `member_sign` can only sign as this node.
ed25519-dalek = { package = "susi-vendor-ed25519-dalek", path = "../susi-vendor-ed25519-dalek" }

[[bench]]
name = "evidence_verify"
harness = false
path = "benches/evidence_verify.rs"

[lints]
workspace = true
