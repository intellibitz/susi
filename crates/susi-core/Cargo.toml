[package]
name = "susi-core"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
sha2 = { workspace = true }
hex = { workspace = true }
crossbeam = "0.8"
flume = { workspace = true }
parking_lot = { workspace = true }
regex = "1.13"
tracing = { workspace = true }
susi-config = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "evidence_verify"
harness = false
path = "benches/evidence_verify.rs"

[lints]
workspace = true
