[package]
name = "susi-gemi-models"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
susi-core = { workspace = true }
susi-vendor-candle = { workspace = true }
susi-sandbox-client = { workspace = true }
susi-config = { workspace = true }
susi-error = { workspace = true }
susi-paths = { workspace = true }
crossbeam = "0.8"
regex = "1.13"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
flume = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
url = { workspace = true }
tokenizers = "0.23.2"
rayon = "1.12"
libc = "0.2"

[features]
default = []
cuda = ["susi-vendor-candle/cuda"]
metal = ["susi-vendor-candle/metal"]

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
