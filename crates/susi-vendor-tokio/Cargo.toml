[package]
name = "susi-vendor-tokio"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "SUSI vendor facade: sole workspace owner of `tokio`; susi-* crates declare zero third-party dependencies and consume it through this facade (AGENTS.md)."

[dependencies]
tokio = { version = "1.53", features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[features]
# The virtual clock (`tokio::time::pause`, `#[tokio::test(start_paused)]`) is
# test-only. Crates whose tests use it enable this from `[dev-dependencies]`,
# so the shipped binaries never link the test runtime hooks (D-SP-1).
test-util = ["tokio/test-util"]

[lints]
workspace = true
