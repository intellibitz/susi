[package]
name = "susi-vendor-tokio"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "SUSI vendor facade: sole workspace owner of `tokio`; susi-* crates declare zero third-party dependencies and consume it through this facade (AGENTS.md)."

[dependencies]
tokio = { version = "1.53", features = ["full", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time", "tracing"] }

[lints]
workspace = true
