[package]
name = "susi-vendor-rcgen"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "SUSI vendor facade: sole workspace owner of `rcgen`; susi-* crates declare zero third-party dependencies and consume it through this facade (AGENTS.md)."

[dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["pem"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
rand = "0.8"
zeroize = "1"
sha2 = { version = "0.10", features = ["oid"] }

[lints]
workspace = true
