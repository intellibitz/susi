[package]
name = "susi-vendor-rcgen"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "Certificate encoding with rcgen and local RustCrypto RSA signing; no native-source crypto provider."

[dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["pem"] }
rsa = { version = "0.9", features = ["sha2", "pem", "getrandom"] }
zeroize = "1"

[lints]
workspace = true
