[package]
name = "susi-daemon"
version = "0.14.0"
license = "Apache-2.0"
edition = "2024"

[dependencies]
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
susi-core = { workspace = true }
susi-abi = { workspace = true }
susi-gemi = { workspace = true }
susi-gawd = { workspace = true }
susi-gmcp = { workspace = true }
susi-server = { workspace = true }
susi-tools = { workspace = true }
susi-agents = { workspace = true }
dashmap = { workspace = true }
ureq = { version = "3.4.2", features = ["json"] }
wasmtime = { version = "49.0.1", features = ["cranelift"] }
parking_lot = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }

tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
signal-hook = "0.4.4"
tokio-rustls = "0.26"
rustls = "0.23"
rcgen = "0.14.10"

[features]
default = ["tools-rich"]
tools-rich = []
cuda = ["susi-gemi/cuda", "susi-server/cuda", "susi-gawd/cuda"]

[dev-dependencies]
# test-util enables #[tokio::test(start_paused)] for virtual-clock tests.
tokio = { version = "1.53", features = ["test-util"] }

[target."cfg(windows)".dependencies]
winapi = { version = "0.3", features = ["fileapi", "minwinbase"] }

[lints]
workspace = true
