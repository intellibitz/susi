[package]
name = "susi-daemon"
version = "0.12.0"
license = "Apache-2.0"
edition = "2024"

[dependencies]
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
susi-core = { workspace = true }
susi-gawd = { path = "../susi-gawd" }
susi-gmcp = { path = "../susi-gmcp" }
ureq = { version = "3.4.2", features = ["json"] }
parking_lot = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
ed25519-dalek = { workspace = true }
susi-gemi = { path = "../susi-gemi" }
susi-server = { path = "../susi-server" }
susi-tools = { path = "../susi-tools" }
susi-agents = { path = "../susi-agents" }
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
signal-hook = "0.4.4"

[features]
default = ["tools-rich"]
tools-rich = ["susi-gmcp/tools-rich"]
cuda = ["susi-gemi/cuda"]

[dev-dependencies]
# test-util enables #[tokio::test(start_paused)] for virtual-clock tests.
tokio = { version = "1.53", features = ["test-util"] }

[target."cfg(windows)".dependencies]
winapi = { version = "0.3", features = ["fileapi", "minwinbase"] }

[lints]
workspace = true
