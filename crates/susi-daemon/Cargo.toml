[package]
name = "susi-daemon"
version = "0.21.1"
license = "Apache-2.0"
edition = "2024"

[dependencies]
susi-abi = { workspace = true }
susi-sandbox-client = { workspace = true }
susi-config = { workspace = true }
susi-error = { workspace = true }
susi-paths = { workspace = true }
libc = { package = "susi-vendor-libc", path = "../susi-vendor-libc" }
serde = { package = "susi-vendor-serde", path = "../susi-vendor-serde" }
serde_json = { package = "susi-vendor-serde-json", path = "../susi-vendor-serde-json" }
susi-core = { workspace = true }
susi-gemi = { workspace = true }
susi-gawd = { workspace = true }
susi-gmcp = { workspace = true }
susi-server = { workspace = true }
susi-tools = { workspace = true }
susi-agents = { workspace = true }
dashmap = { package = "susi-vendor-dashmap", path = "../susi-vendor-dashmap" }
susi-http-transport = { workspace = true }
susi-vendor-wasmer = { workspace = true }
susi-vendor-cloud = { workspace = true }
parking_lot = { package = "susi-vendor-parking-lot", path = "../susi-vendor-parking-lot" }
hex = { package = "susi-vendor-hex", path = "../susi-vendor-hex" }
getrandom = { package = "susi-vendor-getrandom", path = "../susi-vendor-getrandom" }
ed25519-dalek = { package = "susi-vendor-ed25519-dalek", path = "../susi-vendor-ed25519-dalek" }
sha2 = { package = "susi-vendor-sha2", path = "../susi-vendor-sha2" }
# RFC 5389 long-term TURN credentials: MD5(user:realm:pass) then HMAC-SHA1
# MESSAGE-INTEGRITY. Crypto primitives, not vendor SDKs / HTTP clients.
sha1 = { package = "susi-vendor-sha1", path = "../susi-vendor-sha1" }
md5 = { package = "susi-vendor-md-5", path = "../susi-vendor-md-5" }

tokio = { package = "susi-vendor-tokio", path = "../susi-vendor-tokio" }
tracing = { package = "susi-vendor-tracing", path = "../susi-vendor-tracing" }
signal-hook = { package = "susi-vendor-signal-hook", path = "../susi-vendor-signal-hook" }
tokio-rustls = { package = "susi-vendor-tokio-rustls", path = "../susi-vendor-tokio-rustls" }
rcgen = { package = "susi-vendor-rcgen", path = "../susi-vendor-rcgen" }

[features]
default = ["tools-rich"]
tools-rich = []

[dev-dependencies]
# test-util enables #[tokio::test(start_paused)] for virtual-clock tests.
tokio = { package = "susi-vendor-tokio", path = "../susi-vendor-tokio" }

[target."cfg(windows)".dependencies]
winapi = { package = "susi-vendor-winapi", path = "../susi-vendor-winapi" }

[lints]
workspace = true
