[package]
name = "susi-gmcp"
version = "0.21.55"
license = "Apache-2.0"
edition = "2021"

[dependencies]
susi-abi = { workspace = true }
susi-core = { workspace = true }
susi-http-transport = { workspace = true }
susi-sandbox-client = { workspace = true }
susi-config = { workspace = true }
susi-error = { workspace = true }
susi-paths = { workspace = true }
serde = { package = "susi-vendor-serde", path = "../susi-vendor-serde" }
serde_json = { package = "susi-vendor-serde-json", path = "../susi-vendor-serde-json" }
tokio = { package = "susi-vendor-tokio", path = "../susi-vendor-tokio" }
hex = { package = "susi-vendor-hex", path = "../susi-vendor-hex" }
sha2 = { package = "susi-vendor-sha2", path = "../susi-vendor-sha2" }

hyper = { package = "susi-vendor-hyper", path = "../susi-vendor-hyper" }
hyper-util = { package = "susi-vendor-hyper-util", path = "../susi-vendor-hyper-util" }
http-body-util = { package = "susi-vendor-http-body-util", path = "../susi-vendor-http-body-util" }
libc = { package = "susi-vendor-libc", path = "../susi-vendor-libc" }

# Heavy specialist tools (syn AST),
# each behind its own `susi-vendor-*` crate. Off in the default core.
# Enable with `--features tools-rich` (or the root `plugins` feature).
susi-vendor-syn = { workspace = true, optional = true }
tokio-rustls = { package = "susi-vendor-tokio-rustls", path = "../susi-vendor-tokio-rustls" }

[dev-dependencies]
tempfile = { package = "susi-vendor-tempfile", path = "../susi-vendor-tempfile" }
susi-wire-client = { path = "../susi-wire-client" }

[features]
default = []
tools-rich = ["dep:susi-vendor-syn"]

[lints]
workspace = true
