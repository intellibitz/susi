[package]
name = "susi-gmcp"
version = "0.15.2"
license = "Apache-2.0"
edition = "2021"

[dependencies]
susi-abi = { workspace = true, features = ["cell-server"] }
susi-core = { workspace = true }
susi-http-transport = { workspace = true }
susi-sandbox-client = { workspace = true }
susi-config = { workspace = true }
susi-error = { workspace = true }
susi-paths = { workspace = true }
crossbeam = "0.8"
regex = "1.13"
dashmap = { workspace = true }
flume = { workspace = true }
rmcp = { version = "3.4.0", features = ["server", "client", "transport-io", "transport-streamable-http-server", "elicitation", "request-state"] }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
tower-service = "0.3"
jsonschema = { version = "0.56", default-features = false }
tokio = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }

shlex = "2.0"
bytes = "1.12"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
url = { workspace = true }
libc = "0.2"

# Heavy specialist tools (browser / tantivy / syn AST). Default-on for
# shipped parity; disable with `--no-default-features` for faster local checks.
headless_chrome = { version = "1.0.22", optional = true }
tantivy = { version = "0.26.2", optional = true }
# Text embeddings only. fastembed's defaults add image models (image/ravif/
# rav1e/exr: ~350s of cold build) and native-tls downloaders (reqwest 0.12 +
# OpenSSL, a second TLS stack). `hf-hub` is the blocking ureq API fastembed
# actually calls; ONNX Runtime binaries download over rustls (ring).
fastembed = { version = "7.0.1", optional = true, default-features = false, features = ["hf-hub", "ort-download-binaries-rustls-tls"] }
syn = { version = "3.0.6", features = ["full", "visit"], optional = true }
tokio-rustls = { workspace = true }

[features]
default = ["tools-rich"]
tools-rich = ["dep:headless_chrome", "dep:tantivy", "dep:fastembed", "dep:syn"]

[dev-dependencies]
proptest = "1.11.0"
tokio = { workspace = true }

[lints]
workspace = true
