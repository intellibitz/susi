[package]
name = "susi-gmcp"
version = "0.14.0"
license = "Apache-2.0"
edition = "2021"

[dependencies]
crossbeam = "0.8"
regex = "1.13"
dashmap = { workspace = true }
flume = { workspace = true }
rmcp = { version = "3.4.0", features = ["server", "client", "transport-io", "transport-streamable-http-server", "elicitation", "request-state"] }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
tower-service = "0.3"
jsonschema = { version = "0.56", default-features = false }
tokio = { workspace = true }
ureq = { version = "3.4.2", features = ["json"] }
hex = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
tracing = { workspace = true }

shlex = "2.0"
bytes = "1.12"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
url = { workspace = true }
libc = "0.2"

# Heavy specialist tools (browser / tantivy / syn AST). Default-on for
# shipped parity; disable with `--no-default-features` for faster local checks.
headless_chrome = { version = "1.0.22", optional = true }
tantivy = { version = "0.26.2", optional = true }
fastembed = { version = "7.0.1", optional = true }
syn = { version = "3.0.6", features = ["full", "visit"], optional = true }
tokio-rustls = "0.26"

[features]
default = ["tools-rich"]
tools-rich = ["dep:headless_chrome", "dep:tantivy", "dep:fastembed", "dep:syn"]

[dev-dependencies]
proptest = "1.11.0"
tokio = { workspace = true }
anyhow = { workspace = true }
# Test-only: exercises MCP client connect against an in-process server.
# Production `susi-gmcp` has zero peer-plane Cargo deps.
susi-tools = { workspace = true }

[lints]
workspace = true
