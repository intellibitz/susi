[package]
name = "susi-gmcp"
version = "0.8.1"
license = "Apache-2.0"
edition = "2021"

[dependencies]
susi-paths = { path = "../susi-paths" }
susi-gawd = { workspace = true }
susi-error = { workspace = true }
susi-core = { workspace = true }
susi-tools = { workspace = true }
susi-sandbox = { workspace = true }
susi-gemi = { workspace = true }
rmcp = { version = "3.4.0", features = ["server", "client", "transport-io", "transport-streamable-http-server", "elicitation", "request-state"] }
serde = { workspace = true }
serde_json = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
tower-service = "0.3"
jsonschema = { version = "0.56", default-features = false }
tokio = { workspace = true }

anyhow = { workspace = true }
headless_chrome = "1.0.22"
tantivy = "0.26.2"
qdrant-client = "1.19"
shlex = "2.0"
fastembed = "7.0.1"
syn = { version = "3.0.6", features = ["full", "visit"] }
bytes = "1.12"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
url = { workspace = true }
susi-agents = { workspace = true }
[dev-dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
headless_chrome = "1.0.22"
tantivy = "0.26.2"
qdrant-client = "1.19"
shlex = "2.0"
fastembed = "7.0.1"
syn = { version = "3.0.6", features = ["full", "visit"] }
bytes = "1.12"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
url = { workspace = true }
