[package]
name = "susi-gmcp"
version = "0.15.2"
license = "Apache-2.0"
edition = "2021"

[dependencies]
susi-abi = { workspace = true, features = ["cell-server"] }
susi-core = { workspace = true }
susi-http-transport = { workspace = true }
susi-sandbox-client = { workspace = true }
susi-config = { workspace = true }
susi-error = { workspace = true }
susi-paths = { workspace = true }
dashmap = { workspace = true }
rmcp = { version = "3.4.0", features = ["server", "transport-io", "transport-streamable-http-server", "elicitation", "request-state"] }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
tower-service = "0.3"
jsonschema = { version = "0.56", default-features = false }
tokio = { workspace = true }
hex = { workspace = true }

shlex = "2.0"
bytes = "1.12"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
url = { workspace = true }
libc = "0.2"

# Heavy specialist tools (browser / full-text index / embeddings / syn AST),
# each behind its own `susi-vendor-*` crate. Default-on for
# shipped parity; disable with `--no-default-features` for faster local checks.
susi-vendor-chrome = { workspace = true, optional = true }
susi-vendor-tantivy = { workspace = true, optional = true }
susi-vendor-fastembed = { workspace = true, optional = true }
susi-vendor-syn = { workspace = true, optional = true }
tokio-rustls = { workspace = true }

[features]
default = ["tools-rich"]
tools-rich = ["dep:susi-vendor-chrome", "dep:susi-vendor-tantivy", "dep:susi-vendor-fastembed", "dep:susi-vendor-syn"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
