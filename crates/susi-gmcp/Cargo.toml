[package]
name = "susi-gmcp"
version = "0.21.3"
license = "Apache-2.0"
edition = "2021"

[dependencies]
susi-abi = { workspace = true, features = ["cell-server"] }
susi-core = { workspace = true }
susi-http-transport = { workspace = true }
susi-sandbox-client = { workspace = true }
susi-config = { workspace = true }
susi-error = { workspace = true }
susi-paths = { workspace = true }
dashmap = { package = "susi-vendor-dashmap", path = "../susi-vendor-dashmap" }
susi-vendor-mcp-server = { workspace = true }
serde = { package = "susi-vendor-serde", path = "../susi-vendor-serde" }
serde_json = { package = "susi-vendor-serde-json", path = "../susi-vendor-serde-json" }
parking_lot = { package = "susi-vendor-parking-lot", path = "../susi-vendor-parking-lot" }
tower-service = { package = "susi-vendor-tower-service", path = "../susi-vendor-tower-service" }
jsonschema = { package = "susi-vendor-jsonschema", path = "../susi-vendor-jsonschema" }
tokio = { package = "susi-vendor-tokio", path = "../susi-vendor-tokio" }
hex = { package = "susi-vendor-hex", path = "../susi-vendor-hex" }

shlex = { package = "susi-vendor-shlex", path = "../susi-vendor-shlex" }
bytes = { package = "susi-vendor-bytes", path = "../susi-vendor-bytes" }
hyper = { package = "susi-vendor-hyper", path = "../susi-vendor-hyper" }
hyper-util = { package = "susi-vendor-hyper-util", path = "../susi-vendor-hyper-util" }
http-body-util = { package = "susi-vendor-http-body-util", path = "../susi-vendor-http-body-util" }
url = { package = "susi-vendor-url", path = "../susi-vendor-url" }
libc = { package = "susi-vendor-libc", path = "../susi-vendor-libc" }

# Heavy specialist tools (browser / full-text index / embeddings / syn AST),
# each behind its own `susi-vendor-*` crate. Default-on for
# shipped parity; disable with `--no-default-features` for faster local checks.
susi-vendor-chrome = { workspace = true, optional = true }
susi-vendor-tantivy = { workspace = true, optional = true }
susi-vendor-fastembed = { workspace = true, optional = true }
susi-vendor-syn = { workspace = true, optional = true }
tokio-rustls = { package = "susi-vendor-tokio-rustls", path = "../susi-vendor-tokio-rustls" }

[dev-dependencies]
susi-vendor-models = { workspace = true }
tempfile = { package = "susi-vendor-tempfile", path = "../susi-vendor-tempfile" }

[features]
default = ["tools-rich"]
tools-rich = ["dep:susi-vendor-chrome", "dep:susi-vendor-tantivy", "dep:susi-vendor-fastembed", "dep:susi-vendor-syn"]

[lints]
workspace = true
