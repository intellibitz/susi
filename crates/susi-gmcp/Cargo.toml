[package]
name = "susi-gmcp"
version = "0.1.2023079"
edition = "2021"

[dependencies]
susi-paths = { path = "../susi-paths" }
susi-gawd = { path = "../susi-gawd" }
susi-error = { path = "../susi-error" }
susi-tools = { path = "../susi-tools" }
susi-sandbox = { path = "../susi-sandbox" }
susi-gemi = { path = "../susi-gemi" }
rmcp = { version = "3.4.0", features = ["server", "client"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
tokio = { version = "1.37", features = ["full"] }

anyhow = "1.0"
headless_chrome = "1.0"
tantivy = "0.26"
qdrant-client = "1.11"
shlex = "2.0"
fastembed = "7.0.1"
syn = { version = "3.0.6", features = ["full", "visit"] }
bytes = "1.0"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
url = "2.5"
susi-agents = { path = "../susi-agents" }
[dev-dependencies]
tokio = { version = "1.37", features = ["full", "test-util"] }
anyhow = "1.0"
headless_chrome = "1.0"
tantivy = "0.26"
qdrant-client = "1.11"
shlex = "2.0"
fastembed = "7.0.1"
syn = { version = "3.0.6", features = ["full", "visit"] }
bytes = "1.0"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
url = "2.5"
