[package]
name = "susi-gawd"
version = "0.9.0"
license = "Apache-2.0"
edition = "2021"

[dependencies]
susi-gawd-agents = { workspace = true }
susi-gawd-swarm = { workspace = true }
susi-gawd-a2a = { workspace = true }
susi-paths = { path = "../susi-paths" }
md5 = "0.8.1"
syn = { version = "3.0.6", features = ["full", "visit"] }
base64 = "0.23"
parking_lot = { workspace = true }
flume = { workspace = true }
dashmap = { workspace = true }
susi-native = { workspace = true }
reqwest = { workspace = true }
susi-error = { workspace = true }
susi-core = { workspace = true }
susi-sandbox = { workspace = true }
susi-tools = { workspace = true }
susi-agents = { workspace = true }
susi-gemi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = "1.12"
log = "0.4"
tokio = { workspace = true }
once_cell = { workspace = true }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

[features]
default = []
cuda = ["susi-gawd-agents/cuda", "susi-gawd-swarm/cuda", "susi-gawd-a2a/cuda", "susi-gemi/cuda"]
metal = ["susi-gawd-agents/metal", "susi-gawd-swarm/metal", "susi-gawd-a2a/metal", "susi-gemi/metal"]
