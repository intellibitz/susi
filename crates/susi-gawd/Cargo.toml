[package]
name = "susi-gawd"
version = "0.14.0"
license = "Apache-2.0"
edition = "2021"
build = "../susi-gawd-agents/build.rs"

[dependencies]
syn = { version = "3.0.6", features = ["full", "visit"] }
reqwest = { workspace = true }
crossbeam = "0.8"
regex = "1.13"
dashmap = { workspace = true }
flume = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = "1.12"
log = "0.4"
ureq = { version = "3.4.2", features = ["json"] }
hex = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
shlex = "2.0"
md5 = "0.8.1"
ra2a = { version = "0.10.1", features = ["server", "client"] }
axum = "0.8.9"
tower = { version = "0.5", features = ["limit"] }
tokio-rustls = "0.26"

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = "1.11.0"
# Test-only: reflex_synth's end-to-end test exercises the in-process Wasmer
# host. Production `susi-gawd` reaches `susi-native` over IPC only.

[features]
default = []
cuda = []
metal = []

[lints]
workspace = true
