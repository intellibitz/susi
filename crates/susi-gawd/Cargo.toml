[package]
name = "susi-gawd"
version = "0.21.12"
license = "Apache-2.0"
edition = "2021"

[dependencies]
susi-abi = { workspace = true, features = ["cell-server"] }
susi-core = { workspace = true }
susi-gawd-agents = { workspace = true }
susi-gawd-swarm = { workspace = true }
susi-gawd-a2a = { workspace = true }
susi-sandbox-client = { workspace = true }
susi-config = { workspace = true }
susi-error = { workspace = true }
susi-paths = { workspace = true }
susi-native-client = { workspace = true }
susi-vendor-models = { workspace = true }
susi-vendor-syn = { workspace = true }
tokio = { package = "susi-vendor-tokio", path = "../susi-vendor-tokio" }
serde = { package = "susi-vendor-serde", path = "../susi-vendor-serde" }
serde_json = { package = "susi-vendor-serde-json", path = "../susi-vendor-serde-json" }
rayon = { package = "susi-vendor-rayon", path = "../susi-vendor-rayon" }
sha2 = { package = "susi-vendor-sha2", path = "../susi-vendor-sha2" }
hex = { package = "susi-vendor-hex", path = "../susi-vendor-hex" }

[dev-dependencies]
tempfile = { package = "susi-vendor-tempfile", path = "../susi-vendor-tempfile" }
# Test-only: reflex_synth's end-to-end test exercises the in-process Wasmer
# host. Production `susi-gawd` reaches `susi-native` over IPC only.

[lints]
workspace = true
