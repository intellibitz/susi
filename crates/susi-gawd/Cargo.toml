[package]
name = "susi-gawd"
version = "0.12.0"
license = "Apache-2.0"
edition = "2021"

[dependencies]
susi-gawd-agents = { workspace = true }
susi-gawd-swarm = { workspace = true }
susi-gawd-a2a = { workspace = true }
syn = { version = "3.0.6", features = ["full", "visit"] }
reqwest = { workspace = true }
crossbeam = "0.8"
regex = "1.13"
dashmap = { workspace = true }
flume = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = "1.12"
log = "0.4"
ureq = { version = "3.4.2", features = ["json"] }
hex = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = "1.11.0"
# Test-only: reflex_synth's end-to-end test exercises the in-process Wasmer
# host. Production `susi-gawd` reaches `susi-native` over IPC only.
susi-native = { workspace = true }

[features]
default = []
cuda = ["susi-gawd-agents/cuda", "susi-gawd-swarm/cuda", "susi-gawd-a2a/cuda"]
metal = ["susi-gawd-agents/metal", "susi-gawd-swarm/metal", "susi-gawd-a2a/metal"]

[lints]
workspace = true
