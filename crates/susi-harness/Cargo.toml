[package]
name = "susi-harness"
version = "0.21.38"
license = "Apache-2.0"
edition = "2021"
description = "Model routing, metering and budgets for fleets of coding agents: a dynamic model ladder built from the API keys in the environment, an OpenAI-compatible metering gateway, and a durable cost ledger."
readme = "README.md"
repository = "https://github.com/intellibitz/susi"
keywords = ["llm", "agents", "router", "gateway", "budget"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
susi-error = { workspace = true }
susi-http-transport = { workspace = true }
susi-adapters-llm = { workspace = true }
axum = { package = "susi-vendor-axum", path = "../susi-vendor-axum" }
tokio = { package = "susi-vendor-tokio", path = "../susi-vendor-tokio" }
futures = { package = "susi-vendor-futures", path = "../susi-vendor-futures" }
serde = { package = "susi-vendor-serde", path = "../susi-vendor-serde" }
serde_json = { package = "susi-vendor-serde-json", path = "../susi-vendor-serde-json" }
sha2 = { package = "susi-vendor-sha2", path = "../susi-vendor-sha2" }
hex = { package = "susi-vendor-hex", path = "../susi-vendor-hex" }
susi-vendor-fastembed = { path = "../susi-vendor-fastembed" }

[lints]
workspace = true

[dev-dependencies]
tempfile = { package = "susi-vendor-tempfile", path = "../susi-vendor-tempfile" }
