[package]
name = "susi-server"
version = "0.9.0"
license = "Apache-2.0"
edition = "2024"

[dependencies]
susi-agents = { workspace = true }
susi-gawd = { path = "../susi-gawd" }
susi-gemi = { path = "../susi-gemi" }
susi-tools = { path = "../susi-tools" }
susi-sandbox = { path = "../susi-sandbox" }

hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"
rayon = "1.12"
bytes = "1.12"
tracing = "0.1"

[features]
default = []
cuda = ["susi-gemi/cuda"]
