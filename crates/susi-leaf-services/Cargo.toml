[package]
name = "susi-leaf-services"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "HTTP shells (axum) for the microkernel's leaf services; the foundation crates stay framework-free"

[dependencies]
susi-paths = { workspace = true }
susi-error = { workspace = true }
susi-config = { workspace = true }
susi-core = { workspace = true }
susi-sandbox = { workspace = true }
susi-sandbox-client = { workspace = true }
susi-native = { workspace = true }
axum = "0.8.9"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
