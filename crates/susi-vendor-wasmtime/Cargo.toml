[package]
name = "susi-vendor-wasmtime"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
susi-error = { workspace = true }
# Pure Rust interpreter: native JIT/compiler/WASI dependencies are not linked.
wasmi = { version = "=1.0.9", default-features = false, features = ["std", "simd", "extra-checks"] }
getrandom = { package = "susi-vendor-getrandom", path = "../susi-vendor-getrandom" }
# In-process cell runtime (`cell.rs`): the declared-max memory-cap rewrite of
# the module's memory section.
# Only the core-module reader and encoder are used (cell.rs caps the memory
# section before Wasmi validates the module); the default validator,
# component model and serde support are not compiled.
wasm-encoder = { version = "0.259", default-features = false, features = ["std"] }
wasmparser = { version = "0.259", default-features = false, features = ["std"] }
tracing = { workspace = true }

# The WebAssembly text format is a test-time convenience, never a host input:
# the crate accepts binary `.wasm` only (docs/lean-core.md, compile budget),
# so this dependency is dev-scoped and takes `wat` + `wast` out of every
# shipped build. Tests compile their readable fixtures here and hand the
# product the same bytes rustc's wasm32 targets emit.
[dev-dependencies]
wat = "1.259"

[lints]
workspace = true
