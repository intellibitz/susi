[package]
name = "susi-vendor-wasmtime"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
susi-error = { workspace = true }
# Pure Rust interpreter: native JIT/compiler/WASI dependencies are not linked.
wasmi = { version = "=1.0.9", default-features = false, features = ["std", "simd", "extra-checks"] }
getrandom = { package = "susi-vendor-getrandom", path = "../susi-vendor-getrandom" }
# In-process cell runtime (`cell.rs`): the declared-max memory-cap rewrite of
# the module's memory section, and WAT text accepted alongside binary
# (`wat::parse_bytes` passes already-binary modules through).
wasm-encoder = "0.259"
wasmparser = "0.259"
wat = "1.259"
tracing = { workspace = true }

[lints]
workspace = true
