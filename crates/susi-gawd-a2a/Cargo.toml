[package]
name = "susi-gawd-a2a"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
susi-gawd-agents = { workspace = true }
ra2a = { version = "0.10.1", features = ["server", "client"] }
axum = "0.8.9"
tower = { version = "0.5", features = ["limit"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync"] }
tokio-rustls = "0.26"

[features]
default = []
cuda = ["susi-gawd-agents/cuda"]
metal = ["susi-gawd-agents/metal"]

[lints]
workspace = true
