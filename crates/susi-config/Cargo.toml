[package]
name = "susi-config"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
susi-error = { workspace = true }
susi-paths = { workspace = true }
serde = { package = "susi-vendor-serde", path = "../susi-vendor-serde" }
serde_json = { package = "susi-vendor-serde-json", path = "../susi-vendor-serde-json" }
sha2 = { package = "susi-vendor-sha2", path = "../susi-vendor-sha2" }
getrandom = { package = "susi-vendor-getrandom", path = "../susi-vendor-getrandom" }
ed25519-dalek = { package = "susi-vendor-ed25519-dalek", path = "../susi-vendor-ed25519-dalek" }
x25519-dalek = { package = "susi-vendor-x25519-dalek", path = "../susi-vendor-x25519-dalek" }
chacha20poly1305 = { package = "susi-vendor-chacha20poly1305", path = "../susi-vendor-chacha20poly1305" }
# Host metrics and process inspection on every OS (host_metrics,
# process_probe): the one portable source instead of Linux-only /proc reads.

# Process liveness and footprint (process_probe): Windows has no /proc, so a
# lockfile holder's pid is asked about through the process object itself.
[target.'cfg(windows)'.dependencies]
winapi = { package = "susi-vendor-winapi", path = "../susi-vendor-winapi" }
windows-registry = { package = "susi-vendor-windows-registry", path = "../susi-vendor-windows-registry" }

[target.'cfg(unix)'.dependencies]
libc = { package = "susi-vendor-libc", path = "../susi-vendor-libc" }

[lints]
workspace = true
