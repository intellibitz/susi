[package]
name = "susi-gemi"
version = "0.14.1"
license = "Apache-2.0"
edition = "2021"

[dependencies]
susi-abi = { workspace = true, features = ["cell-server"] }
susi-core = { workspace = true }
susi-gemi-models = { workspace = true }
susi-vendor-candle = { workspace = true }
susi-sandbox-client = { workspace = true }
susi-config = { workspace = true }
susi-error = { workspace = true }
susi-paths = { workspace = true }
crossbeam = "0.8"
regex = "1.13"
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = "0.23.2"
indicatif = "0.18.6"
reqwest = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
once_cell = { workspace = true }
flume = { workspace = true }
url = { workspace = true }
sysinfo = "0.39.6"
rayon = "1.12"
hex = { workspace = true }
sha2 = { workspace = true }

[features]
default = []
cuda = ["susi-vendor-candle/cuda", "susi-gemi-models/cuda"]
mkl = ["susi-vendor-candle/mkl"]
metal = ["susi-vendor-candle/metal", "susi-gemi-models/metal"]

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
