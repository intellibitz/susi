[package]
name = "susi-gemi"
version = "0.1.2023079"
edition = "2021"

[dependencies]
susi-error = { path = "../susi-error" }
susi-sandbox = { path = "../susi-sandbox" }
susi-paths = { path = "../susi-paths" }
susi-tools = { path = "../susi-tools" }
susi-agents = { path = "../susi-agents" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.23.2"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
ureq = { version = "3.4.2", features = ["json"] }
tracing = "0.1"
tokio = { version = "1.37", features = ["full"] }
rayon = "1.10"
parking_lot = "0.12"
directories = "6.0.0"
anyhow = "1.0"
once_cell = "1.19"
dashmap = "6.0"
sha2 = "0.11.0"
hound = "3.5"
url = "2.5"
image = "0.25"
hex = "0.4"
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { version = "0.11.0" }
candle-nn = { version = "0.11.0" }
candle-transformers = { version = "0.11.0" }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.11.0", features = ["metal", "accelerate"] }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
