[package]
name = "susi-gemi"
version = "0.9.0"
license = "Apache-2.0"
edition = "2021"

[dependencies]
susi-gemi-models = { workspace = true }
susi-core = { workspace = true }
susi-error = { workspace = true }
susi-sandbox = { workspace = true }
susi-paths = { path = "../susi-paths" }
susi-tools = { workspace = true }
susi-agents = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = "0.23.2"
indicatif = "0.18.6"
reqwest = { workspace = true }
ureq = { version = "3.4.2", features = ["json"] }
tracing = { workspace = true }
tokio = { workspace = true }
rayon = "1.12"
parking_lot = { workspace = true }
directories = "6.0.0"
anyhow = { workspace = true }
once_cell = { workspace = true }
dashmap = { workspace = true }
flume = { workspace = true }
sha2 = { workspace = true }
hound = "3.5"
url = { workspace = true }
image = "0.25"
hex = { workspace = true }
libc = "0.2"
sysinfo = "0.39.6"
agent-client-protocol = "2.2"
agent-client-protocol-http = { version = "2.2", features = ["server"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { version = "0.11.0" }
candle-nn = { version = "0.11.0" }
candle-transformers = { version = "0.11.0" }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.11.0", features = ["metal", "accelerate"] }

[features]
default = []
cuda = ["susi-gemi-models/cuda", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
metal = ["susi-gemi-models/metal", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
