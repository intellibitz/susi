[package]
name = "susi-gemi"
version = "0.14.0"
license = "Apache-2.0"
edition = "2021"

[dependencies]
crossbeam = "0.8"
regex = "1.13"
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = "0.23.2"
indicatif = "0.18.6"
reqwest = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
once_cell = { workspace = true }
flume = { workspace = true }
url = { workspace = true }
sysinfo = "0.39.6"
rayon = "1.12"
libc = "0.2"
ureq = { version = "3.4.2", features = ["json"] }
hex = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { version = "0.11.0" }
candle-nn = { version = "0.11.0" }
candle-transformers = { version = "0.11.0" }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.11.0", features = ["metal", "accelerate"] }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
