[package]
name = "susi-vendor-x25519-dalek"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "SUSI RFC 7748 X25519 Diffie-Hellman facade backed directly by curve25519-dalek (#![forbid(unsafe_code)], zero rand_core/x25519-dalek wrapper crate)."

[dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["digest", "zeroize"] }
zeroize = { version = "1.9", default-features = false }

[lints]
workspace = true
