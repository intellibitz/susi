# SPDX REUSE Specification 3.3 metadata for SUSI Core (zero runtime Rust LOC impact).
version = 1

[[annotations]]
path = [
    "src/**",
    "crates/**",
    "tests/**",
    "fuzz/**",
    "toolchain/**",
    "build.rs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 IntelliBitz"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "scripts/**",
    ".githooks/**",
    ".cargo/**",
    "install.sh",
    "install.ps1",
    "build-gpu.sh",
    "build-gpu.ps1",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 IntelliBitz"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "docs/**",
    "deploy/**",
    "config/**",
    "releases/**",
    "*.md",
    "Cargo.toml",
    "Cargo.lock",
    "clippy.toml",
    "deny.toml",
    "rust-toolchain.toml",
    ".gitattributes",
    ".gitignore",
    ".mcp.json",
    ".susi-repo-role",
    "LICENSE",
    "NOTICE",
    "REUSE.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 IntelliBitz"
SPDX-License-Identifier = "Apache-2.0"
