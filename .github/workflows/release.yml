name: Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x86_64 Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake

      - name: Build CPU Engine
        run: cargo build --release

      - name: Rename CPU Binary
        run: mv target/release/susi-engine susi-engine-linux-x86_64

      - name: Install CUDA Toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y nvidia-cuda-toolkit

      - name: Clean previous Cargo build
        run: cargo clean

      - name: Build GPU-Accelerated Engine (CUDA)
        run: cargo build --release --features cuda

      - name: Rename GPU Binary
        run: mv target/release/susi-engine susi-engine-linux-x86_64-cuda

      - name: Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            susi-engine-linux-x86_64
            susi-engine-linux-x86_64-cuda
