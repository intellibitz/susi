name: Release Binaries

# Merging a version bump into main PUBLISHES it. `susi admin release --cut`
# runs the local gate and pushes the bump's branch, and returns: it never waits
# for the merge or for CI, and nobody pushes a tag by hand. The merge bot
# (scripts/auto-merge-pr.sh) tags a merged, untagged version
# (scripts/release-tag-merged-bump.sh) and dispatches this workflow on the tag:
# a GITHUB_TOKEN merge or tag push starts no workflow, so the bot must. A
# dispatch on a `v*.*.*` tag ref, or a pushed tag, builds and PUBLISHES.
#
# A dispatch on a branch builds only: `softprops/action-gh-release` falls back
# to the ref name, so a dispatch from any branch used to publish a GitHub
# release named after that branch. A build-only dispatch is how a change to
# this pipeline is proven (`gh workflow run release.yml --ref <branch>`)
# without releasing anything.
#
# Shape: `tests` proves the suite on the tagged commit while every build leg
# compiles at the same time; `publish` attaches what the legs uploaded as
# workflow artifacts once both have passed. The wall time is the slower of the
# suite and the slowest leg, not their sum: v0.21.26 took 92 min tag to
# published (19 min waiting for the suite, then the legs: macOS 38, Windows 30
# after a 43 min wait for a runner, linux 16), and the legs could have run
# during those 19 min. A red suite still publishes nothing; it only costs the
# runner minutes the legs spent in parallel.
#
# Every leg builds with thin LTO over 16 codegen units (`CARGO_PROFILE_DIST_*`
# below, overriding Cargo.toml's `[profile.dist]` fat LTO + one unit). The
# single `susi` unit was the long pole of every leg: it starts only after all
# ~700 dependency crates finish and, under fat LTO, runs on one thread (988 s of
# a 1548 s cold build, measured on 28 cores). Thin LTO keeps the cross-crate
# optimisation and runs that unit on every core; Cargo.toml's `[profile.release]`
# note measured the runtime delta as small. Caching dependencies cannot be bought
# here: a cache written by a tag run is readable only by that tag, one written on
# main would need ~2 GB per leg against a 10 GB repository quota that Test
# already fills (see test.yml). Measured on v0.21.27 (2026-10-31): sccache hit 0
# of 892 compiles on the Windows leg, whose cold `cargo build --profile dist`
# took 23.6 of the leg's 28 minutes (Linux: 8.3 of 9). So the legs save no
# target cache (`cache-targets: "false"` below): the ~1 GB a tag run wrote per
# leg could never be read again and only evicted Test's caches, the ones that
# carry every pull request. The sccache wiring stays for a dispatch on a
# branch, which is how a change to this pipeline is proven.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

# One release run per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release tag is a claim — "this version, this code" — and this publishes
  # binaries on any `v*.*.*` tag. Verify the claim before building anything: the
  # tag ruleset protects tags that exist, not the truth of a new one.
  #
  # Output `tag`: the release this run publishes ('' for a branch dispatch,
  # which builds and publishes nothing).
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          # Ancestry against origin/main needs the history, not a shallow clone.
          fetch-depth: 0

      - name: The tag must be this version, on main
        id: tag
        # A tag ref (pushed, or dispatched on by the merge bot) publishes; a
        # branch dispatch is a dry run with no tag to verify.
        run: |
          tag=""
          case "$GITHUB_REF" in refs/tags/*) tag="$GITHUB_REF_NAME" ;; esac
          if [ -n "$tag" ]; then
            git fetch --quiet origin main
            scripts/check-release-tag.sh "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Nothing publishes until the commit the binaries come from has passed the
  # full suite. The cut's local gate is not that proof: bare `cargo test` at
  # this workspace root selects one package of 86, and this workflow ran no
  # tests at all, so the other 85 were covered for a release only by whatever
  # main's run happened to do. scripts/release-await-tests.sh reuses a passed
  # full-suite run for this exact sha (a push to main, or a dispatch whose suite
  # ran - a branch push and the merge bot's `gate=branch` retest only compile
  # and lint), waits for one still running (the post-merge suite the merge bot
  # dispatched on main is usually in flight when the tag lands - dispatching a
  # second one doubled the runner load and the wait), and otherwise dispatches
  # the Test workflow on this ref and waits: the sharded suite, lint and e2e,
  # not the coverage ratchet or the Kani proofs, which gate merges to main.
  # The legs below build while this waits; `publish` needs both.
  tests:
    name: Full suite on the tagged commit
    needs: [verify-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write # dispatch the Test workflow on this ref
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: The suite must pass on exactly this commit
        env:
          GH_TOKEN: ${{ github.token }}
          # A dispatch has no tag; it proves the branch it ran on.
          REF: ${{ needs.verify-tag.outputs.tag || github.ref_name }}
        run: scripts/release-await-tests.sh "$GITHUB_REPOSITORY" "$REF" "$GITHUB_SHA"

  # The legs start with the suite, not after it (see the header): a leg's
  # artifact waits in the run's artifact store until `publish` has seen the
  # suite pass. tests/ci_workflow_perf.rs pins that no leg publishes itself.
  build:
    name: Build ${{ matrix.name }}
    needs: [verify-tag]
    runs-on: ${{ matrix.os }}
    # Slowest leg 31 min: a hung build must not hold a release for the 6 h default.
    timeout-minutes: 75
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTC_WORKSPACE_WRAPPER: sccache
      # Thin LTO over 16 units for the published binaries (header): the one
      # fat-LTO unit was 988 s of the leg on a single thread.
      CARGO_PROFILE_DIST_LTO: thin
      CARGO_PROFILE_DIST_CODEGEN_UNITS: "16"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            artifact: susi-linux-x86_64
            src: target/dist/susi
            harness: susi-harness-linux-x86_64
            harness_src: target/dist/susi-harness
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            artifact: susi-linux-aarch64
            src: target/dist/susi
            harness: susi-harness-linux-aarch64
            harness_src: target/dist/susi-harness
          # macos-x86_64 is not published: ort-sys (ONNX Runtime, via
          # fastembed) no longer ships prebuilt binaries for
          # x86_64-apple-darwin, so the build fails in the ort-sys build
          # script. Re-add if the embedder gains a source-build path.
          - os: macos-15
            name: macos-aarch64
            artifact: susi-macos-aarch64
            src: target/dist/susi
            harness: susi-harness-macos-aarch64
            harness_src: target/dist/susi-harness
          # The Windows artifact is a first-class release leg: the same tag that
          # publishes the Linux and macOS binaries publishes this one, and the
          # built binary is exercised on the runner before it is uploaded.
          - os: windows-latest
            name: windows-x86_64
            artifact: susi-windows-x86_64.exe
            src: target/dist/susi.exe
            harness: susi-harness-windows-x86_64.exe
            harness_src: target/dist/susi-harness.exe
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          # A tag run's target cache is readable by that tag alone (header).
          cache-targets: "false"

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        # Installs only what the runner image lacks, so the common case skips the
        # 15-25 s `apt-get update`. clang is not in that list (the linker wrapper
        # wants it); the image ships it, and this keeps the old guarantee anyway.
        run: |
          scripts/ci-system-deps.sh
          command -v clang >/dev/null || { sudo apt-get update && sudo apt-get install -y clang; }

      - name: Install mold (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci-install-mold.sh

      - name: Build Engine
        id: build
        # Linux x86_64 and Windows are required: they are the two platforms the
        # release is contracted to work on. The arm64 and macOS legs stay soft
        # until they have the same standing.
        continue-on-error: ${{ matrix.name != 'linux-x86_64' && matrix.name != 'windows-x86_64' }}
        # [profile.dist], with the job's thin-LTO override above. The one-line
        # installer uses [profile.release] (thin LTO) for fast source builds.
        # x86_64 links with rustc's bundled lld (no linker is set in .cargo/config.toml); aarch64 links via .cargo/fast-linker (mold when installed above).
        # Schedule the harness alongside the engine while Cargo can share
        # their dependencies. If either fails, retry the engine alone so a
        # harness failure cannot hide a working engine; its own build and
        # verification below still decide whether the harness is published.
        shell: bash
        run: cargo build --profile dist -p susi-harness -p susi || cargo build --profile dist

      - name: Rename Binary
        if: steps.build.outcome == 'success'
        shell: bash
        run: mv "${{ matrix.src }}" "${{ matrix.artifact }}"

      - name: Generate Checksum
        if: steps.build.outcome == 'success'
        shell: bash
        # shasum ships on macOS, sha256sum on Linux and Git Bash on Windows;
        # both write the same `hash  name` line.
        run: |
          if command -v shasum >/dev/null; then
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      # The artifact, not just the source tree, must answer on Windows before
      # it is uploaded: the published .exe is what users run.
      - name: Verify the Windows artifact answers offline
        if: runner.os == 'Windows' && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.artifact }}"
          $home_ = Join-Path $env:RUNNER_TEMP 'e2e-home'
          New-Item -ItemType Directory -Force -Path $home_ | Out-Null
          $env:HOME = $home_
          $env:USERPROFILE = $home_
          $env:XDG_CONFIG_HOME = Join-Path $home_ 'xdg-config'
          # From the scratch home, never the checkout: in the checkout `susi
          # tasks` read the repository's own queue instead of an empty one,
          # and every release from v0.21.21 to v0.21.23 failed this required
          # leg and shipped no Windows binary. The release gate's local e2e
          # checks run the same way, in a scratch directory.
          Set-Location $home_
          $failed = @()
          function Check {
            param([string]$Name, [int]$Want, [string]$Needle, [string[]]$Argv)
            $out = (& $bin @Argv 2>&1 | Out-String)
            $code = $LASTEXITCODE
            if ($code -ne $Want) { throw "$Name`: exit $code, expected $Want`n$out" }
            if ($Needle -and ($out -notmatch [regex]::Escape($Needle))) { throw "$Name`: missing '$Needle'`n$out" }
            Write-Host "ok: $Name"
          }
          Check 'brain classify' 0 '"task_class": "code"' @('brain','classify','fix','this','bug','in','my','parser')
          Check 'brain status' 0 'cooled_providers' @('brain','status','--json')
          Check 'ecosystem scan' 0 '"engines"' @('ecosystem','scan')
          Check 'tasks' 0 '"open": []' @('tasks')
          Check 'workflow check' 1 'not ready' @('workflow','check')
          Check 'release --help refused' 2 'looks like a command' @('release','--help')
          Check 'nested command refused' 2 'susi ecosystem scan' @('scan')
          # Every check passed (a failure throws). The runner ends a pwsh step
          # with `exit $LASTEXITCODE`, which still holds the refused command's
          # expected 2: v0.21.25 printed seven `ok:` lines, failed this step,
          # and published no Windows binary.
          exit 0

      # Into the run's artifact store, not the release: `publish` attaches it
      # once the suite has passed. A dispatch is a dry run and stores nothing.
      - name: Upload Artifacts
        if: needs.verify-tag.outputs.tag != '' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 3

      # The harness ships on its own. It needs nothing else from susi (the
      # registry and price catalogue are compiled in), so it builds, is checked
      # and is published even when the engine above fails: when nothing else
      # works, the harness still meters, budgets and routes model calls.
      # `!cancelled()`, not `always()`: `always()` holds after a cancel or the
      # job timeout too, so a cancelled release still ran this fat-LTO build in
      # the runner's grace period and could publish a release holding only the
      # harness - one that becomes `latest`, where install.sh and install.ps1
      # then find no engine.
      - name: Build Harness
        id: harness
        if: ${{ !cancelled() }}
        continue-on-error: ${{ matrix.name != 'linux-x86_64' && matrix.name != 'windows-x86_64' }}
        shell: bash
        run: |
          cargo build --profile dist -p susi-harness --bin susi-harness
          mv "${{ matrix.harness_src }}" "${{ matrix.harness }}"
          if command -v shasum >/dev/null; then
            shasum -a 256 "${{ matrix.harness }}" > "${{ matrix.harness }}.sha256"
          else
            sha256sum "${{ matrix.harness }}" > "${{ matrix.harness }}.sha256"
          fi

      # The artifact must answer with no keys and no workspace: the built-in
      # registry and catalogue, an empty ledger, a budget line. It must also say
      # it is this release: the harness crate is versioned with the engine, yet
      # stood at 0.21.20 while the tag it was built for said 0.21.23, and
      # nothing compared the two.
      # Soft exactly where the build is: an optional leg's harness cannot fail
      # the release, and the upload below still refuses what did not pass here.
      - name: Verify the harness artifact answers offline
        id: harness_verify
        if: ${{ !cancelled() && steps.harness.outcome == 'success' }}
        continue-on-error: ${{ matrix.name != 'linux-x86_64' && matrix.name != 'windows-x86_64' }}
        shell: bash
        run: |
          bin="$GITHUB_WORKSPACE/${{ matrix.harness }}"
          # The root package's version, read as scripts/check-release-tag.sh
          # reads it; on a tag push verify-tag has proven the tag equals it. The
          # Windows runner checks out with CRLF, hence the `tr`.
          release=$(awk '/^\[package\]/{p=1} p && /^version[[:space:]]*=/{gsub(/[",]/, "", $3); print $3; exit}' Cargo.toml | tr -d '\r')
          cd "$RUNNER_TEMP"
          reported=$("$bin" version)
          echo "$reported"
          if [ "$reported" != "susi-harness $release" ]; then
            echo "the harness reports '$reported'; this release is $release" >&2
            exit 1
          fi
          "$bin" env > /dev/null
          # Captured, then matched: under the step's pipefail, `"$bin" | grep -q`
          # fails whenever grep matches and exits before the binary's last
          # write, which then dies of EPIPE.
          out=$("$bin" budget --ledger "$RUNNER_TEMP/harness-ledger.jsonl")
          grep -q '^budget:' <<<"$out"
          # Zero config with no key: the first run explains how to bring one.
          out=$(SUSI_HOME="$RUNNER_TEMP/harness-home" "$bin")
          grep -q 'No API key found' <<<"$out"

      # Only a binary that passed its own check ships. Gated on the build alone,
      # under `always()`, a harness that failed the check above was still
      # attached to the release, and a cancelled run could still publish.
      - name: Upload Harness
        if: needs.verify-tag.outputs.tag != '' && !cancelled() && steps.harness_verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-harness-${{ matrix.name }}
          path: |
            ${{ matrix.harness }}
            ${{ matrix.harness }}.sha256
          if-no-files-found: error
          retention-days: 3

  build-cuda:
    name: Build linux-x86_64-cuda
    needs: [verify-tag]
    # Pinned, not ubuntu-latest: 26.04's apt CUDA is 12.4, which defines
    # __hmax_nan/__hmin_nan itself, and candle-kernels' compatibility.cuh
    # redefines them below compute capability 80 (we target 75), so every
    # release from v0.21.22 shipped no CUDA build. 24.04 carries CUDA 12.0.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTC_WORKSPACE_WRAPPER: sccache
      CARGO_PROFILE_DIST_LTO: thin
      CARGO_PROFILE_DIST_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-cuda-linux-x86_64
          # A tag run's target cache is readable by that tag alone (header).
          cache-targets: "false"

      - name: Install System Dependencies
        run: |
          scripts/ci-system-deps.sh
          command -v clang >/dev/null || { sudo apt-get update && sudo apt-get install -y clang; }

      - name: Install mold
        run: scripts/ci-install-mold.sh

      - name: Install CUDA Toolkit
        # Without recommends: 80 packages / 1.6 GB instead of 375 / 2.6 GB (measured
        # on ubuntu:24.04). The extras are Nsight, the visual profiler, cuda-gdb,
        # Java and docs; nvcc, the headers and libcublas/cudart/curand/nvrtc/cusolver
        # that the bundle step collects are all hard dependencies. patchelf rides
        # along so the bundle step needs no second apt transaction.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit patchelf

      - name: Build GPU-Accelerated Engine (CUDA)
        id: build
        continue-on-error: true
        # candle-kernels' build script shells out to `nvidia-smi` to detect
        # the compute capability to target - CI runners have no GPU, so that
        # probe fails outright ("Failed to run nvidia-smi: No such file or
        # directory"). CUDA_COMPUTE_CAP short-circuits that probe. 75
        # (Turing) is used as a broadly-compatible baseline for this
        # distributed binary; a contributor building for their own GPU
        # should use ./build-gpu.sh instead, which auto-detects it.
        run: CUDA_COMPUTE_CAP=75 cargo build --profile dist --features cuda

      - name: Bundle CUDA Runtime Libraries
        if: steps.build.outcome == 'success'
        # cuBLAS/cuDART's SONAME is tied to this specific CUDA major version
        # (e.g. libcublas.so.12) - a machine with a *different* major CUDA
        # version installed (even a newer, fully working one) doesn't have
        # that exact file, and the binary fails to even start ("error while
        # loading shared libraries"), verified live against a real CUDA 13.4
        # host. Bundle the runtime libs this binary actually links against
        # (recursively - libcublas itself depends on libcublasLt) next to
        # it and rpath to them, so the target machine's own CUDA runtime
        # version never matters. libcuda.so (the driver, forward/backward
        # compatible by NVIDIA's own guarantee) is deliberately left as a
        # normal system dependency, not bundled.
        run: |
          set -e
          mkdir -p lib
          CUDA_LIB_RE='lib(cublas|cudart|cusparse|cusolver|cufft|curand|cudnn|nvrtc|nvJitLink|nvToolsExt)'
          collect_cuda_libs() {
            ldd "$1" 2>/dev/null | grep -E "$CUDA_LIB_RE" | awk '{print $1, $3}' | \
              while read -r name path; do
                [ -f "lib/$name" ] && continue
                [ -n "$path" ] && [ -f "$path" ] || continue
                cp -L "$path" "lib/$name"
                collect_cuda_libs "lib/$name"
              done
          }
          collect_cuda_libs target/dist/susi
          patchelf --set-rpath '$ORIGIN/lib' target/dist/susi
          if ldd target/dist/susi | grep -q "not found"; then
            echo "Error: binary still has unresolved shared library dependencies after bundling:" >&2
            ldd target/dist/susi | grep "not found" >&2
            exit 1
          fi

      - name: Package Binary + Bundled Libraries
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p dist/lib
          mv target/dist/susi dist/susi-linux-x86_64-cuda
          mv lib/* dist/lib/
          tar -czf susi-linux-x86_64-cuda.tar.gz -C dist susi-linux-x86_64-cuda lib

      - name: Generate Checksum
        if: steps.build.outcome == 'success'
        run: shasum -a 256 susi-linux-x86_64-cuda.tar.gz > susi-linux-x86_64-cuda.tar.gz.sha256

      - name: Upload Artifacts
        if: needs.verify-tag.outputs.tag != '' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-cuda-linux-x86_64
          path: |
            susi-linux-x86_64-cuda.tar.gz
            susi-linux-x86_64-cuda.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  # The one step that touches the GitHub release: every artifact the legs
  # stored, attached once the suite has passed on this commit. The legs'
  # results are not a gate here beyond "finished": a leg that failed uploaded
  # nothing (its upload is on its own build's outcome), and the legs that
  # passed ship, exactly as each used to publish itself - a red required leg
  # still fails the run. `!cancelled()` so a cancelled run publishes nothing,
  # and the tag so a dispatch (a dry run) publishes nothing.
  publish:
    name: Publish the release
    needs: [verify-tag, tests, build, build-cuda]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!cancelled() && needs.verify-tag.outputs.tag != '' && needs.tests.result == 'success' && contains('success failure', needs.build.result) && contains('success failure', needs.build-cuda.result)"
    steps:
      - name: Collect the legs' artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish the release assets
        if: needs.verify-tag.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify-tag.outputs.tag }}
          fail_on_unmatched_files: true
          files: release/*

  # Retention: keep rolling `dev` (other workflow) + newest 2 semver Releases.
  # Older GitHub Release *objects* (and their ~700MB assets) are deleted;
  # git tags are never removed so history stays intact.
  prune-old-releases:
    name: Prune old GitHub Releases
    needs: [verify-tag, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Tier-1 build job builds the Linux x86_64 binary; non-Tier-1 artifacts
    # (macOS, ARM64, CUDA) are non-blocking, so prune runs as long as Tier-1
    # succeeded and `publish` attached the assets.
    if: "!cancelled() && needs.build.result == 'success' && needs.publish.result == 'success' && needs.verify-tag.outputs.tag != ''"
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Prune semver releases beyond retention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_SEMVER_RELEASES: "2"
        run: |
          chmod +x scripts/prune-old-github-releases.sh
          ./scripts/prune-old-github-releases.sh
