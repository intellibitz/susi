name: Dev Release (main)

# Rolling pre-release that always reflects the tip of `main`. Unlike
# release.yml (tag-triggered, immutable, semver), this workflow moves a
# single `dev` tag forward on every push and republishes the same release
# in place, so there is never more than one dev release cluttering the
# releases page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  move-tag:
    name: Move dev tag to HEAD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Force-update dev tag
        run: |
          git tag -f dev
          git push origin dev --force

  build:
    name: Build ${{ matrix.name }}
    needs: move-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            artifact: susi-linux-x86_64
            src: target/dist/susi
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            artifact: susi-linux-aarch64
            src: target/dist/susi
          # macos-x86_64 is not published: ort-sys (ONNX Runtime, via
          # fastembed) no longer ships prebuilt binaries for
          # x86_64-apple-darwin, so the build fails in the ort-sys build
          # script. Re-add if the embedder gains a source-build path.
          - os: macos-14
            name: macos-aarch64
            artifact: susi-macos-aarch64
            src: target/dist/susi
    # Windows builds are not published here: the cfg(windows) build of
    # wasmer used on that target pulls in wasmer-compiler-singlepass,
    # which is BUSL-1.1 licensed and requires a paid Wasmer sponsorship
    # for production use. Re-add once there's a compliant Windows backend.
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake clang

      - name: Install mold (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          VER=2.40.4
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|aarch64) ;;
            *) echo "Skipping mold on $ARCH"; exit 0 ;;
          esac
          NAME="mold-${VER}-${ARCH}-linux"
          curl -sSfL "https://github.com/rui314/mold/releases/download/v${VER}/${NAME}.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          mold --version
          command -v ld.mold
          command -v clang

      - name: Build Engine
        # [profile.dist]: fat LTO for published binaries; install.sh uses thin.
        # Linux links via .cargo/fast-linker (mold when installed above).
        run: cargo build --profile dist

      - name: Rename Binary
        shell: bash
        run: mv "${{ matrix.src }}" "${{ matrix.artifact }}"

      - name: Generate Checksum
        shell: bash
        run: shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Publish Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Development Build (main)"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Automated build of `main` @ ${{ github.sha }}.

            This release is overwritten on every push to `main` — it is not
            a stable release. For production use, use a tagged `vX.Y.Z`
            release instead.
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  build-cuda:
    name: Build linux-x86_64-cuda
    needs: move-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake clang

      - name: Install mold
        run: |
          set -euo pipefail
          VER=2.40.4
          ARCH="$(uname -m)"
          NAME="mold-${VER}-${ARCH}-linux"
          curl -sSfL "https://github.com/rui314/mold/releases/download/v${VER}/${NAME}.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          mold --version
          command -v ld.mold

      - name: Install CUDA Toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y nvidia-cuda-toolkit

      - name: Build GPU-Accelerated Engine (CUDA)
        # See release.yml for why CUDA_COMPUTE_CAP is hardcoded here.
        run: CUDA_COMPUTE_CAP=75 cargo build --profile dist --features cuda

      - name: Bundle CUDA Runtime Libraries
        # See release.yml for why this is needed: cuBLAS/cuDART's SONAME is
        # tied to this specific CUDA major version, so a target machine with
        # a different (even newer) major version installed can't run the
        # binary at all without these bundled alongside it.
        run: |
          set -e
          sudo apt-get install -y patchelf
          mkdir -p lib
          CUDA_LIB_RE='lib(cublas|cudart|cusparse|cusolver|cufft|curand|cudnn|nvrtc|nvJitLink|nvToolsExt)'
          collect_cuda_libs() {
            ldd "$1" 2>/dev/null | grep -E "$CUDA_LIB_RE" | awk '{print $1, $3}' | \
              while read -r name path; do
                [ -f "lib/$name" ] && continue
                [ -n "$path" ] && [ -f "$path" ] || continue
                cp -L "$path" "lib/$name"
                collect_cuda_libs "lib/$name"
              done
          }
          collect_cuda_libs target/dist/susi
          patchelf --set-rpath '$ORIGIN/lib' target/dist/susi
          if ldd target/dist/susi | grep -q "not found"; then
            echo "Error: binary still has unresolved shared library dependencies after bundling:" >&2
            ldd target/dist/susi | grep "not found" >&2
            exit 1
          fi

      - name: Package Binary + Bundled Libraries
        run: |
          mkdir -p dist/lib
          mv target/dist/susi dist/susi-linux-x86_64-cuda
          mv lib/* dist/lib/
          tar -czf susi-linux-x86_64-cuda.tar.gz -C dist susi-linux-x86_64-cuda lib

      - name: Generate Checksum
        run: shasum -a 256 susi-linux-x86_64-cuda.tar.gz > susi-linux-x86_64-cuda.tar.gz.sha256

      - name: Publish Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Development Build (main)"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            susi-linux-x86_64-cuda.tar.gz
            susi-linux-x86_64-cuda.tar.gz.sha256
