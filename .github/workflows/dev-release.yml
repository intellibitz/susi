name: Dev Release (main)

# Rolling pre-release that reflects the tip of `main`. Unlike
# release.yml (tag-triggered, immutable, semver), this workflow moves a
# single `dev` tag forward and republishes the same release in place.
# It runs on manual dispatch or when the head commit carries a dev-release marker in the head
# commit's subject line — multi-agent iteration pushes to `main` are too frequent for a
# multi-OS matrix build per push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  move-tag:
    name: Move dev tag to HEAD
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, '[dev-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Force-update dev tag
        run: |
          git tag -f dev
          git push origin dev --force

  build:
    name: Build ${{ matrix.name }}
    needs: move-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            artifact: susi-linux-x86_64
            src: target/dist/susi
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            artifact: susi-linux-aarch64
            src: target/dist/susi
          # macos-x86_64 is not published: ort-sys (ONNX Runtime, via
          # fastembed) no longer ships prebuilt binaries for
          # x86_64-apple-darwin, so the build fails in the ort-sys build
          # script. Re-add if the embedder gains a source-build path.
          - os: macos-14
            name: macos-aarch64
            artifact: susi-macos-aarch64
            src: target/dist/susi
    # Windows builds are not yet published here: the wasmtime backend is
    # license-clean on windows-msvc, so the backend blocker is gone — the
    # Windows release leg itself (runner, installer, validation) is still
    # to be added.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTC_WORKSPACE_WRAPPER: sccache
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev-release-${{ matrix.name }}
          cache-targets: "true"

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          scripts/ci-system-deps.sh
          command -v clang >/dev/null || { sudo apt-get update && sudo apt-get install -y clang; }

      - name: Install mold (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci-install-mold.sh

      - name: Build Engine
        id: build
        continue-on-error: ${{ matrix.name != 'linux-x86_64' }}
        # [profile.dist]: fat LTO for published binaries; install.sh uses thin.
        # x86_64 links with rustc's bundled lld (no linker is set in .cargo/config.toml); aarch64 links via .cargo/fast-linker (mold when installed above).
        run: cargo build --profile dist

      - name: Rename Binary
        if: steps.build.outcome == 'success'
        shell: bash
        run: mv "${{ matrix.src }}" "${{ matrix.artifact }}"

      - name: Generate Checksum
        if: steps.build.outcome == 'success'
        shell: bash
        run: shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Publish Dev Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: "Development Build (main)"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Automated build of `main` @ ${{ github.sha }}.

            This release is overwritten on each marker-flagged push to `main` — it is not
            a stable release. For production use, use a tagged `vX.Y.Z`
            release instead.
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  build-cuda:
    name: Build linux-x86_64-cuda
    needs: move-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTC_WORKSPACE_WRAPPER: sccache
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev-release-cuda-linux-x86_64
          cache-targets: "true"

      - name: Install System Dependencies
        run: |
          scripts/ci-system-deps.sh
          command -v clang >/dev/null || { sudo apt-get update && sudo apt-get install -y clang; }

      - name: Install mold
        run: scripts/ci-install-mold.sh

      - name: Install CUDA Toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit patchelf

      - name: Build GPU-Accelerated Engine (CUDA)
        id: build
        continue-on-error: true
        # See release.yml for why CUDA_COMPUTE_CAP is hardcoded here.
        run: CUDA_COMPUTE_CAP=75 cargo build --profile dist --features cuda

      - name: Bundle CUDA Runtime Libraries
        if: steps.build.outcome == 'success'
        # See release.yml for why this is needed: cuBLAS/cuDART's SONAME is
        # tied to this specific CUDA major version, so a target machine with
        # a different (even newer) major version installed can't run the
        # binary at all without these bundled alongside it.
        run: |
          set -e
          mkdir -p lib
          CUDA_LIB_RE='lib(cublas|cudart|cusparse|cusolver|cufft|curand|cudnn|nvrtc|nvJitLink|nvToolsExt)'
          collect_cuda_libs() {
            ldd "$1" 2>/dev/null | grep -E "$CUDA_LIB_RE" | awk '{print $1, $3}' | \
              while read -r name path; do
                [ -f "lib/$name" ] && continue
                [ -n "$path" ] && [ -f "$path" ] || continue
                cp -L "$path" "lib/$name"
                collect_cuda_libs "lib/$name"
              done
          }
          collect_cuda_libs target/dist/susi
          patchelf --set-rpath '$ORIGIN/lib' target/dist/susi
          if ldd target/dist/susi | grep -q "not found"; then
            echo "Error: binary still has unresolved shared library dependencies after bundling:" >&2
            ldd target/dist/susi | grep "not found" >&2
            exit 1
          fi

      - name: Package Binary + Bundled Libraries
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p dist/lib
          mv target/dist/susi dist/susi-linux-x86_64-cuda
          mv lib/* dist/lib/
          tar -czf susi-linux-x86_64-cuda.tar.gz -C dist susi-linux-x86_64-cuda lib

      - name: Generate Checksum
        if: steps.build.outcome == 'success'
        run: shasum -a 256 susi-linux-x86_64-cuda.tar.gz > susi-linux-x86_64-cuda.tar.gz.sha256

      - name: Publish Dev Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: "Development Build (main)"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            susi-linux-x86_64-cuda.tar.gz
            susi-linux-x86_64-cuda.tar.gz.sha256
