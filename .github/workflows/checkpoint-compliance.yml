# Deploy with its verifier and authority bundle on an independently protected
# authority main, never on a PR branch. Dispatch requires a protected environment.
# The original push workflow and remote T-task gate remain intact.
name: Independent Susi workflow compliance
on:
  repository_dispatch:
    types: [susi-pr-compliance]
  workflow_dispatch:
    inputs:
      pr:
        description: Susi pull request number
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.repository != 'intellibitz/susi' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    environment: susi-checkpoint-authority
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture live subject from the fixed repository
        id: subject
        env:
          GH_TOKEN: ${{ secrets.SUSI_SUBJECT_READ_TOKEN }}
          PR: ${{ inputs.pr || github.event.client_payload.pr }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $PR =~ ^[1-9][0-9]*$ ]]
          gh api "repos/intellibitz/susi/pulls/$PR" > "$RUNNER_TEMP/subject.json"
          jq -e '.state=="open" and .base.repo.full_name=="intellibitz/susi" and .base.ref=="main"' "$RUNNER_TEMP/subject.json"
          head=$(jq -er .head.sha "$RUNNER_TEMP/subject.json")
          base=$(jq -er .base.sha "$RUNNER_TEMP/subject.json")
          [[ $head =~ ^[0-9a-f]{40}$ && $base =~ ^[0-9a-f]{40}$ ]]
          gh auth setup-git
          git init -q "$RUNNER_TEMP/subject"
          cd "$RUNNER_TEMP/subject"
          git remote add origin https://github.com/intellibitz/susi.git
          git fetch --quiet --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/pull/$PR/head:refs/remotes/origin/subject"
          test "$(git rev-parse origin/main)" = "$base"
          test "$(git rev-parse origin/subject)" = "$head"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Verify independently of proposed code
        id: gate
        env:
          PR: ${{ inputs.pr || github.event.client_payload.pr }}
          GH_TOKEN: ${{ secrets.SUSI_SUBJECT_READ_TOKEN }}
          PRIMARY: ${{ vars.SUSI_CHECKPOINT_PRIMARY_FINGERPRINT }}
          HEAD: ${{ steps.subject.outputs.head }}
          BASE: ${{ steps.subject.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/subject"
          branch=$(jq -er .head.ref "$RUNNER_TEMP/subject.json")
          if [[ $PR == 1299 || $branch == codex/step1-qualified-0.21.43 ]]; then
            jq -e '.head.repo.full_name=="intellibitz/susi"' "$RUNNER_TEMP/subject.json"
            bundle="$GITHUB_WORKSPACE/authority/checkpoint-1299"
            cargo run --locked --package xtask --bin checkpoint-compliance -- verify "$repo" "$bundle/native-receipt" "$bundle/publication.json" "$bundle/statement.json" intellibitz/susi "$PR" main "$branch" "$BASE" "$HEAD" "$bundle/statement.sig" "$bundle/authority.gpg" "$PRIMARY"
          else
            cd "$repo"
            git checkout -q --detach "$BASE"
            bash scripts/fetch-workflow-refs.sh origin
            test "$(git rev-parse origin/main)" = "$BASE"
            SUSI_WORKFLOW_REFS_FETCHED=1 bash scripts/check-workflow-compliance.sh "$BASE" "$HEAD" origin "$branch"
          fi
      - name: Report the exact checked head through the independent App
        if: always() && steps.subject.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.SUSI_CHECK_APP_TOKEN }}
          PR: ${{ inputs.pr || github.event.client_payload.pr }}
          HEAD: ${{ steps.subject.outputs.head }}
          BASE: ${{ steps.subject.outputs.base }}
          OUTCOME: ${{ steps.gate.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          result=failure
          if [[ $OUTCOME == success ]] && gh api "repos/intellibitz/susi/pulls/$PR" |
            jq -e --arg h "$HEAD" --arg b "$BASE" '.state=="open" and .head.sha==$h and .base.sha==$b' &&
            [[ $(gh api repos/intellibitz/susi/git/ref/heads/main --jq '.object.sha') == "$BASE" ]]; then result=success; fi
          gh api -X POST repos/intellibitz/susi/check-runs -f 'name=Independent Workflow Compliance' -f head_sha="$HEAD" -f status=completed -f conclusion="$result" -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
          test "$result" = success
