name: Windows build timing (experiment)

# Throwaway measurement on a nopr/ branch (auto-merge never opens a PR for it).
# Same build as test.yml's `windows` job, in variants, beside that job's own
# run as the baseline:
#   devdrive - target/ on a ReFS Dev Drive (trusted: Defender scans it in
#              performance mode), no target cache
#   cache    - target/ in place, dependency artifacts cached by rust-cache
#              (saved on this branch; a re-run of this workflow is the warm number)
on:
  push:
    branches: ['nopr/windows-build-timing']

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    name: windows (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [devdrive, cache]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Runner facts
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          (Get-CimInstance Win32_OperatingSystem).Caption
          "cores: $env:NUMBER_OF_PROCESSORS"

      - name: Create a Dev Drive for target/
        if: matrix.variant == 'devdrive'
        shell: pwsh
        run: |
          $vol = New-VHD -Path D:/devdrive.vhdx -SizeBytes 40GB -Dynamic |
            Mount-VHD -Passthru | Initialize-Disk -Passthru |
            New-Partition -AssignDriveLetter -UseMaximumSize |
            Format-Volume -DevDrive -Confirm:$false -Force
          $drive = "$($vol.DriveLetter):"
          fsutil devdrv trust $drive
          fsutil devdrv query $drive
          "CARGO_TARGET_DIR=$drive\target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache Cargo (registry only)
        if: matrix.variant == 'devdrive'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-binary
          cache-targets: "false"
          save-if: "false"

      - name: Cache Cargo (registry and dependency artifacts)
        if: matrix.variant == 'cache'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-exp-targets
          cache-targets: "true"
          save-if: "true"

      - name: Build the binary and run the release e2e checks
        run: cargo test --locked --test release_e2e_checks
