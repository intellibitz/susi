name: Windows ARM64

# Windows on ARM64 source support (CEO decision 2026-11-03): the public core
# release is x86_64 Windows and x86_64 Linux only, but ARM64 Windows stays in
# the source so susi-commercial-apps can build its own certified binaries.
# This job proves on a native ARM64 host (the runtime gate refuses cross
# builds) what that source claims: the runtime unit and lifecycle fixtures, the
# OS-UCRT boundary fixtures and the native link evidence checks. It does not
# qualify ARM64 for production.
#
# Its own workflow, not a job in test.yml: a cold ARM64 run is budgeted up to
# two hours (not yet measured), and every Test run's completion is waited on
# (the auto-merge.yml workflow_run backstop, scripts/reconcile-prs.sh,
# scripts/release-await-tests.sh and main's queued post-merge suite). Nothing
# waits on this run. It runs after a merge to main and on manual dispatch,
# never on a branch push, so it is off the merge gate and NOT a required status
# check (scripts/github-enforce.sh).
# `continue-on-error` keeps a red ARM64 result visible on the job without
# reddening the run.
#
# Nothing is cached: the repository sits at its 10 GB cache quota (top of
# test.yml), so any new entry, registry or target, would evict the required
# jobs' caches. Every run compiles the dependency graph cold; the timeout
# allows for that. The windows-arm64-probe workflow records the runner facts
# this job relies on.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Merges land faster than this job runs. A running check is never cancelled
# (latest-wins would cancel every run, as it did the main suite on 2026-10-28);
# the merges that land meanwhile collapse into one pending run.
concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-arm64:
    name: Windows ARM64 (native source checks)
    runs-on: windows-11-arm
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The runtime build script requires exactly this identity (host equal to
      # target, release 1.99.0, pinned commit); fail here with the reason
      # instead of deep inside a build script.
      - name: The pinned compiler is native ARM64
        shell: pwsh
        run: |
          $identity = rustc -vV
          $identity | ForEach-Object { Write-Host $_ }
          if (-not ($identity -contains 'host: aarch64-pc-windows-msvc')) { throw 'rustc is not the native aarch64-pc-windows-msvc compiler' }
          if (-not ($identity -contains 'release: 1.99.0')) { throw 'rustc is not the pinned 1.99.0 release' }

      # xtask/bootstrap/os_ucrt.rs imports ARM64 `__chkstk` from kernelbase.dll
      # (a hypothesis recorded there). Assert the export before any fixture
      # links against it, from a native ARM64 view of the DLL.
      - name: The OS exports the ARM64 stack probe the link layer imports
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
          Write-Host "$((Get-Date).ToUniversalTime().ToString('o')) pwsh process architecture: $arch"
          if ("$arch" -eq 'Arm64') {
            $handle = [System.Runtime.InteropServices.NativeLibrary]::Load('kernelbase.dll')
            $address = [IntPtr]::Zero
            if (-not [System.Runtime.InteropServices.NativeLibrary]::TryGetExport($handle, '__chkstk', [ref]$address)) {
              throw 'ARM64 kernelbase.dll does not export __chkstk; change ARM64.stack_dll in xtask/bootstrap/os_ucrt.rs'
            }
          } else {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $dumpbin = @(
              & $vswhere -latest -products * -find 'VC/Tools/MSVC/*/bin/Hostarm64/arm64/dumpbin.exe'
              & $vswhere -latest -products * -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe'
            ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
            if (-not $dumpbin) { throw 'pwsh is not native ARM64 and no dumpbin.exe was found: the export cannot be asserted' }
            $exports = & $dumpbin /nologo /exports (Join-Path $env:SystemRoot 'System32\kernelbase.dll') | Out-String
            if ($exports -notmatch '\s__chkstk(\s|$)') { throw 'kernelbase.dll lists no __chkstk export' }
          }
          Write-Host 'kernelbase.dll exports __chkstk'

      - name: Runtime unit tests
        run: cargo test --locked -p susi-windows-runtime

      # The twelve subprocess cases, unwind and fat-LTO abort, against the
      # stock 1.99.0 ARM64 standard library (standalone diagnostic mode: no
      # verified product sysroot is handed to this job).
      - name: Runtime lifecycle fixtures
        run: cargo test --locked --test windows_runtime_lifecycle

      - name: OS-UCRT boundary fixtures
        run: cargo test --locked -p xtask --test os_ucrt_boundary

      - name: Native link evidence unit checks
        run: cargo test --locked -p xtask --features release-tooling --bin local-release -- native_link pe_imports

      # The actual tooling executables: PE entry is susi_pe_entry, the COFF
      # Machine is ARM64, the map holds no MSVC CRT startup members. The debug
      # `susi` map (273 MB on x64) exceeds check-native-link's 256 MiB evidence
      # budget, so Susi's own link evidence stays with the optimized release
      # qualification; its debug build still links through the same layer in
      # the lifecycle step's root-package build above.
      - name: Native link evidence on the built executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked -p xtask --features release-tooling --bins
          foreach ($binary in 'xtask', 'local-workflow', 'local-release', 'ci-release-only', 'susi-dev') {
            $exe = "target/debug/$binary.exe"
            $map = "target/debug/deps/$($binary.Replace('-', '_')).map"
            Write-Host "$((Get-Date).ToUniversalTime().ToString('o')) check-native-link $binary"
            $evidence = & ./target/debug/local-release.exe check-native-link $exe $map | Out-String
            $record = $evidence | ConvertFrom-Json
            Write-Host "$binary entry=$($record.entry) artifact_sha256=$($record.artifact_sha256) map_sha256=$($record.map_sha256)"
          }
