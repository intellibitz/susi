name: Cloud target seed

# A cloud session's container starts with no target/: every registry and git
# crate of the dependency tree compiled cold before its first `susi workflow
# check` (about 15 minutes on 4 vCPU), and the finish gate's clippy of a changed
# crate's dependents check-built them again (210 s measured). A laptop's
# worktrees copy a warm snapshot from the primary checkout; a container has no
# primary. This builds origin/main the way a cloud session does — the pinned
# toolchain, and the cargo configuration scripts/cloud-onnxruntime.sh writes
# (ONNX Runtime at the container's path, its rpath in every unit's rustflags),
# at the container's checkout path — strips the workspace's own units (`susi
# workflow seed-target --export`), and publishes the rest as assets of the
# rolling `target-seed` pre-release, named by the key scripts/cloud-target-seed.sh
# computes from everything those units' fingerprints depend on. The session-start
# hook fetches the asset for its key, or the newest one. docs/cloud-sessions.md.
#
# It is dispatched by every green Test run on main (test.yml's `warm-release`
# job, as release-warm.yml is), runs every six hours as a fallback and on
# demand, and on a push to main that touches a key input — though main is
# written by the merge job with GITHUB_TOKEN, whose pushes trigger no `push`
# workflow (the first merge of this file ran nothing), which is why Test
# dispatches it. A key whose snapshot is already published costs one checkout;
# until a new key's snapshot exists, sessions take the newest one and recompile
# the crates that differ. The parts are kept under 1.9 GB each (a release
# asset's limit is 2 GiB).

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - scripts/cloud-onnxruntime.sh
      - scripts/cloud-target-seed.sh
      - .github/workflows/target-seed.yml
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and republish even when this key's snapshot exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: target-seed-main
  cancel-in-progress: false

env:
  RELEASE_TAG: target-seed
  # The cloud container's paths: the clone, and the ONNX Runtime the hook
  # installs under its HOME (/root). The variable is what every call of
  # scripts/cloud-onnxruntime.sh — the install, the check, the key's config
  # block — reads, so the configuration here is byte for byte the container's.
  CLOUD_CHECKOUT: /home/user/susi
  CLOUD_ORT_DIR: /root/.cache/susi/onnxruntime
  SUSI_ONNXRUNTIME_DIR: /root/.cache/susi/onnxruntime

jobs:
  seed:
    name: Build and publish the Linux x86_64 snapshot
    if: github.repository == 'intellibitz/susi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: scripts/ci-system-deps.sh

      # The container's layout, so every path a fingerprint or a build script
      # output records is the one the container has.
      - name: Lay the checkout out as the container does
        run: |
          sudo mkdir -p /home/user
          sudo chown "$(id -u):$(id -g)" /home/user
          cp -a "$GITHUB_WORKSPACE" "$CLOUD_CHECKOUT"
          sudo chmod 755 /root
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$CLOUD_ORT_DIR"
          cd "$CLOUD_CHECKOUT"
          scripts/cloud-onnxruntime.sh
          scripts/cloud-onnxruntime.sh --check
          # The container's and this job's configuration blocks must agree, or
          # the key here names a snapshot no container ever looks for.
          scripts/cloud-onnxruntime.sh --print-config | grep -F "$CLOUD_ORT_DIR"

      - name: Resolve the snapshot key
        id: key
        working-directory: /home/user/susi
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # The pinned toolchain is what the container resolves too.
          rustc -vV
          name=$(scripts/cloud-target-seed.sh --name)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "snapshot: $name"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Cloud target seed" \
              --notes "Snapshots of origin/main's registry and git crates for cloud sessions (scripts/cloud-target-seed.sh). Rolling; not a release of susi."
          fi
          published=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if [ "$FORCE" != true ] && printf '%s\n' "$published" | grep -qx "$name.manifest"; then
            echo "already published; nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Make room for the build and the snapshot
        if: steps.key.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /home

      # What the gate compiles: the build (nextest's `cargo test --no-run` is the
      # same units) and the check-mode units clippy's lint of dependents reads.
      # Cargo's defaults and nothing else: the first snapshot was built with
      # CARGO_INCREMENTAL=0, which is part of every unit's fingerprint, so no
      # unit matched the container's and the seeded build recompiled all 700
      # registry crates (626 s against 742 s cold). Removing it from this step's
      # env was not enough: dtolnay/rust-toolchain exports CARGO_INCREMENTAL=0
      # (and CARGO_TERM_COLOR, RUST_BACKTRACE) for every later step of the job,
      # so the variable is unset here, and the cargo-relevant environment is
      # printed so a snapshot's build conditions can be read off its run. The
      # `incremental/` dirs cargo then writes for the workspace crates are
      # dropped by the export anyway.
      - name: Build origin/main as a cloud session does
        if: steps.key.outputs.build == 'true'
        working-directory: /home/user/susi
        run: |
          set -euo pipefail
          unset CARGO_INCREMENTAL
          echo "cargo environment:"; env | grep -E '^(CARGO|RUST)' | sort || true
          cargo build --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets || echo "clippy did not pass on main; publishing the build anyway"

      - name: Export, pack and publish the snapshot
        if: steps.key.outputs.build == 'true'
        working-directory: /home/user/susi
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.key.outputs.name }}
        run: |
          set -euo pipefail
          target/debug/susi workflow seed-target --export /home/user/seed
          rm -rf target
          du -sh /home/user/seed
          mkdir -p /home/user/out && cd /home/user/out
          gz=gzip; command -v pigz >/dev/null 2>&1 && gz=pigz
          tar -C /home/user/seed -cf - . | "$gz" -1 | split -b 1900m -d -a 2 - "$NAME.tar.gz.part"
          sha256sum "$NAME".tar.gz.part* > "$NAME.manifest"
          arch=${NAME%-*}
          cp "$NAME.manifest" "$arch-latest.manifest"
          ls -la
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$NAME".tar.gz.part* "$NAME.manifest" "$arch-latest.manifest"
          echo "published $NAME"

      # Older keys stay useful for a branch behind main; two of them is plenty.
      - name: Prune snapshots older than the two newest
        if: steps.key.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.key.outputs.name }}
        run: |
          set -euo pipefail
          arch=${NAME%-*}
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets | sort_by(.createdAt) | reverse | .[] | .name' > assets.txt
          grep -E "^$arch-[0-9a-f]{16}\.manifest$" assets.txt | tail -n +3 | sed -E 's/\.manifest$//' | while read -r old; do
            grep -E "^$old(\.manifest|\.tar\.gz\.part[0-9]+)$" assets.txt | while read -r asset; do
              echo "deleting $asset"
              gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
          done
