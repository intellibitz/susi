name: Warm release dependencies

# A tag cannot write a cache visible to a later tag. Test explicitly dispatches
# this on main after its jobs pass; workflow_run does not reliably cascade from
# a Test dispatched by GITHUB_TOKEN. One run finishes even when main moves.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    # An older Windows refresh must not hold the independent ARM cache back.
    # A given platform still has at most one running warmer for this ref.
    concurrency:
      group: release-warm-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
    timeout-minutes: 75
    env:
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: sccache
      RUSTC_WORKSPACE_WRAPPER: sccache
      # As release.yml's legs: the dependency crates a release restores must
      # be built with the same profile, or the cache never matches.
      CARGO_PROFILE_DIST_LTO: "false"
      CARGO_PROFILE_DIST_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Restore and save dist dependencies
        id: dist-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          cache-targets: "true"
      - name: Install Linux release dependencies
        if: runner.os == 'Linux'
        run: |
          scripts/ci-system-deps.sh
          command -v clang >/dev/null || { sudo apt-get update && sudo apt-get install -y clang; }
          scripts/ci-install-mold.sh
      # One invocation: a second cargo waits on the target lock, so the harness
      # dependency graph used to compile only after the engine had finished.
      - name: Build the release dependency graph
        run: cargo build --locked --profile dist -p susi-harness -p susi
      # An exact hit suppresses rust-cache's post-save. If Test evicted that
      # entry during this build, a lookup-only second action sees the miss and
      # saves the newly built target on its post step without downloading it.
      - name: Recheck an exact hit before saving
        if: steps.dist-cache.outputs.cache-hit == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          cache-targets: "true"
          lookup-only: "true"
