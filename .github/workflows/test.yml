name: Test

# Runs independently of release.yml / dev-release.yml (no `needs` between
# workflows) — tests and releases run in parallel on GitHub, so pushing
# never blocks on either. The local pre-push hook only checks version
# compliance; it does not run tests, by design.

# No `pull_request` trigger: every PR here is opened by auto-merge.yml as
# github-actions[bot], and GitHub holds a bot-opened PR's workflow runs for
# approval (`action_required`). The PR then merges seconds later on the strength
# of the branch-push run below, and the held run dies as a jobs-less "failure"
# — noise on every merge (and a red X on the Actions page). The push run is the
# gate: checks attach to the commit, so the PR sees them all the same.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  # Mandates 49-51, server side: every commit on a pushed branch names a
  # claimed or closed task (`Task: T-<AGENT>-<n>` trailer). The local hooks can
  # be skipped with --no-verify; this job cannot.
  workflow:
    name: Workflow Compliance
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # base..head needs history and origin/main

      - name: Every commit belongs to a claimed or closed task
        run: scripts/check-workflow-compliance.sh origin/main "$GITHUB_SHA"

  # Roadmap prose must not contradict verified delivery. 100 of 102 vectors
  # said "not an implemented capability" while every one of them had a closed
  # linked task whose acceptance check passed, so the roadmap read as unbuilt
  # work that was in fact implemented and tested. No `if`: this runs on the
  # branch-push run that gates the merge *and* on main, so the invariant
  # cannot silently rot between reconciliations.
  roadmap:
    name: Roadmap Progress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Every vector with closed linked tasks states what verifies it
        run: scripts/check-roadmap-progress.sh

  deny:
    name: cargo deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2

  # Non-main branch pushes get an affected-crates compile gate plus the tests
  # of those crates. Several agents push every macro-step on parallel branches,
  # so this stays bounded to the diff; the full sharded suite is still the
  # integration gate on main and manual dispatch (auto-merge dispatches it on
  # main right after each merge). scripts/ci-changed-crates.sh maps the diff to
  # packages, so a leaf-crate push builds and tests in seconds on a warm cache
  # instead of the whole workspace; a workspace-wide diff keeps the compile
  # check alone (see the nextest step below).
  check:
    name: Compile Check (branch pushes)
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # merge-base diff needs history

      # Static and build-free, so it costs seconds: a `[[test]] harness = false`
      # target is invisible to nextest (it reports no result and marks the test
      # skipped) and can therefore never fail the main shards — while its
      # discovery pass can fail them instead. Branch pushes skip the nextest
      # shards, so without this gate such a test merges green and breaks main;
      # that is exactly what PR #185 did to the foundation shard.
      - name: Test harness contract
        run: scripts/check-test-harness-contract.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake

      - name: Resolve affected crates
        id: affected
        run: |
          pkgs=$(./scripts/ci-changed-crates.sh)
          {
            echo 'pkgs<<AFFECTED_EOF'
            echo "$pkgs"
            echo 'AFFECTED_EOF'
          } >> "$GITHUB_OUTPUT"
          if [ "$pkgs" = "ALL" ]; then
            echo "cmd=cargo check --workspace --locked" >> "$GITHUB_OUTPUT"
          elif [ -z "$pkgs" ]; then
            echo "cmd=" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=cargo check$(printf ' -p %s' $pkgs) --locked" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo check
        if: steps.affected.outputs.cmd != ''
        run: ${{ steps.affected.outputs.cmd }}

      - name: Install cargo-nextest
        if: steps.affected.outputs.pkgs != '' && steps.affected.outputs.pkgs != 'ALL'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      # Compile-clean is not correct: the failures that have actually reached
      # main - a dispatch pool race, a test that deleted another test's
      # directory, two tests racing on process env - are all invisible to
      # `cargo check` and to the nextest shards, which only run on main. So run
      # the affected crates' tests here, bounded to the diff: a workspace-wide
      # change (`ALL`) still gets the compile check only, because that is a
      # whole-workspace test build on every macro-push, and it lands on main
      # where the full sharded suite runs anyway.
      - name: cargo nextest (affected crates)
        if: steps.affected.outputs.pkgs != '' && steps.affected.outputs.pkgs != 'ALL'
        run: cargo nextest run --locked $(printf ' -p %s' ${{ steps.affected.outputs.pkgs }}) -E 'not binary(capability_gap_e2e)'

  # The suite is sharded by area so each runner compiles only its dep
  # closure; the gate is the slowest shard (~4min warm) rather than one
  # serial workspace build. Keep shards roughly balanced: gemi pulls the
  # candle/ort vendors, daemon the service shells, gawd the swarm crates.
  test:
    name: Test (${{ matrix.shard.name }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: foundation
            pkgs: -p susi-paths -p susi-error -p susi-config -p susi-abi -p susi-core -p susi-sandbox -p susi-sandbox-client -p susi-http-transport -p susi-native-client -p susi-leaf-services
          - name: daemon
            pkgs: -p susi-daemon -p susi-server -p susi-gmcp -p susi-tools
          - name: gawd
            pkgs: -p susi-gawd -p susi-gawd-agents -p susi-gawd-swarm -p susi-gawd-a2a -p susi-agents
          - name: gemi
            pkgs: -p susi-gemi -p susi-gemi-models -p susi-adapters-llm
          - name: vendor-cells
            pkgs: -p susi-vendor-wasmer -p susi-vendor-candle -p susi-vendor-fastembed -p susi-vendor-tantivy -p susi-vendor-chrome -p susi-vendor-syn -p susi-vendor-mcp -p susi-vendor-mcp-server -p susi-vendor-cloud -p susi-vendor-agents -p susi-vendor-models -p susi-vendor-web -p susi-dsh-cell -p susi-universal-cell -p susi-vendor-anyhow -p susi-vendor-axum -p susi-vendor-base64 -p susi-vendor-bollard -p susi-vendor-bytes -p susi-vendor-chacha20poly1305 -p susi-vendor-clap -p susi-vendor-console-subscriber -p susi-vendor-criterion -p susi-vendor-dashmap -p susi-vendor-ed25519-dalek -p susi-vendor-flume -p susi-vendor-futures -p susi-vendor-getrandom -p susi-vendor-hex -p susi-vendor-http-body-util -p susi-vendor-hyper -p susi-vendor-hyper-util -p susi-vendor-indicatif -p susi-vendor-jsonschema -p susi-vendor-libc -p susi-vendor-md-5 -p susi-vendor-parking-lot -p susi-vendor-proptest -p susi-vendor-ra2a -p susi-vendor-rayon -p susi-vendor-rcgen -p susi-vendor-regex -p susi-vendor-serde -p susi-vendor-serde-json -p susi-vendor-sha1 -p susi-vendor-sha2 -p susi-vendor-shlex -p susi-vendor-signal-hook -p susi-vendor-sysinfo -p susi-vendor-tempfile -p susi-vendor-tokio -p susi-vendor-tokio-rustls -p susi-vendor-tokio-stream -p susi-vendor-tower -p susi-vendor-tower-service -p susi-vendor-tracing -p susi-vendor-tracing-appender -p susi-vendor-tracing-subscriber -p susi-vendor-ureq -p susi-vendor-url -p susi-vendor-winapi -p susi-vendor-x25519-dalek
          - name: root-cli
            pkgs: -p susi -p xtask
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake

      - name: Install mold (Linux)
        run: |
          set -euo pipefail
          VER=2.40.4
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|aarch64) ;;
            *) echo "Skipping mold on $ARCH"; exit 0 ;;
          esac
          NAME="mold-${VER}-${ARCH}-linux"
          curl -sSfL "https://github.com/rui314/mold/releases/download/v${VER}/${NAME}.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          mold --version
          command -v ld.mold

      # wasm32-wasip1 lets the reflex tests take the real compile+execute
      # branch instead of skipping (VC-200-002 evidence).
      - name: Install wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      # nextest schedules each test as its own process (~40% faster than
      # libtest's per-binary pools on this suite) and isolates cross-process
      # IPC state the way the microkernel intends. The capability-gap e2e is
      # excluded here — it needs a running susi-native leaf service and runs
      # in the parallel `e2e` job so its ~4min service build is off the
      # critical path.
      - name: cargo nextest
        run: cargo nextest run --locked ${{ matrix.shard.pkgs }} -E 'not binary(capability_gap_e2e)'

      # susi-leaf-services feature-gates every service shell; the router tests
      # only exist under --all-features (zero-feature builds compile them out
      # by design so vendor backends stay out of unrelated binaries).
      - name: cargo nextest (leaf-services all-features)
        if: matrix.shard.name == 'foundation'
        run: cargo nextest run --locked -p susi-leaf-services --all-features

  # Per-crate coverage floor: coverage can only rise. Parallel with the
  # shards so it adds no wall time; instrumented build is the cost.
  coverage:
    name: Coverage Ratchet
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust (llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage
          cache-targets: "false"
          shared-key: coverage

      - name: Cache llvm-cov target dir
        uses: actions/cache@v4
        with:
          path: target/llvm-cov-target
          key: llvm-cov-${{ hashFiles('Cargo.lock') }}
          restore-keys: llvm-cov-

      - name: Install Linux System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake

      - name: Install wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage ratchet
        run: scripts/coverage-ratchet.sh

  lint:
    name: Doc Tests + Clippy
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake

      # nextest does not run doc-tests; keep the door open for them.
      - name: cargo test --doc
        run: cargo test --workspace --locked --doc

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The capability-gap e2e executes a synthesized WASI reflex through a live
  # susi-native leaf service. It runs in its own job in parallel with `test`
  # so building the service no longer serializes ahead of the suite.
  e2e:
    name: capability_gap_e2e (live susi-native)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake

      - name: Install wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Build susi-native service
        run: cargo build -p susi-leaf-services --bin susi-native --no-default-features --features service-native,standalone-service-bins --locked

      - name: Start susi-native on 127.0.0.1:18084
        run: |
          ./target/debug/susi-native &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:18084/healthz && exit 0
            curl -s -o /dev/null http://127.0.0.1:18084/ && exit 0
            sleep 1
          done
          echo "susi-native failed to start" && exit 1

      - name: cargo nextest (e2e only)
        run: cargo nextest run -p susi-daemon --test capability_gap_e2e --locked
