name: Test

# Runs independently of release.yml / dev-release.yml (no `needs` between
# workflows) — tests and releases run in parallel on GitHub, so pushing
# never blocks on either. The local pre-push hook only checks version
# compliance; it does not run tests, by design.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  architecture:
    name: Architecture Isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify zero-dependency boundaries and source integrity
        run: cargo run -p xtask --locked -- verify-architecture

  deny:
    name: cargo deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake

      # wasm32-wasip1 lets test_wasm_reflex_hot_patch_end_to_end take the real
      # compile+execute branch instead of skipping (VC-200-002 evidence).
      - name: Install wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      # The capability-gap e2e executes a synthesized WASI reflex through the
      # susi-native leaf service; without it the test reports a skip.
      - name: Build susi-native service
        run: cargo build -p susi-native --locked

      - name: Start susi-native on 127.0.0.1:18084
        run: |
          ./target/debug/susi-native &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:18084/healthz && exit 0
            curl -s -o /dev/null http://127.0.0.1:18084/ && exit 0
            sleep 1
          done
          echo "susi-native failed to start" && exit 1

      # nextest schedules each test as its own process (~40% faster than
      # libtest's per-binary pools on this suite) and isolates cross-process
      # IPC state the way the microkernel intends.
      - name: cargo nextest
        run: cargo nextest run --workspace --locked

      # nextest does not run doc-tests; keep the door open for them.
      - name: cargo test --doc
        run: cargo test --workspace --locked --doc

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
