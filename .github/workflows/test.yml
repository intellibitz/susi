name: Test

# Runs independently of release.yml / dev-release.yml (no `needs` between
# workflows) — tests and releases run in parallel on GitHub, so pushing
# never blocks on either. The local pre-push hook only checks version
# compliance; it does not run tests, by design.

# No `pull_request` trigger: every PR here is opened by auto-merge.yml as
# github-actions[bot], and GitHub holds a bot-opened PR's workflow runs for
# approval (`action_required`). The PR then merges seconds later on the strength
# of the branch-push run below, and the held run dies as a jobs-less "failure"
# — noise on every merge (and a red X on the Actions page). The push run is the
# gate: checks attach to the commit, so the PR sees them all the same.
on:
  push:
    # A queue request (susi-queue/**) is a relayed ref push, not code:
    # .github/workflows/queue.yml consumes it.
    branches: ['**', '!susi-queue/**']
  workflow_dispatch:
    inputs:
      # `full` (the default) is the whole suite: the release workflow and the
      # dispatch onto main after a merge want it. `branch` is exactly what a
      # branch push runs (compile check and workflow compliance). The merge
      # bot retests a head it resynced with `branch`: that head must pass the
      # same gate a push would have, and a full-suite retest took 20+ minutes
      # and failed the PR on suite-wide flakes no branch push would run.
      gate:
        description: "full: the whole suite; branch: the checks a branch push runs"
        required: false
        default: full
        type: choice
        options: [full, branch]
      # The code-tree stamp (job `codetree`) lets a main run whose code is
      # byte-identical to an already-green run skip the suite. `prove: true`
      # runs it regardless (a cache refresh, a suspected flake).
      prove:
        description: "true: run the suite even when the code tree is already proven"
        required: false
        default: false
        type: boolean

# Off main a newer run supersedes the older one: a branch's gate is only ever
# about its newest head. On `main` a running run is never cancelled: it
# finishes, and the merges that land meanwhile collapse into one pending run
# (GitHub keeps at most one pending per group; the one it replaces shows as
# cancelled). Latest-wins on main stopped working once merges came faster than
# the suite: with a merge every 5-12 min and a 30-45 min suite, every main run
# from 17:50 to 21:02 on 2026-10-28 was cancelled, so nothing proved the merged
# tree or refreshed the caches only main writes. Queued, main completes a run
# at least once per suite length, and the run covers every merge since the
# last green one (codetree scopes from that head, not from the previous merge).
#
# Off main, a dispatched run gets its own group. The release dry run
# (`gh workflow run release.yml --ref <branch>`) dispatches this suite on the
# branch; sharing the push run's group, it cancelled the branch gate — the only
# run auto-merge merges on — and the next push cancelled it back, so PR #977
# went nine pushes without one Test run finishing. On main the auto-merger's
# dispatches share one group and queue, as above. A `prove` dispatch on main
# (the release dry run on main, a cache refresh) proves main's head as it is at
# dispatch, so it gets a group of its own too: in the merges' group it waited
# behind the running suite past the release's wait, and the next merge's run
# replaced it while it was pending.
concurrency:
  group: test-${{ github.ref }}${{ github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', inputs.gate || 'full') || (inputs.prove && '-prove' || '') }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# A run on a tag (release.yml dispatches the suite on the tag it is about to
# build) restores the caches main wrote and writes none: an entry saved under a
# tag ref is readable by nothing else, and the repository sits at its 10 GB cache
# quota (see below), so every shard, the lint job and e2e save only on main. The
# coverage ratchet runs separately on main and the Kani proofs are skipped on a
# tag; the sharded suite, lint and e2e are what a release needs.
permissions:
  contents: read

# The repository's cache quota is 10 GB and the suite wants more than that:
# ten rust-cache entries (one per shard, plus lint, e2e, unsafe-ratchet) and a
# 4.7 GB instrumented coverage target came to ~16 GB, so GitHub's LRU eviction
# cold-started whichever jobs lost - e2e went from 3.4 to 13.8 min in one run
# because its 1.7 GB entry was gone.
#
# Debug info is a large share of every cached artifact and nothing in CI reads it
# (a panic names its file:line from the panic location, not from DWARF). Building
# `susi-daemon`'s test closure with and without it: target/ 6.9 -> 4.2 GB, and 216 s
# -> 218 s to build, so it shrinks every cache by ~40% for free. The variable is
# hashed into rust-cache's key, so the first run after changing it starts cold by
# design; the llvm-cov cache is keyed by hand below and is versioned for the same
# reason.
env:
  CARGO_PROFILE_DEV_DEBUG: 0

# Compile-heavy jobs use `runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}`:
# point the `CI_RUNNER` repository variable at a larger runner (e.g.
# `ubuntu-latest-8-cores`, billing permitting) and every gated compile gets
# faster without a code change; unset it stays on the default image.

jobs:
  # This job gates every merge and used to be the slowest thing on a branch push
  # by a wide margin (5-7.5 min against ~1 min for everything else): it compiled
  # cargo-geiger from source (~3 min, release profile) and then built the
  # `unsafe_ratchet` binary's 329-crate dependency closure cold, because it had no
  # cargo cache at all. Both are now cached. geiger is pinned to the version CI
  # resolved when the baseline was recorded, so a new release cannot silently
  # move `.agents/baseline/unsafe-default.json`.
  unsafe-ratchet:
    name: Unsafe Exposure Ratchet
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
      # The ratchet only depends on Rust source/build inputs, the resolved
      # dependency graph, its baseline and this gate script. Keep it required
      # for workflow_dispatch and fail open if the before-SHA cannot be read.
      - name: Check whether unsafe exposure inputs changed
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] \
            && ! grep -Eq '^0+$' <<<"$BEFORE"; then
            if git fetch --quiet --no-tags origin "$BEFORE"; then
              if changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA"); then
                run=$(printf '%s\n' "$changed" | .github/workflows/unsafe-exposure-scope.sh)
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      # Branches read main's entries and never write their own. A cache entry is
      # saved under the ref that wrote it, and the default (save on every push)
      # put a 321 MB rust-cache entry plus the 10 MB geiger entry under every task
      # branch while the repository was already over its quota (10.5 GB of 10), so
      # eviction kept removing entries - the geiger one among them, which broke
      # every push (see "Install cargo-geiger"). Same policy as `check` below.
      - name: Cache Cargo
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache cargo-geiger
        id: geiger
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-geiger
          key: cargo-geiger-0.13.0-${{ runner.os }}-${{ runner.arch }}
      # Skipped on a hit of the cache above. On a miss the binary can still be
      # on disk: Swatinem/rust-cache saves and restores ~/.cargo/bin too, and
      # `cargo install` refuses to overwrite a binary it did not install
      # ("binary `cargo-geiger` already exists in destination"). Once this 10 MB
      # entry was evicted that failed the job on every push of every branch, and
      # a failed job never reaches the post-step that would re-save the entry, so
      # it could not heal. Keep the restored binary when it is the pinned
      # version; otherwise install over it. tests/ci_cached_tool_install.rs
      # requires `--force` on every `cargo install` in a rust-cache job.
      - name: Install cargo-geiger
        if: steps.scope.outputs.run == 'true' && steps.geiger.outputs.cache-hit != 'true'
        run: |
          if cargo geiger --version 2>/dev/null | grep -qx 'cargo-geiger 0.13.0'; then
            echo "cargo-geiger 0.13.0 restored with the cargo cache"
          else
            cargo install cargo-geiger --locked --version 0.13.0 --force
          fi
      # Saved right after the install, not at job end, so a ratchet failure on
      # main (a real unsafe regression) does not also lose the entry.
      - name: Save cargo-geiger
        if: steps.scope.outputs.run == 'true' && github.ref == 'refs/heads/main' && steps.geiger.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-geiger
          key: cargo-geiger-0.13.0-${{ runner.os }}-${{ runner.arch }}
      - name: Run unsafe exposure ratchet
        if: steps.scope.outputs.run == 'true'
        run: .github/workflows/unsafe-exposure-ratchet.sh

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  # A merge that moves only the task queue (.agents/tasks/: task adds, done
  # records) lands a main tree whose code is byte-identical to a run that
  # already went green - the shards, coverage, doc tests, kani and the e2e
  # would spend their minutes re-proving proven bytes while every later merge
  # queues behind them. This job diffs the merge against the newest green main
  # runs excluding .agents/tasks/ (the rest of .agents/ is compiled and read by
  # tests, so it counts); an empty diff means the suite's verdict already exists
  # and the gated jobs skip. Every run on main - the auto-merger's dispatches
  # included - can reuse that evidence (`prove: true` declines); a tag run and
  # a branch dispatch always prove. Everything cheap or state-judging - fmt,
  # the invariants, deny, the unsafe ratchet and post-merge verify - still runs
  # on every merge.
  codetree:
    name: Code-tree stamp
    # Main, tags and dispatches only. A branch push runs none of the jobs this
    # scopes (the shards, coverage, lint, kani, e2e and Windows are main's, and
    # the retest's `merge` job exists only on a dispatch), so on every push it
    # spent a runner and a full-history checkout to compute nothing — one of
    # nine runners a push took from a pool the main suite was already filling.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The stamp and scope list main's runs, and this job dispatches coverage.
    # Actions write includes the read access needed for those listings.
    permissions:
      contents: read
      actions: write
    outputs:
      proven: ${{ steps.stamp.outputs.proven }}
      affected: ${{ steps.scope.outputs.affected }}
      cov_pkgs: ${{ steps.scope.outputs.cov_pkgs }}
      skip_shards: ${{ steps.scope.outputs.skip_shards }}
      run_e2e: ${{ steps.scope.outputs.run_e2e }}
      run_windows: ${{ steps.scope.outputs.run_windows }}
      run_kani: ${{ steps.scope.outputs.run_kani }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      run_shards: ${{ steps.matrix.outputs.run_shards }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the candidate green shas need main's history

      # Every main run is a dispatch: a GITHUB_TOKEN merge raises no push
      # event, so the auto-merger dispatches the suite after each merge. Keyed
      # on `push`, the stamp never fired once — every task-only merge (a close
      # record, a task add: about half of all merges) ran coverage, kani and
      # the post-merge build for 10+ minutes on bytes a green run had already
      # proved, holding runners every branch push then queued behind. The
      # stamp judges the tree, whatever event started the run; `prove: true`
      # on a manual dispatch runs the suite regardless. A stamped run skips
      # `Doc Tests + Clippy`, which scripts/release-await-tests.sh reads as
      # "no suite ran here", so a release cut on such a sha dispatches its own
      # suite on the tag — correct, and rare.
      - name: Resolve whether the code tree is already proven
        id: stamp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVE_ANYWAY: ${{ inputs.prove }}
        run: |
          proven=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$PROVE_ANYWAY" != "true" ]; then
            shas=$(gh run list --workflow test.yml --branch main --status success \
              --limit 20 --json headSha --jq '.[].headSha' || true)
            scripts/ci-code-proven.sh "$GITHUB_SHA" $shas && proven=true
          fi
          echo "proven=$proven" >> "$GITHUB_OUTPUT"

      # Which shards this merge can still break. A shard's tests only run the
      # shard's own crates, so it can only fail when the merge touched one of
      # them or something one of them depends on — the changed-crates-plus-
      # dependents set (`ci-changed-crates.sh --dependents` against main's
      # newest head with a green Test run). Not the previous merge: main's runs
      # queue and a newer merge replaces the pending one, so a run that starts
      # has absorbed every merge whose own run never ran, and scoping from
      # HEAD^1 skipped their shards and still went green. From the last green
      # head, each green run covers everything since the one before it, and a
      # red run leaves the base where it was, so the next run retests what
      # failed. Two kinds of green are no base:
      # - the run's own head: scoped from itself a run would prove nothing
      #   (the stamp already reuses the head's own green run; `prove: true`
      #   is how a re-dispatch runs the suite regardless);
      # - a push run: main's merges are GITHUB_TOKEN merges and raise none, so
      #   a push run on main is a hand push, outside the loop this scopes.
      # A dispatched run the `stamp` proved by tree identity is a sound base:
      # its code is byte-identical to the green run it reused (the stamp and
      # ci-changed-crates.sh exempt the same .agents/tasks/), so a diff from
      # it is the diff from that run.
      # Every diff below counts both sides of a rename (`--no-renames` here and
      # in ci-changed-crates.sh), so a file moved out of scripts/ or out of a
      # crate still names the path it left. Two escapes, both toward proving
      # more: the suite's own machinery (.github/, scripts/) cannot scope
      # itself out, and anything the diff cannot resolve — no green base among
      # the last 20 runs, or no answer from the API — is ALL.
      # `affected` is the scalar verdict; `skip_shards` is what the matrix
      # step below leaves out of the `test` matrix; `run_e2e`, `run_kani` and
      # `run_windows` gate their jobs.
      - name: Resolve which shards this merge can affect
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVE_ANYWAY: ${{ inputs.prove }}
        run: |
          affected=ALL
          cov_pkgs="--workspace"
          skip='[]'
          e2e=true
          # The Kani proofs cover susi-gawd alone; they can only change when
          # the merge reaches that crate.
          kani=true
          # The Windows leg proves the published binary starts and answers; it
          # is worth a runner whenever the root package (the `susi` binary) is
          # in the affected set, including as a dependent.
          win=true
          if [ "${PROVE_ANYWAY:-}" = "true" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "prove=true — scoping nothing, every job runs"
            cov_pkgs="--workspace"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            head=$(git rev-parse HEAD)
            base=
            for sha in $(gh run list --workflow test.yml --branch main --status success \
              --limit 20 --json headSha,event \
              --jq '.[] | select(.event != "push") | .headSha' || true); do
              [ "$sha" != "$head" ] || continue
              if git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then
                base=$sha
                break
              fi
            done
            echo "scoping against the last green main head: ${base:-none}"
            if [ -n "$base" ]; then
              changed=$(git diff --no-renames --name-only "$base" HEAD)
              if grep -Eq '^(\.github/|scripts/|\.cargo/|rust-toolchain|vendor/|xtask/)' <<<"$changed"; then
                echo "merge touched CI machinery, a vendored crate or xtask — scoping nothing"
                cov_pkgs="--workspace"
              else
                pkgs=$(BASE_REF="$base" scripts/ci-changed-crates.sh --dependents || echo ALL)
                # The compile gate's "no crate" (docs, README, the installers,
                # anything outside a crate's trees) is not "no test": root
                # tests read AGENTS.md, README.md, docs/ and install.*, so a
                # merge that touches any file outside the crate trees and the
                # task queue is the root package's to re-prove.
                if [ "$pkgs" != ALL ] \
                  && grep -Evq '^(crates/|src/|tests/|benches/|examples/|config/|deploy/|\.agents/tasks/)' <<<"$changed"; then
                  pkgs=$(printf '%s\nsusi\n' "$pkgs" | grep . | sort -u)
                fi
                case "$pkgs" in
                  ALL) cov_pkgs="--workspace" ;;
                  "")
                    affected=NONE
                    cov_pkgs=""
                    skip=$(scripts/ci-test-shards.sh | cut -f1 | jq -R . | jq -sc .)
                    e2e=false
                    kani=false
                    win=false ;;
                  *)
                    affected=SCOPED
                    cov_pkgs=$(for p in $pkgs; do printf -- "-p %s " "$p"; done)
                    e2e=false
                    kani=false
                    win=false
                    grep -qx 'susi' <<<"$pkgs" && win=true
                    grep -qx 'susi-gawd' <<<"$pkgs" && kani=true
                    while IFS=$'\t' read -r name shardpkgs _partitions; do
                      hit=false
                      for c in $(awk '{for(i=1;i<=NF;i++) if($i=="-p") print $(i+1)}' <<<"$shardpkgs"); do
                        grep -qx "$c" <<<"$pkgs" && { hit=true; break; }
                      done
                      [ "$hit" = true ] || skip=$(jq -c --arg n "$name" '. + [$n]' <<<"$skip")
                    done < <(scripts/ci-test-shards.sh)
                    # capability_gap_e2e exercises the daemon over a live
                    # susi-native service: its crate set, with dependents
                    # already folded into `affected` by --dependents.
                    for c in susi-daemon susi-leaf-services susi-native-client susi-gmcp; do
                      grep -qx "$c" <<<"$pkgs" && { e2e=true; break; }
                    done ;;
                esac
              fi
            fi
          elif [[ "$GITHUB_REF" != refs/tags/* ]]; then
            # A branch run (push, or the dispatched retest of a resynced head)
            # never builds Windows. It was 94% of the merge gate (a cold ~23 min
            # build against ~1.5 min for every Linux check), and each agent may
            # hold only one unmerged task, so it capped every agent's rate.
            # main's post-merge run builds it whenever the merge can affect the
            # `susi` binary, and a release tag builds it before anything
            # publishes (run_windows=true). A red main run names its PR
            # through main-failure.yml only when it was a push; the
            # auto-merger's dispatched runs never start that workflow.
            win=false
          fi
          {
            echo "affected=$affected"
            echo "cov_pkgs=$cov_pkgs"
            echo "skip_shards=$skip"
            echo "run_e2e=$e2e"
            echo "run_windows=$win"
            echo "run_kani=$kani"
          } >> "$GITHUB_OUTPUT"

      # The shard matrix the `test` job runs, built from the same map the scope
      # above filtered (scripts/ci-test-shards.sh) with the unaffected shards
      # left out. A job-level `if` cannot see matrix variables, so the legs
      # used to skip themselves in a first step — after GitHub had allocated a
      # runner for each of the nine, and in a pool where every branch push's
      # gate was queuing behind them. A leg that is not in the matrix costs
      # nothing. `run_shards` is the job-level gate for the empty matrix
      # (`strategy` refuses one).
      - name: Build the shard matrix
        id: matrix
        env:
          AFFECTED: ${{ steps.scope.outputs.affected }}
          SKIP: ${{ steps.scope.outputs.skip_shards }}
        run: |
          [ "$AFFECTED" != "ALL" ] || SKIP='[]'
          matrix=$(scripts/ci-test-shards.sh --matrix "$SKIP")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if jq -e '.shard | length > 0' <<<"$matrix" >/dev/null; then
            echo "run_shards=true" >> "$GITHUB_OUTPUT"
          else
            echo "every shard is unaffected — no test leg runs"
            echo "run_shards=false" >> "$GITHUB_OUTPUT"
          fi

      # Coverage is still measured on the exact main commit, but its long
      # instrumented build must not keep this workflow's concurrency group
      # occupied or hold release-cache warming behind it.
      - name: Dispatch the independent coverage ratchet
        if: github.ref == 'refs/heads/main' && steps.stamp.outputs.proven != 'true' && steps.scope.outputs.affected != 'NONE'
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_PACKAGES: ${{ steps.scope.outputs.cov_pkgs }}
        run: gh workflow run coverage.yml --repo "$GITHUB_REPOSITORY" --ref main -f sha="$GITHUB_SHA" -f packages="$COVERAGE_PACKAGES"

  # The toolchain pin, the roadmap and the tracked-artifact checks are each a
  # checkout and a few seconds of script; as three jobs they were three runner
  # allocations (plus three checkouts and three "Set up job"s) on every push
  # and every main run. One job, one runner: every check still runs, in order,
  # and a failure names its step. Nothing here is a required status check
  # (scripts/github-enforce.sh), so the names are free to change.
  invariants:
    name: Repository Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: rustc, cargo and clippy resolve to the pinned channel
        run: scripts/check-toolchain-pin.sh

      # Roadmap prose must not contradict verified delivery. 100 of 102
      # vectors said "not an implemented capability" while every one of them
      # had a closed linked task whose acceptance check passed. Runs on the
      # branch-push run that gates the merge *and* on main.
      - name: Every vector with closed linked tasks states what verifies it
        run: scripts/check-roadmap-progress.sh

      # An action version that does not exist kills the job at "Set up job",
      # before a single step runs. A bump of softprops/action-gh-release to a
      # non-existent `@v4` (245ad77d) did exactly that to release.yml and
      # dev-release.yml, and the failure surfaced only when v0.21.7 was tagged:
      # the tag published no binaries at all. Resolve the pins here, on the push
      # that changes them.
      - name: Every action a workflow pins actually resolves
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release-actions.sh

      # 3390 files of cargo output were committed by a stray `git add -A`; a
      # tracked target directory rewrites itself into every worktree on the next
      # build. Cheap to check, expensive to discover later.
      - name: No build output is tracked
        run: scripts/check-tracked-artifacts.sh

      - name: No vector's narrative contradicts its recorded verdict
        run: scripts/check-roadmap-queue.py --consistency-only

      # A verdict is the acceptance of a verification task, so it has to hold on
      # main and not only in the worktree that wrote it. This is where a
      # `delivered` verdict citing a test no module declares is refused.
      - name: Every recorded verdict cites evidence that can run
        run: scripts/check-roadmap-verdict.py --all

  # Mandates 49-51, server side: every commit on a pushed branch names a
  # claimed or closed task (`Task: T-<AGENT>-<n>` trailer). The local hooks can
  # be skipped with --no-verify; this job cannot.
  workflow:
    name: Workflow Compliance
    if: (github.event_name == 'push' || inputs.gate == 'branch') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # base..head needs history and origin/main

      - name: Fetch workflow refs once
        run: scripts/fetch-workflow-refs.sh origin

      - name: Every commit belongs to a task this branch claimed
        env:
          SUSI_WORKFLOW_REFS_FETCHED: "1"
        run: scripts/check-workflow-compliance.sh origin/main "$GITHUB_SHA" origin "$GITHUB_REF_NAME"

  deny:
    name: cargo deny (licenses + advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install cargo-deny from a prebuilt release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        env:
          # Dependency graph validation does not compile the workspace; avoid
          # rustup installing every component and target in rust-toolchain.toml.
          RUSTUP_TOOLCHAIN: stable
        run: cargo deny --all-features check

  # The merge gate for a branch push: it compiles and lints, it does not run
  # tests. Executing the affected crates' tests here (nextest, then the hermetic
  # re-run) was 62-75% of the job - 173-267 s plus 18-67 s of a 308-446 s run,
  # against 96 s when no crate was touched - and re-ran what the agent's own
  # `finish` gate had just run on the same tree. The gate is also the unit of the
  # serialized merge queue: every merge turns the next green head stale, and each
  # stale head costs one more run of this job, so its length is the queue's
  # latency; and a flaky test here blocks every branch behind it (`Test (gemi)`
  # failed three of four attempts on one). Tests run where they can be retried
  # without holding anyone: the agent's local gate, the full sharded suite on main
  # after every merge (auto-merge dispatches it), and the release.
  #
  # What it does gate is that the branch builds on a clean machine. Clippy over
  # `--all-targets` is a superset of `cargo check`, so it is the one compile step,
  # and it covers every test target, so a test that stops compiling still fails
  # here. `ci-changed-crates.sh --dependents` widens the set from the crates the
  # diff touched to whatever depends on them: a signature change leaves the
  # changed crate green and breaks its caller, and with tests off this job that
  # is exactly what reached main. A workspace-wide diff (`ALL`) lints the whole
  # workspace.
  #
  # The job name is a required status check (scripts/github-enforce.sh): renaming
  # it blocks every merge.
  check:
    name: Compile Check (branch pushes)
    if: (github.event_name == 'push' || inputs.gate == 'branch') && github.ref != 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      # sccache caches each compiled unit under the shared GHA cache backend.
      # `lint` (main-only) runs the same clippy closure and writes the entries
      # every branch restores: unlike the rust-cache entry, they are per-unit,
      # so a branch whose dep closure differs from what main last built still
      # hits whatever units match. External deps go through RUSTC_WRAPPER,
      # workspace crates through RUSTC_WORKSPACE_WRAPPER (they wrap
      # clippy-driver, which sccache caches the same way).
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTC_WORKSPACE_WRAPPER: "sccache"
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # merge-base diff needs history

      # Static and build-free, so it costs seconds: a `[[test]] harness = false`
      # target is invisible to nextest (it reports no result and marks the test
      # skipped) and can therefore never fail the main shards — while its
      # discovery pass can fail them instead. Branch pushes skip the nextest
      # shards, so without this gate such a test merges green and breaks main;
      # that is exactly what PR #185 did to the foundation shard.
      - name: Test harness contract
        run: scripts/check-test-harness-contract.sh

      # Resolve scope before paying for a toolchain: a push that moves only
      # .agents/ (task adds, close receipts) has an empty lint set, so the
      # deps, mold, ONNX and clippy steps below would install ~90 s of
      # toolchain for nothing. `lintcmd` empty is the "nothing to compile"
      # verdict and gates them all.
      - name: Resolve affected crates
        id: affected
        run: |
          # These paths cannot name a Rust package in ci-changed-crates.sh.
          # Resolve this common case before starting Cargo or parsing metadata;
          # any unknown path or Git failure falls through to the full plan.
          if base=$(git merge-base "${BASE_REF:-origin/main}" HEAD 2>/dev/null) &&
             changed=$(git -c diff.relative=false -c core.quotePath=false -c color.ui=never \
               diff --no-renames --no-color --name-only "$base" HEAD); then
            inert=true
            while IFS= read -r path; do
              case "$path" in
                ''|.github/*|.agents/tasks/*) ;;
                *) inert=false; break ;;
              esac
            done <<<"$changed"
            if [ "$inert" = true ]; then
              echo 'pkgs=' >> "$GITHUB_OUTPUT"
              echo 'lintcmd=' >> "$GITHUB_OUTPUT"
              echo 'target_cache=false' >> "$GITHUB_OUTPUT"
              echo 'onnx=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # The affected-package and reverse-dependency selectors need the
          # same workspace graph. Resolve it once instead of launching Cargo
          # metadata separately in each helper.
          metadata_file="$RUNNER_TEMP/susi-cargo-metadata.json"
          cargo metadata --no-deps --format-version 1 > "$metadata_file"
          export SUSI_CARGO_METADATA_FILE="$metadata_file"
          # The combined plan uses the same diff and metadata for both the
          # dependent lint closure and the focused root-test targets.
          plan=$(./scripts/ci-changed-crates.sh --plan)
          pkgs= root_test_targets= rootpkg=
          while IFS=: read -r kind value; do
            case "$kind" in
              lint) pkgs+="$value"$'\n' ;;
              root-test) root_test_targets+="$value"$'\n' ;;
              root-package) rootpkg=$value ;;
              test|'') ;;
              *) pkgs=ALL; root_test_targets=; break ;;
            esac
          done <<<"$plan"
          pkgs=${pkgs%$'\n'}
          root_test_targets=${root_test_targets%$'\n'}
          {
            echo 'pkgs<<AFFECTED_EOF'
            echo "$pkgs"
            echo 'AFFECTED_EOF'
          } >> "$GITHUB_OUTPUT"
          if [ "$pkgs" = "$rootpkg" ] && [ -n "$root_test_targets" ]; then
            lintcmd="cargo clippy -p $rootpkg$(printf ' --test %s' $root_test_targets) --locked -- -D warnings"
            echo "lintcmd=$lintcmd" >> "$GITHUB_OUTPUT"
          elif [ "$pkgs" = "ALL" ]; then
            echo "lintcmd=cargo clippy --workspace --all-targets --locked -- -D warnings" >> "$GITHUB_OUTPUT"
          elif [ -z "$pkgs" ]; then
            echo "lintcmd=" >> "$GITHUB_OUTPUT"
          else
            echo "lintcmd=cargo clippy$(printf ' -p %s' $pkgs) --all-targets --locked -- -D warnings" >> "$GITHUB_OUTPUT"
          fi
          # xtask and susi-unsafe-ratchet are lightweight packages: recent
          # branch gates spent 12–15 s restoring the workspace target archive
          # for 1–9 s of clippy. Keep sccache for their compiles, and avoid
          # restoring the workspace target archive when either is the only
          # affected package.
          target_cache=true
          if [ "$pkgs" = "xtask" ] || [ "$pkgs" = "susi-unsafe-ratchet" ]; then target_cache=false; fi
          echo "target_cache=$target_cache" >> "$GITHUB_OUTPUT"
          # The ONNX prefetch builds susi-vendor-fastembed only to warm its CDN
          # download; nothing else in the job can reach it. Pay for it only
          # when the affected set intersects the crates that can pull it in
          # (or when everything is being built anyway).
          onnx=false
          if [ "$pkgs" = "ALL" ]; then
            onnx=true
          elif [ -n "$pkgs" ]; then
            rev=$(./scripts/ci-reverse-deps.sh susi-vendor-fastembed)
            if comm -12 <(sort <<<"$pkgs") <(sort <<<"$rev") | grep -q .; then
              onnx=true
            fi
          fi
          echo "onnx=$onnx" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.affected.outputs.lintcmd != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        if: steps.affected.outputs.lintcmd != ''
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      # A cache is only readable from the ref that wrote it or from main, and this
      # job never runs on main - so the cache it used to write could only be read
      # by later pushes of the *same* branch. Every fresh agent branch (a new
      # branch per task) therefore started cold on its first push: 7.5 min against
      # 0.7-1.1 min once warm, 111 s of it the ONNX fetch alone. `lint` runs on main
      # and builds the same dependency closure (clippy over the workspace plus the
      # doc-test build), so read its cache and never write one of our own: saving
      # per branch only filled the cache quota with one entry per task. Compiled
      # units are sccache's job now. A registry-only cache experiment measured
      # 139 s end-to-end (91 s Clippy); restoring target artifacts took 23 s
      # and reduced Clippy to 24 s, so keep the target archive enabled here.
      - name: Cache Cargo
        if: steps.affected.outputs.lintcmd != '' && steps.affected.outputs.target_cache != 'false'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          cache-targets: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux System Dependencies
        if: steps.affected.outputs.lintcmd != ''
        run: scripts/ci-system-deps.sh

      - name: Install mold (Linux)
        if: steps.affected.outputs.lintcmd != ''
        run: scripts/ci-install-mold.sh

      # ONNX Runtime is fetched from pyke's CDN by ort-sys at build time, with no
      # retry of its own, so one hiccup reddens this job (it did: main's
      # vendor-cells shard). Build it up front with bounded retries - only the
      # build is retried, never the tests. Only the crates that can pull
      # susi-vendor-fastembed into this job's build need it (ci-reverse-deps.sh);
      # on a warm cache this is a cargo no-op.
      - name: Pre-fetch ONNX Runtime (bounded retries)
        if: steps.affected.outputs.onnx == 'true'
        run: scripts/ci-prefetch-onnxruntime.sh

      # The lint job is main-only, so a lint break merges green and reddens main
      # afterwards: 1.99.0 deprecated `Atomic::fetch_update` and `Doc Tests +
      # Clippy` failed on code nobody had touched (T-DEEPSEEK-8). Lint the
      # affected crates and their dependents here, and the whole workspace when
      # the diff is workspace-wide (`ALL` - a lockfile, toolchain or lint-config
      # change is exactly where this bites), because that is a `-D warnings`
      # violation the merge gate should have caught. `--all-targets` compiles the
      # tests, benches and examples too, so this is also the compile gate.
      - name: cargo clippy (affected crates and dependents)
        if: steps.affected.outputs.lintcmd != ''
        run: ${{ steps.affected.outputs.lintcmd }}

  # The suite is sharded by area so each runner compiles only its dep
  # closure; the gate is the slowest shard rather than one serial workspace
  # build. Keep shards roughly balanced: gemi pulls the candle/ort vendors,
  # daemon the service shells, gawd the swarm crates.
  #
  # Compiling is the cost, not testing: nextest runs the foundation shard's 690
  # tests in 6 s, daemon's 358 in 4 s, root-cli's 268 in 40 s, while their test
  # profiles take minutes to build on a 4-vCPU runner. So the lever is what the
  # cache holds. Every shard is its own cache (`shared-key` below): they used to
  # share the single key `v0-rust-test-*` (all six matrix jobs have the job id
  # `test`), the first shard to finish saved it - always a small one - and the
  # rest restored a 402 MB cache that did not hold their dependencies and rebuilt
  # them anyway (root-cli: a cache "hit", then a 12 min test-profile build for
  # 40 s of tests).
  test:
    name: Test (${{ matrix.shard.name }}${{ matrix.shard.partition && format(' {0}', matrix.shard.partition) || '' }})
    needs: codetree
    if: ((github.event_name != 'push' && inputs.gate != 'branch') || github.ref == 'refs/heads/main') && needs.codetree.outputs.proven != 'true' && needs.codetree.outputs.run_shards == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # 90, not 60: a shard that loses its cache entry to the 10 GB quota rebuilds
    # its test profile, and root-cli then needs more than 60 — it was cancelled
    # at the limit on the last main run, which cancels the whole run and keeps
    # main red. The limit exists to stop a hung shard, not to punish a cold one.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # The shard list lives in scripts/ci-test-shards.sh (names, packages and
      # how many hash partitions a shard runs in); `codetree` builds the matrix
      # from it with the shards this merge cannot affect left out, so a leg
      # that would only re-prove green code is never allocated a runner.
      matrix: ${{ fromJSON(needs.codetree.outputs.matrix) }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.shard.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux System Dependencies
        run: scripts/ci-system-deps.sh

      - name: Install mold (Linux)
        run: scripts/ci-install-mold.sh

      # wasm32-wasip1 lets the reflex tests take the real compile+execute
      # branch instead of skipping (VC-200-002 evidence).
      - name: Install wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      # nextest schedules each test as its own process (~40% faster than
      # libtest's per-binary pools on this suite) and isolates cross-process
      # IPC state the way the microkernel intends. The capability-gap e2e is
      # excluded here — it needs a running susi-native leaf service and runs
      # in the parallel `e2e` job so its ~4min service build is off the
      # critical path.
      # ONNX Runtime is fetched from pyke's CDN by ort-sys at build time, with no
      # retry of its own, so one hiccup reddens this job (it did: main's
      # vendor-cells shard). Build it up front with bounded retries - only the
      # build is retried, never the tests. The shards named here are exactly the
      # reverse-dependency set of susi-vendor-fastembed (scripts/ci-reverse-deps.sh):
      # gmcp, vendor-fastembed itself, the daemon and the root package.
      - name: Pre-fetch ONNX Runtime (bounded retries)
        if: contains(matrix.shard.pkgs, 'susi-gmcp') || contains(matrix.shard.pkgs, 'susi-vendor-fastembed') || contains(matrix.shard.pkgs, 'susi-daemon') || matrix.shard.name == 'root-cli'
        run: scripts/ci-prefetch-onnxruntime.sh

      # `--retries 2`: with the branch gate no longer running tests, this is the
      # first CI run that does, so a flaky test lands here and not on a branch.
      # `Test (gemi)` failed on main in a 0.6 s test on a commit that did not touch
      # gemi, and Main Failure Attribution blamed the pull request that merely
      # preceded it. A test is retried alone, and one that passes on retry is
      # reported FLAKY in the summary rather than failing the shard - visible, not
      # silent - while one that fails all three attempts still reddens main.
      # The runner mounts /tmp as a 7.9 GB tmpfs; the GMCP tests' scratch copies
      # fill it and fail with EDQUOT ("Disk quota exceeded"). Point temp at the
      # runner's real disk (~104 GB free) instead of the RAM-backed /tmp.
      - name: cargo nextest
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo nextest run --locked --retries 2 ${{ matrix.shard.pkgs }} ${{ matrix.shard.partition && format('--partition {0}', matrix.shard.partition) || '' }} -E 'not binary(capability_gap_e2e)'

  # Gated exactly as the shards are (`run_shards`): scripts/release-await-tests.sh
  # reads this job's success as "the suite ran on this sha", so it must never
  # run where the shards did not. A merge that reaches no crate skips both;
  # the caches this job writes have nothing new to hold then either.
  lint:
    name: Doc Tests + Clippy
    needs: codetree
    if: ((github.event_name != 'push' && inputs.gate != 'branch') || github.ref == 'refs/heads/main') && needs.codetree.outputs.proven != 'true' && needs.codetree.outputs.run_shards == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      # This job is what populates sccache on main: it compiles the workspace's
      # whole clippy closure, so the units the branch `check` job restores are
      # written here. Branch runs read them under their base ref.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTC_WORKSPACE_WRAPPER: "sccache"
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      # Branch pushes' `check` job restores this exact cache (same shared-key), so
      # what this job leaves on main is what every new agent branch starts from.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux System Dependencies
        run: scripts/ci-system-deps.sh

      - name: Install mold (Linux)
        run: scripts/ci-install-mold.sh

      # nextest does not run doc-tests; keep the door open for them.
      - name: cargo test --doc
        run: cargo test --workspace --locked --doc

      # ONNX Runtime is fetched from pyke's CDN by ort-sys at build time, with no
      # retry of its own, so one hiccup reddens this job (it did: main's
      # vendor-cells shard). Build it up front with bounded retries - only the
      # build is retried, never the tests.
      - name: Pre-fetch ONNX Runtime (bounded retries)
        run: scripts/ci-prefetch-onnxruntime.sh

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Bot-dispatched Test runs do not reliably cascade workflow_run events. Wait
  # for main's jobs to finish so Test caches have been saved, then start the
  # warmer when release-relevant checks pass. A red coverage/Kani/acceptance
  # job keeps Test red but cannot make building a dependency cache unsafe.
  # Warming is best effort and never changes the Test verdict.
  warm-release:
    name: Start Windows release cache warmer
    needs: [fmt, invariants, deny, unsafe-ratchet, test, lint, kani, verify, e2e, windows]
    if: always() && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.lint.result == 'success' && needs.fmt.result == 'success' && needs.invariants.result == 'success' && needs.deny.result == 'success' && needs['unsafe-ratchet'].result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch the warmer without blocking Test on its build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-warm.yml --repo "$GITHUB_REPOSITORY" --ref main

  # The formal model is intentionally small and pure, so Kani can exhaust its
  # bounded inputs without starting the daemon or contacting a provider. Keep
  # the proof on main only: branch pushes already run the affected crate gate,
  # while this job records the merged-tree proof and its bound for audit.
  #
  # This job was pinned to `ubuntu-20.04`, an image GitHub has retired. No runner
  # carries that label any more, so the job never started - no runner, no steps -
  # and sat queued for hours (153 min in one run), which kept every `main` run
  # "in progress" until the next merge cancelled it. Do not pin a hosted-runner
  # image that can be retired: tests/ci_workflow_perf.rs refuses the known-dead
  # labels. Nothing here is worth caching: `cargo install kani-verifier` is a thin
  # driver (2.6 s) and `cargo kani setup` fetches its toolchain and bundle in ~12 s.
  #
  # Once it had a runner the proofs failed at once: 0.68 rejects
  # `--concrete-playback` unless `-Z concrete-playback` is passed too. The job had
  # been broken for as long as the runner had been missing, and nobody could tell.
  # Scoped: the harnesses live in susi-gawd, so the proofs can only change
  # when the merge reaches that crate (`run_kani`, folded from the affected
  # set with dependents, or ALL).
  kani:
    name: Kani Bounded Proofs
    needs: codetree
    if: ((github.event_name != 'push' && inputs.gate != 'branch') || github.ref == 'refs/heads/main') && !startsWith(github.ref, 'refs/tags/') && needs.codetree.outputs.proven != 'true' && needs.codetree.outputs.run_kani == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Kani
        run: cargo install --locked kani-verifier --version 0.68.0

      - name: Set up Kani
        run: cargo kani setup

      - name: Verify bounded harnesses and retain proof output
        run: |
          mkdir -p kani-artifacts
          set -o pipefail
          cargo kani -p susi-gawd -Z concrete-playback --default-unwind 4 \
            --concrete-playback=print 2>&1 | tee kani-artifacts/kani.log

      - name: Record proof bounds and harness scope
        if: always()
        run: |
          mkdir -p kani-artifacts
          cat > kani-artifacts/proof-bounds.txt <<'EOF'
          package=susi-gawd
          default-unwind=4
          harnesses=stale_claims_are_fenced,admitted_budget_transition_is_within_cap,paid_policy_precedence_is_explicit
          counterexamples=retained in kani.log when a proof is unsuccessful
          EOF

      - name: Upload Kani proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-proof-artifacts
          path: kani-artifacts/

  # Post-merge acceptance. `close` proved the task on its own branch; this asks
  # whether the *merged* result still satisfies it, beside everyone else's
  # changes, and records refs/verified/<id>. Only `cargo` acceptances are
  # re-run: they are hermetic by mandate and available anywhere, while a
  # host-specific `scripts/…` checker failing on a bare runner would say nothing
  # about the merge — those are recorded as skipped, with the reason. A failure
  # writes nothing, so the next run retries it and main stays red until the
  # merge is fixed forward. The sweep is budgeted — 20 minutes in total, each
  # acceptance capped at 12 — and capped at two acceptances per run, so a cold
  # `cargo run` build cannot leave the sweep no room. Whatever does not fit is
  # *deferred*, not failed: a job cancelled at its own timeout records nothing,
  # so an unbounded sweep keeps main red forever and the queue never drains
  # (`tasks audit` keeps reporting deferred work, so deferral cannot launder it).
  # The timeout is 120 because that is what the cold build plus the sweep has to
  # fit inside; a cancelled job also loses its log, which is how a 90-minute
  # budget ran blind twice.
  verify:
    name: Post-merge acceptance
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: write # push the refs/verified/<id> records
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # merge-base needs main's history

      # Most merges — every metadata-only one, and any whose attestation an
      # earlier run already recorded — have no verification to do. The refs
      # answer that in seconds; building susi to learn it takes minutes. A
      # read failure says "pending" so an attestation never starves quietly.
      - name: Any merged attestation still unverified?
        id: owed
        run: |
          if scripts/ci-verified-pending.sh; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.owed.outputs.pending == 'true'
        uses: dtolnay/rust-toolchain@stable

      # Builds `susi` and then each merged task's own test target: 24 min cold, all
      # of it compiling. The root-cli shard has just built the same dependency
      # closure, so start from its cache and leave writing it to that shard.
      - name: Cache Cargo
        if: steps.owed.outputs.pending == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-root-cli
          save-if: false

      - name: Install Linux System Dependencies
        if: steps.owed.outputs.pending == 'true'
        run: scripts/ci-system-deps.sh

      - name: Install mold (Linux)
        if: steps.owed.outputs.pending == 'true'
        run: scripts/ci-install-mold.sh

      - name: Install cargo-nextest
        if: steps.owed.outputs.pending == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Re-run the acceptance of freshly merged tasks
        if: steps.owed.outputs.pending == 'true'
        # Two per run: the backlog drains over merges, and the job stays short
        # enough that its budget is about the sweep rather than the build.
        # A `prove` dispatch has its own concurrency group and can verify these
        # refs while this job installs the toolchain and restores its cache.
        # Check again at the point of use so a queue drained during setup does
        # not compile the `susi` CLI just to learn there is nothing to verify.
        # The helper fails closed: a remote-read error still runs verification.
        run: |
          if ! scripts/ci-verified-pending.sh; then
            echo "No merged attestations remain after setup; skipping the susi build."
            exit 0
          fi
          cargo run --locked -q -- tasks verify-merged --limit 2

  # The capability-gap e2e executes a synthesized WASI reflex through a live
  # susi-native leaf service. It runs in its own job in parallel with `test`
  # so building the service no longer serializes ahead of the suite.
  # Scoped like the shards, at the job level: a merge that cannot reach the
  # daemon/leaf/native/gmcp set this exercises (`run_e2e`, true for ALL) is
  # already proven, and the job is never allocated a runner for it.
  e2e:
    name: capability_gap_e2e (live susi-native)
    needs: codetree
    if: ((github.event_name != 'push' && inputs.gate != 'branch') || github.ref == 'refs/heads/main') && needs.codetree.outputs.proven != 'true' && needs.codetree.outputs.run_e2e == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux System Dependencies
        run: scripts/ci-system-deps.sh

      - name: Install mold (Linux)
        run: scripts/ci-install-mold.sh

      - name: Install wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Build susi-native service
        run: cargo build -p susi-leaf-services --bin susi-native --no-default-features --features service-native,standalone-service-bins --locked

      - name: Start susi-native on 127.0.0.1:18084
        run: |
          ./target/debug/susi-native &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:18084/healthz && exit 0
            curl -s -o /dev/null http://127.0.0.1:18084/ && exit 0
            sleep 1
          done
          echo "susi-native failed to start" && exit 1

      # ONNX Runtime is fetched from pyke's CDN by ort-sys at build time, with no
      # retry of its own, so one hiccup reddens this job (it did: main's
      # vendor-cells shard). Build it up front with bounded retries - only the
      # build is retried, never the tests.
      - name: Pre-fetch ONNX Runtime (bounded retries)
        run: scripts/ci-prefetch-onnxruntime.sh

      - name: cargo nextest (e2e only)
        run: cargo nextest run -p susi-daemon --test capability_gap_e2e --locked

  # The release publishes a Windows binary, so the Windows binary is proven on
  # every main run (post-merge) and on the release tag, never on a branch: it
  # is off the merge gate (see `run_windows` in codetree). The contract here is
  # narrow on purpose: the built `susi.exe` starts and answers the release
  # gate's own offline checks (`susi_gawd::admin::E2E_CHECKS`, driven through
  # tests/release_e2e_checks.rs). The workspace suite has Windows-host failures
  # of its own, tracked separately; asserting them here would only redden every
  # push for reasons this job does not own.
  windows:
    name: Windows binary (release e2e checks)
    needs: codetree
    if: needs.codetree.outputs.run_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Dependency artifacts cached, not only the registry: rust-cache keeps
      # target/'s ~530 registry crates and drops the workspace ones. Measured
      # on windows-latest (4 cores): cold, the build is 23-24 min; warm, it
      # recompiles the ~89 workspace crates in about 4 min, plus about 1 min
      # to restore an 883 MB entry, so about 6 min for the job. A Dev Drive
      # bought nothing (real-time scanning is already off on the image; the
      # build is CPU-bound). The entry counts against the 10 GB quota (see the
      # top of this file) and is written by main only: this job is off the
      # merge gate, so main's post-merge run and every release tag, which
      # restores main's entries, are what it speeds up.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-binary
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # This builds the debug `susi.exe` and runs all seven E2E checks against
      # it in a scratch HOME: the same list the release cut runs on the tagged
      # binary, executed on Windows for the first time on this push.
      - name: Build the binary and run the release e2e checks
        run: cargo test --locked --test release_e2e_checks

  # The merge bot retests a head it resynced by dispatching this workflow
  # (a token-made push starts nothing). That run's completion raises no
  # workflow_run either: GitHub starts no workflow from an event a
  # GITHUB_TOKEN run raised. Every merge hook in the log follows a pushed run,
  # none a dispatched one, so the green retest waited for the scheduled pass,
  # which GitHub throttles to hours. The run that proves the head merges it,
  # through the merge bot's script and its serialized queue.
  #
  # Main moves while this run's checks and its queue wait run, so the head is
  # often stale again by the time this job starts. It used to resync it: an
  # update-branch and another dispatched retest, whose own merge job found main
  # moved again — the PR re-dispatched itself, a branch gate per lap, for as
  # long as merges kept landing. The head is green here (every check above
  # passed), so this job gates the stale merge inline exactly as auto-merge.yml
  # `merge-pr` does — the probe decides whether the toolchain is worth
  # installing — and SUSI_NO_RESYNC forbids the resync: a head it cannot gate
  # goes to a reconcile pass instead of another retest.
  merge:
    name: Merge the retested head
    needs: [unsafe-ratchet, fmt, codetree, invariants, workflow, deny, check]
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'branch' && github.ref != 'refs/heads/main'
    concurrency:
      group: auto-merge-integration
      queue: max
      cancel-in-progress: false
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30 # the inline gate is a bounded compile, as in merge-pr
    # The checks above are this run's verdict. A toolchain download that
    # fails here must not turn the retest red: the reconciler would read a
    # red head and tell the PR to fix a branch that passed.
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
      actions: write
    # The workflow env already sets CARGO_PROFILE_DEV_DEBUG: 0, the profile
    # the `lint` cache entry the gate restores was built with.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTC_WORKSPACE_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }} # the merge bot's scripts
          # The gate needs origin/main and the head's history: in a shallow
          # clone `git merge-tree` finds no merge base and reports a conflict.
          fetch-depth: 0
      - name: Will this head need the inline gate?
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: echo "need_gate=$(scripts/merge-queue-probe.sh "$REPO" "$BRANCH" "$SHA")" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        if: steps.probe.outputs.need_gate == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install sccache
        if: steps.probe.outputs.need_gate == 'true'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"
      # The entry `lint` writes on main: the gate is a warm clippy, not a
      # cold build. A branch run never writes the cache main owns.
      - name: Cache Cargo
        if: steps.probe.outputs.need_gate == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: false
      - name: Install Linux System Dependencies
        if: steps.probe.outputs.need_gate == 'true'
        run: scripts/ci-system-deps.sh
      - name: Install mold (Linux)
        id: mold
        if: steps.probe.outputs.need_gate == 'true'
        run: scripts/ci-install-mold.sh
      # A refused merge is the PR's state, not this head's: the script
      # explains it on the PR, and the tests above stay the run's verdict.
      # It runs even when a setup step failed: the gate is on only when the
      # last setup step succeeded, and without it a stale head goes to a
      # reconcile pass (SUSI_NO_RESYNC), never to another retest.
      - name: Merge the PR for this head
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SUSI_INLINE_MERGE_GATE: ${{ steps.probe.outputs.need_gate == 'true' && steps.mold.outcome == 'success' && '1' || '0' }}
          SUSI_NO_RESYNC: "1"
        run: scripts/auto-merge-pr.sh "$REPO" "$BRANCH" "$SHA"
