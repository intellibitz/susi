name: Slow Tests

# Runs the tests marked #[ignore] in the main suite - they do real
# tensor computation against local models (one of them alone takes
# ~4.5 minutes) rather than mocked/logic-only assertions, and running
# them on every push would make test.yml's fast feedback loop slow.
# Scheduled instead, so they still get regular exercise without
# blocking the push-triggered path.

on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: slow-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slow-tests:
    name: Ignored (Slow) Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake

      - name: cargo test -- --ignored
        run: cargo test --workspace -- --ignored
