name: Auto PR + Merge

# Mandate 49 automation — nobody opens, watches or merges a PR by hand.
#
#   push to any branch      -> open a PR into main if none exists; if this
#                              commit's Test run already finished green (it can
#                              beat the PR), merge it right away
#   Test workflow succeeds  -> merge that PR (merge commit, repo convention),
#                              then dispatch the full Test suite on main and a
#                              reconcile pass. A run the merge bot dispatched
#                              (the retest of a head it resynced) raises no
#                              workflow_run, since GitHub starts nothing from a
#                              GITHUB_TOKEN run's events, so that retest merges
#                              its own head (test.yml `merge`). A dispatch made
#                              with a personal token still lands here.
#   after every merge,      -> reconcile all open PRs (scripts/reconcile-prs.sh).
#   and every half hour        GitHub throttles scheduled runs (observed: every
#                              4-6 h, not 30 min), so the schedule is only the
#                              backstop; the dispatch after each merge is what
#                              drains the queue. The reconcile pass:
#                              merge any that are green but were missed, comment
#                              once on red/conflicting ones, close ones idle for
#                              7 days — so no PR waits in the queue forever
#
# Opt out per branch with a `wip/` or `nopr/` prefix (no PR, never merged).
# A failing gate leaves the PR open with a comment; the next push re-runs it.
# Merge conflicts leave the PR open with a comment — resolve by merging
# origin/main into the branch and pushing (never force-push main).
#
# A green-but-behind head is NOT sent through update-branch + retest: the
# serialized merge job builds the merge locally (git merge-tree), runs the
# compile gate on the merge tree (scripts/merge-gate.sh — the same affected-
# crate clippy the `check` job runs) and merges when it passes. The merge
# commit GitHub produces has that exact tree for a clean merge, so what lands
# is what was proven. That turns the stale-head retest — the unit of merge-
# queue latency — into ~1-2 min inside one job. The toolchain steps are gated
# on merge-queue-probe.sh so passes with nothing stale cost seconds, and the
# merge step's SUSI_INLINE_MERGE_GATE is that same probe answer: a head that
# went stale after the probe (a reconcile pass's own first merge does that to
# every other green PR) is never gated without the toolchain — that failed in
# clippy on the missing sccache and told the PR its merge "fails the compile
# gate". SUSI_INLINE_MERGE_GATE=0 or a missing checkout falls back to
# resync+retest; a reconcile pass without the gate stops at its first merge and
# leaves the rest to the follow-up pass, which probes again.
#
# The workflow_run and schedule jobs only fire from the default branch's copy
# of this file. The merge logic lives in scripts/auto-merge-pr.sh so every path
# (event, open-pr, reconciler) decides the same way.
#
# Why the explicit dispatch: pushes made with GITHUB_TOKEN never trigger
# other workflows, so the merge onto main would otherwise skip the full
# test shards (branch pushes only run the fast compile check).

on:
  push:
    branches-ignore: [main, 'wip/**', 'nopr/**', 'dependabot/**', 'gh-pages', 'susi-queue/**']
  workflow_run:
    workflows: [Test]
    types: [completed]
    # A completed run on main (the post-merge suite, or a tag's await-tests
    # dispatch) can never produce a merge decision — main has no PR — so each
    # one used to cost a full auto-merge run that exited doing nothing.
    branches-ignore: [main]
  schedule:
    # Backstop only: pushes and Test completions merge through their own
    # events, so this pass exists to catch the events GitHub drops. Every tick
    # is a completed run in the Actions tab; */5 was 288 runs/day of mostly
    # no-ops. */30 keeps a missed event inside the finish wait budget.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Open PR if none exists
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq length)
          if [ "$existing" != "0" ]; then echo "PR already open for $BRANCH"; exit 0; fi
          ahead=$(git rev-list --count "origin/main..HEAD")
          if [ "$ahead" = "0" ]; then echo "nothing ahead of main"; exit 0; fi
          gh pr create --base main --head "$BRANCH" \
            --title "$(git log -1 --format=%s)" \
            --body "Automated PR for \`$BRANCH\` (Mandate 49). Merges itself once the Test gate passes."
      - name: Reconcile if this commit already went green
        # The Test run can finish before the PR exists; the workflow_run merge
        # job would then find no PR and never retry.
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          green=$(gh run list --repo "$REPO" --workflow test.yml --commit "$SHA" --event push \
                    --json status,conclusion --jq '.[0] | select(.status=="completed" and .conclusion=="success") | "yes"')
          [ "$green" = "yes" ] || { echo "Test not green yet; the merge job or reconciler will merge it"; exit 0; }
          # Dispatch the serialized integration job. PR creation must never
          # share its global queue: GitHub replaces older pending jobs.
          gh workflow run auto-merge.yml --repo "$REPO" --ref main

  merge-pr:
    concurrency:
      group: auto-merge-integration
      queue: max
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push'
          || github.event.workflow_run.event == 'workflow_dispatch')
      && github.event.workflow_run.head_branch != 'main'
      && !startsWith(github.event.workflow_run.head_branch, 'wip/')
      && !startsWith(github.event.workflow_run.head_branch, 'nopr/')
      && !startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30 # the inline gate is a bounded compile, not a CI run
    # CARGO_PROFILE_DEV_DEBUG matches test.yml's workflow env. rust-cache puts
    # CARGO_* variables in its key, so without it this job never restored the
    # `lint` entry main writes, and its artifacts (with debug info) would not
    # have matched it anyway: every gated merge compiled cold, about 8 min
    # (#988's: 2m18s ONNX prefetch, 5m43s clippy) against about 30 s of clippy
    # warm, with the whole serialized queue waiting behind it.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTC_WORKSPACE_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4.2.2 # the default branch's scripts
        with:
          # The common case only needs the current workflow scripts and remote
          # refs. A stale green head needs ancestry for merge-tree; fetch it
          # after the probe, only on that uncommon path.
          fetch-depth: 1
      - name: Will a stale green head need the inline gate?
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "need_gate=$(scripts/merge-queue-probe.sh "$REPO" "$BRANCH" "$SHA")" >> "$GITHUB_OUTPUT"
      - name: Fetch history for the stale merge gate
        if: steps.probe.outputs.need_gate == 'true'
        run: git fetch --unshallow origin
      - name: Install Rust
        if: steps.probe.outputs.need_gate == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install sccache
        if: steps.probe.outputs.need_gate == 'true'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"
      - name: Cache Cargo
        if: steps.probe.outputs.need_gate == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: false
      - name: Install Linux System Dependencies
        if: steps.probe.outputs.need_gate == 'true'
        run: scripts/ci-system-deps.sh
      - name: Install mold (Linux)
        if: steps.probe.outputs.need_gate == 'true'
        run: scripts/ci-install-mold.sh
      - name: Merge the PR for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          # Gate only where the steps above installed the gate's toolchain.
          SUSI_INLINE_MERGE_GATE: ${{ steps.probe.outputs.need_gate == 'true' && '1' || '0' }}
        run: scripts/auto-merge-pr.sh "$REPO" "$BRANCH" "$SHA"

  reconcile:
    concurrency:
      group: auto-merge-integration
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0 # as merge-pr: test.yml's profile, or no warm cache
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTC_WORKSPACE_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      # The cron pass runs every half hour, usually with nothing stale:
      # probing first keeps those passes to seconds instead of a toolchain.
      - name: Will a stale green head need the inline gate?
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: echo "need_gate=$(scripts/merge-queue-probe.sh "$REPO")" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        if: steps.probe.outputs.need_gate == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install sccache
        if: steps.probe.outputs.need_gate == 'true'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"
      - name: Cache Cargo
        if: steps.probe.outputs.need_gate == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: false
      - name: Install Linux System Dependencies
        if: steps.probe.outputs.need_gate == 'true'
        run: scripts/ci-system-deps.sh
      - name: Install mold (Linux)
        if: steps.probe.outputs.need_gate == 'true'
        run: scripts/ci-install-mold.sh
      - name: Reconcile open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The probe ran once, before this pass merged anything. Heads its
          # own merges turn stale are gated only if the toolchain is here.
          SUSI_INLINE_MERGE_GATE: ${{ steps.probe.outputs.need_gate == 'true' && '1' || '0' }}
        run: scripts/reconcile-prs.sh "$REPO"
