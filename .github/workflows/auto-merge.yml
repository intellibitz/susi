name: Auto PR + Merge

# Mandate 49 automation — nobody opens, watches or merges a PR by hand.
#
#   push to any branch      -> open a PR into main if none exists; if this
#                              commit's Test run already finished green (it can
#                              beat the PR), merge it right away
#   Test workflow succeeds  -> merge that PR (merge commit, repo convention),
#                              then dispatch the full Test suite on main
#   every 5 minutes         -> reconcile all open PRs (scripts/reconcile-prs.sh):
#                              merge any that are green but were missed, comment
#                              once on red/conflicting ones, close ones idle for
#                              7 days — so no PR waits in the queue forever
#
# Opt out per branch with a `wip/` or `nopr/` prefix (no PR, never merged).
# A failing gate leaves the PR open with a comment; the next push re-runs it.
# Merge conflicts leave the PR open with a comment — resolve by merging
# origin/main into the branch and pushing (never force-push main).
#
# A green-but-behind head is NOT sent through update-branch + retest: the
# serialized merge job builds the merge locally (git merge-tree), runs the
# compile gate on the merge tree (scripts/merge-gate.sh — the same affected-
# crate clippy the `check` job runs) and merges when it passes. The merge
# commit GitHub produces has that exact tree for a clean merge, so what lands
# is what was proven. That turns the stale-head retest — the unit of merge-
# queue latency — into ~1-2 min inside one job. The toolchain steps are gated
# on merge-queue-probe.sh so passes with nothing stale cost seconds.
# SUSI_INLINE_MERGE_GATE=0 or a missing checkout falls back to resync+retest.
#
# The workflow_run and schedule jobs only fire from the default branch's copy
# of this file. The merge logic lives in scripts/auto-merge-pr.sh so every path
# (event, open-pr, reconciler) decides the same way.
#
# Why the explicit dispatch: pushes made with GITHUB_TOKEN never trigger
# other workflows, so the merge onto main would otherwise skip the full
# test shards (branch pushes only run the fast compile check).

on:
  push:
    branches-ignore: [main, 'wip/**', 'nopr/**', 'dependabot/**', 'gh-pages']
  workflow_run:
    workflows: [Test]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Open PR if none exists
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq length)
          if [ "$existing" != "0" ]; then echo "PR already open for $BRANCH"; exit 0; fi
          ahead=$(git rev-list --count "origin/main..HEAD")
          if [ "$ahead" = "0" ]; then echo "nothing ahead of main"; exit 0; fi
          gh pr create --base main --head "$BRANCH" \
            --title "$(git log -1 --format=%s)" \
            --body "Automated PR for \`$BRANCH\` (Mandate 49). Merges itself once the Test gate passes."
      - name: Reconcile if this commit already went green
        # The Test run can finish before the PR exists; the workflow_run merge
        # job would then find no PR and never retry.
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          green=$(gh run list --repo "$REPO" --workflow test.yml --commit "$SHA" --event push \
                    --json status,conclusion --jq '.[0] | select(.status=="completed" and .conclusion=="success") | "yes"')
          [ "$green" = "yes" ] || { echo "Test not green yet; the merge job or reconciler will merge it"; exit 0; }
          # Dispatch the serialized integration job. PR creation must never
          # share its global queue: GitHub replaces older pending jobs.
          gh workflow run auto-merge.yml --repo "$REPO" --ref main

  merge-pr:
    concurrency:
      group: auto-merge-integration
      queue: max
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch != 'main'
      && !startsWith(github.event.workflow_run.head_branch, 'wip/')
      && !startsWith(github.event.workflow_run.head_branch, 'nopr/')
      && !startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30 # the inline gate is a bounded compile, not a CI run
    env:
      SUSI_INLINE_MERGE_GATE: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTC_WORKSPACE_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4.2.2 # the default branch's scripts
        with:
          fetch-depth: 0 # the merge gate needs origin/main and head history
      - name: Will a stale green head need the inline gate?
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "need_gate=$(scripts/merge-queue-probe.sh "$REPO" "$BRANCH" "$SHA")" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        if: steps.probe.outputs.need_gate == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install sccache
        if: steps.probe.outputs.need_gate == 'true'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"
      - name: Cache Cargo
        if: steps.probe.outputs.need_gate == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: false
      - name: Install Linux System Dependencies
        if: steps.probe.outputs.need_gate == 'true'
        run: scripts/ci-system-deps.sh
      - name: Install mold (Linux)
        if: steps.probe.outputs.need_gate == 'true'
        run: scripts/ci-install-mold.sh
      - name: Merge the PR for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: scripts/auto-merge-pr.sh "$REPO" "$BRANCH" "$SHA"

  reconcile:
    concurrency:
      group: auto-merge-integration
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      SUSI_INLINE_MERGE_GATE: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTC_WORKSPACE_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      # The cron pass runs every five minutes, usually with nothing stale:
      # probing first keeps those passes to seconds instead of a toolchain.
      - name: Will a stale green head need the inline gate?
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: echo "need_gate=$(scripts/merge-queue-probe.sh "$REPO")" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        if: steps.probe.outputs.need_gate == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install sccache
        if: steps.probe.outputs.need_gate == 'true'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"
      - name: Cache Cargo
        if: steps.probe.outputs.need_gate == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: false
      - name: Install Linux System Dependencies
        if: steps.probe.outputs.need_gate == 'true'
        run: scripts/ci-system-deps.sh
      - name: Install mold (Linux)
        if: steps.probe.outputs.need_gate == 'true'
        run: scripts/ci-install-mold.sh
      - name: Reconcile open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/reconcile-prs.sh "$REPO"
