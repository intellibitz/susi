title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        Ask a question about integrating with `susi` (`9090`–`9094`), authoring extension packs, compiling `wasm32-wasip1` reflexes, or contributing to the workspace.
  - type: textarea
    id: question
    attributes:
      label: Question or Goal
      description: What are you building or trying to configure?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment & Wire Surface
      description: Mention your OS (`Linux`, `Windows`, `macOS` source build), `susi --version`, and which port (`9090`–`9094`) or CLI subcommand you are using.
