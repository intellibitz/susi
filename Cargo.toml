[workspace]
members = [
    ".",
    "xtask",
    "crates/susi-paths",
    "crates/susi-error",
    "crates/susi-core",
    "crates/susi-native",
    "crates/susi-sandbox",
    "crates/susi-agents",
    "crates/susi-tools",
    "crates/susi-gemi",
    "crates/susi-gmcp",
    "crates/susi-gawd", "crates/susi-daemon", "crates/susi-server",
]

[package]
name = "susi"
version = "0.5.0"
edition = "2021"
authors = ["IntelliBitz", "Muthu Ramadoss", "SUSI EAI Core"]
description = "susi: evidence-gated AI agent substrate. Open-admit OpenAI-compat/MCP/protocol peers, consensus swarm, HMAC audit, absolute truth, bearer-authenticated host ports."
license = "Apache-2.0"
repository = "https://github.com/intellibitz/susi"
homepage = "https://github.com/intellibitz/susi"
publish = false
# Last toolchain this was actually built and tested against; CI tracks
# `stable` rather than pinning to this, so treat it as a floor, not a
# guarantee earlier versions work.
rust-version = "1.98"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
[workspace.lints.clippy]

unwrap_used = "warn"
too_many_arguments = "warn"
complexity = { level = "warn", priority = -1 }

[workspace.dependencies]
susi-error = { path = "crates/susi-error" }
susi-core = { path = "crates/susi-core" }
susi-native = { path = "crates/susi-native" }
susi-sandbox = { path = "crates/susi-sandbox" }
susi-gemi = { path = "crates/susi-gemi" }
susi-gmcp = { path = "crates/susi-gmcp" }
susi-gawd = { path = "crates/susi-gawd" }
susi-agents = { path = "crates/susi-agents" }
susi-tools = { path = "crates/susi-tools" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dashmap = "6.0"
reqwest = { version = "0.13.5", features = ["json", "blocking", "query"] }
hex = "0.4"
once_cell = "1.19"
tracing = "0.1"
sha2 = "0.11.0"
getrandom = "0.3"
tokio = { version = "1.37", features = ["full", "tracing"] }
flume = "0.12.0"
parking_lot = "0.12"
url = "2.5"

[dependencies]
susi-daemon = { path = "crates/susi-daemon" }
susi-server = { path = "crates/susi-server" }
susi-paths = { path = "crates/susi-paths" }
susi-error = { workspace = true }
susi-core = { workspace = true }
susi-native = { workspace = true }
susi-sandbox = { workspace = true }
susi-gemi = { workspace = true }
susi-gmcp = { workspace = true }
susi-gawd = { workspace = true }
susi-agents = { workspace = true }
susi-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = "0.23.2"
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = { workspace = true }
indicatif = "0.18.6"
reqwest = { workspace = true }
ureq = { version = "3.4.2", features = ["json"] }
wasmer-wasix = { version = "0.704.2", features = ["sys"] }
wasmer-types = "7"
bytes = "1.0"
hex = { workspace = true }
base64 = "0.23.1"
once_cell = { workspace = true }
libc = "0.2"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
image = "0.25"
hound = "3.5"
shlex = "2.0"
signal-hook = "0.4.4"
md5 = "0.8.1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", optional = true }
sha2 = { workspace = true }
tokio = { workspace = true }
console-subscriber = "0.5.0"
flume = { workspace = true }
rayon = "1.10"
parking_lot = { workspace = true }
crossbeam = "0.8"
rmcp = { version = "3.4.0", features = ["server", "client"] }
qdrant-client = "1.11"
fastembed = "7.0.1"
syn = { version = "3.0.6", features = ["full", "visit"] }
bollard = "0.21.1"
tantivy = "0.26"
headless_chrome = "1.0"
url = { workspace = true }
regex = "1.11"
futures = "0.3"
tokio-stream = "0.1"
directories = "6.0.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { version = "0.11.0" }
candle-nn = { version = "0.11.0" }
candle-transformers = { version = "0.11.0" }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.11.0", features = ["metal", "accelerate"] }

[target.'cfg(not(windows))'.dependencies]
# wasmer's cranelift compiler backend has a hard compile_error on Windows
# (wasmer-compiler-cranelift 7.4.2 lib.rs); singlepass is used there instead
# below. `wasmer::Engine::default()` (src/native/wasm.rs) picks whichever
# backend feature was compiled in, so no source changes are needed.
wasmer = { version = "7", features = ["cranelift", "sys"] }

[target.'cfg(windows)'.dependencies]
wasmer = { version = "7", features = ["singlepass", "sys"] }
winapi = { version = "0.3", features = ["fileapi", "winerror"] }

[features]
default = []
cuda = ["susi-gemi/cuda", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
mkl = ["susi-gemi/mkl", "candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
metal = ["susi-gemi/metal", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
otlp = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry-otlp"]



[profile.release]
opt-level = 3 # High performance
lto = "fat" # Thin LTO: 10x faster compilation, low RAM overhead, eliminates link-time hangs
codegen-units = 1 # Hardware-saturated parallel codegen
incremental = false # Speed up iterative builds
panic = "abort"
strip = true

[profile.dev]
# Optimize dependencies in debug builds. This greatly improves runtime performance of
# non-release builds without significantly slowing down compilation of the core code!
[profile.dev.package."*"]
opt-level = 3
