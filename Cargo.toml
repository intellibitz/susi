[package]
name = "susi-engine"
version = "0.1.2022941"
edition = "2021"
authors = ["IntelliBitz", "Muthu Ramadoss", "SUSI EAI Core"]
description = "susi-engine: EAI: Exponential Intelligence for Any AI. - GAWD, GEMI & GMCP Multi-Agent Engine"
license = "Apache-2.0"
repository = "https://github.com/intellibitz/susi"
homepage = "https://github.com/intellibitz/susi"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.21.0"
hf-hub = "0.4.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.0"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["json", "blocking"] }
ureq = { version = "2.12", features = ["json", "tls"] }
rustyline = "15.0"
wasmer = { version = "3.1", features = ["cranelift", "sys"] }
wasmer-wasi = "3.1"
base64 = "0.22"
once_cell = "1.19"
libc = "0.2"
tiny_http = "0.12"
image = "0.25"
hound = "3.5"
shlex = "2.0"
signal-hook = "0.3"
md5 = "0.7"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
dialoguer = "0.11"
dirs = "5.0"
tokio = { version = "1.37", features = ["full", "tracing"] }
console-subscriber = "0.4"
flume = "0.11"
rayon = "1.10"
parking_lot = "0.12"
crossbeam = "0.8"
async-trait = "0.1"
bytes = "1.6"
thiserror = "1.0"
schemars = "0.8"
rmcp = { version = "0.3", features = ["server", "client"] }
rig-core = "0.15"
async-openai = "0.28"
qdrant-client = "1.11"
fastembed = "4.0"
ignore = "0.4"
tree-sitter = "0.22"
syn = { version = "2.0", features = ["full"] }
similar = "2.5"
bollard = "0.17"
tempfile = "3.12"
tower-lsp = "0.20"
ropey = "1.6"
tantivy = "0.22"
text-splitter = "0.18"
headless_chrome = "1.0"
symphonia = "0.5"
regex = "1.11"
governor = "0.7"
futures = "0.3"
tokio-stream = "0.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { version = "0.8.4" }
candle-nn = { version = "0.8.4" }
candle-transformers = { version = "0.8.4" }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.8.4", features = ["metal", "accelerate"] }
candle-nn = { version = "0.8.4", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.8.4", features = ["metal", "accelerate"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "winerror"] }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[profile.release]
opt-level = 3 # High performance
lto = "thin" # Thin LTO: 10x faster compilation, low RAM overhead, eliminates link-time hangs
codegen-units = 16 # Hardware-saturated parallel codegen
incremental = true # Speed up iterative builds
panic = "abort"
strip = true
