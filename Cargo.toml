# Vendored, patched third-party crates (see vendor/README.md): not workspace
# members, so workspace lints/clippy gates do not apply to upstream code.
exclude = ["vendor"]

[package]
name = "susi"
version = "0.21.55"
edition = "2021"
authors = ["IntelliBitz", "Muthu Ramadoss", "SUSI EAI Core"]
description = "susi: RSI swarm AI OS for hosting, provisioning, and managing any local and cloud AI ecosystem. Evidence-gated agent substrate. Open-admit OpenAI-compat/MCP/protocol peers, consensus swarm, HMAC audit, absolute truth, bearer-authenticated host ports."
license = "Apache-2.0"
repository = "https://github.com/intellibitz/susi"
homepage = "https://github.com/intellibitz/susi"
publish = false
# Last toolchain this was actually built and tested against; CI tracks
# `stable` rather than pinning to this, so treat it as a floor, not a
# guarantee earlier versions work.
rust-version = "1.98"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# `tokio_unstable` is set via RUSTFLAGS for the tokio-console feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
# Root package mirrors the workspace deny set (it keeps its own
# `missing_docs` rust lint, which is intentionally not workspace-wide).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
too_many_arguments = "warn"
complexity = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Hard-denied: production code returns typed `EaiResult`s; panic-capable
# macros require an inline `#[allow]` + justification comment (the audit
# trail), same pattern as `#[allow(unsafe_code)]` on justified FFI sites.
# Test code is exempt via `#![cfg_attr(test, allow(...))]` crate shims.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
too_many_arguments = "warn"
complexity = { level = "warn", priority = -1 }

[workspace.dependencies]
susi-build-os-ucrt = { path = "crates/susi-build-os-ucrt" }
susi-build-policy = { path = "crates/susi-build-policy" }
susi-cli-defs = { path = "crates/susi-cli-defs" }
susi-windows-runtime = { path = "crates/susi-windows-runtime" }
susi-abi = { path = "crates/susi-abi" }
susi-core = { path = "crates/susi-core" }
susi-vendor-wasmtime = { path = "crates/susi-vendor-wasmtime" }
susi-vendor-syn = { path = "crates/susi-vendor-syn" }
susi-native-client = { path = "crates/susi-native-client" }
susi-sandbox-client = { path = "crates/susi-sandbox-client" }
susi-http-transport = { path = "crates/susi-http-transport" }
susi-wire-client = { path = "crates/susi-wire-client" }
susi-adapters-llm = { path = "crates/susi-adapters-llm" }
susi-gemi-models = { path = "crates/susi-gemi-models", default-features = false }
susi-gemi = { path = "crates/susi-gemi", default-features = false }
susi-gmcp = { path = "crates/susi-gmcp", default-features = false }
susi-harness = { path = "crates/susi-harness" }
susi-gawd-agents = { path = "crates/susi-gawd-agents" }
susi-gawd-swarm = { path = "crates/susi-gawd-swarm" }
susi-gawd-a2a = { path = "crates/susi-gawd-a2a" }
susi-gawd = { path = "crates/susi-gawd" }
susi-unsafe-ratchet = { path = "crates/susi-unsafe-ratchet" }
susi-tools = { path = "crates/susi-tools" }
susi-server = { path = "crates/susi-server" }
susi-paths = { path = "crates/susi-paths" }
susi-error = { path = "crates/susi-error" }
susi-config = { path = "crates/susi-config" }
susi-leaf-services = { path = "crates/susi-leaf-services", features = ["all-services"] }
susi-daemon-runtime = { path = "crates/susi-daemon-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dashmap = "6.2"
reqwest = { version = "0.13.5", features = ["json", "blocking", "query"] }
hex = "0.4"
tracing = "0.1"
sha2 = "0.11.0"
getrandom = "0.4"
ed25519-dalek = { version = "2.2", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
tokio = { version = "1.53", features = ["full", "tracing"] }
parking_lot = "0.12"
url = "2.5"
criterion = "0.5"

[dev-dependencies]
ed25519-dalek = { package = "susi-vendor-ed25519-dalek", path = "crates/susi-vendor-ed25519-dalek" }
sha2 = { package = "susi-vendor-sha2", path = "crates/susi-vendor-sha2" }
susi-gawd-agents = { workspace = true }
susi-gawd-swarm = { workspace = true }

[dependencies]
susi-daemon = { path = "crates/susi-daemon", default-features = false }
susi-server = { path = "crates/susi-server" }
susi-core = { workspace = true }
susi-vendor-wasmtime = { workspace = true }
susi-sandbox-client = { workspace = true }
susi-gemi = { workspace = true }
susi-gmcp = { workspace = true }
susi-harness = { workspace = true }
susi-gawd = { workspace = true }
susi-tools = { workspace = true }
susi-paths = { workspace = true }
susi-error = { workspace = true }
susi-config = { workspace = true }
susi-cli-defs = { workspace = true }
susi-wire-client = { workspace = true }
susi-leaf-services = { workspace = true }
serde = { package = "susi-vendor-serde", path = "crates/susi-vendor-serde" }
serde_json = { package = "susi-vendor-serde-json", path = "crates/susi-vendor-serde-json" }
anyhow = { package = "susi-vendor-anyhow", path = "crates/susi-vendor-anyhow" }
clap = { package = "susi-vendor-clap", path = "crates/susi-vendor-clap" }
winapi = { package = "susi-vendor-winapi", path = "crates/susi-vendor-winapi" }
signal-hook = { package = "susi-vendor-signal-hook", path = "crates/susi-vendor-signal-hook" }
tracing = { package = "susi-vendor-tracing", path = "crates/susi-vendor-tracing" }
tracing-subscriber = { package = "susi-vendor-tracing-subscriber", path = "crates/susi-vendor-tracing-subscriber" }
tracing-appender = { package = "susi-vendor-tracing-appender", path = "crates/susi-vendor-tracing-appender" }
tokio = { package = "susi-vendor-tokio", path = "crates/susi-vendor-tokio" }
# Optional: only needed for tokio-console / RUSTFLAGS='--cfg tokio_unstable'.
# Keeping it off the default graph drops console-subscriber (+ its tonic path)
# from cold release builds.
console-subscriber = { package = "susi-vendor-console-subscriber", path = "crates/susi-vendor-console-subscriber" , optional = true }
hex = { package = "susi-vendor-hex", path = "crates/susi-vendor-hex" }
sha2 = { package = "susi-vendor-sha2", path = "crates/susi-vendor-sha2" }
susi-windows-runtime = { workspace = true }

[build-dependencies]
susi-build-os-ucrt = { workspace = true }
serde_json = { package = "susi-vendor-serde-json", path = "crates/susi-vendor-serde-json" }

[patch.crates-io]
regex-syntax = { path = "vendor/regex-syntax" }
idna_adapter = { path = "vendor/idna-adapter" }
unicode-ident = { path = "vendor/unicode-ident" }
native-tls = { path = "vendor/native-tls" }
fluent-uri = { path = "vendor/fluent-uri" }
# Ship the exact patched sources with Susi: a fresh checkout must not need
# GitHub to resolve its build. Provenance and patch notes: vendor/README.md.
reqwest = { path = "vendor/reqwest" }
hashbrown = { path = "vendor/hashbrown" }
# CPU inference is portable. Metal remains an explicit platform feature.
# CUDA/MKL are retired: their foreign implementation/license requirements
# fail the product gates. Unknown feature requests fail instead of falling back.
[features]
default = []
metal = ["susi-gemi/metal"]
# Enable with: RUSTFLAGS='--cfg tokio_unstable' cargo build --features tokio-console
tokio-console = ["dep:console-subscriber"]
# Bulk specialist tools (browser, full-text index, embeddings, syn AST).
tools-rich = ["susi-daemon/tools-rich", "susi-gmcp/tools-rich"]
# Built-in Candle local model engine. Off in the default protocol socket.
local-engine = ["susi-gemi/local-engine", "susi-daemon/local-engine"]
# Opt-in bundle of the pieces the default core leaves out.
plugins = ["tools-rich", "local-engine"]

[profile.release]
# Optimized builds: `cargo local-build production` and the installer's
# `--release` build what ships. (58062432f had set this profile to opt-level 0
# for faster iteration; the dev and test profiles keep that speed instead.)
opt-level = 3 # High performance
# Thin LTO (not fat): ~10x faster compile/link than fat LTO on this workspace,
# low RAM, avoids multi-hour link hangs on large crates (susi-daemon -> candle/
# wasmtime/...). Cross-crate opts still apply; runtime delta vs fat is small.
lto = "thin"
# Parallel LLVM codegen within each crate. codegen-units=1 serializes the
# heaviest units (susi-daemon, candle, wasmtime) and dominates cold install time.
codegen-units = 16
incremental = false # Release artifacts should not carry incremental caches
panic = "abort"
strip = true

# Max-opt distribution profile for published release binaries. Not used by the
# one-line installer; that path stays on [profile.release] above.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# dev and test must keep identical settings: any difference (codegen-units
# included) gives every dependency a second fingerprint, so a `cargo build`
# followed by a `cargo test` compiles the whole graph twice. 16 units also
# measured faster than 256 for the cold `cargo build -p susi` on Linux
# (T-BUILDTIME-1, docs/lean-core.md wave log).
[profile.dev]
opt-level = 0
debug = 0
codegen-units = 16
incremental = true
split-debuginfo = "unpacked"

[profile.test]
opt-level = 0
debug = 0
codegen-units = 16
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package.sha2]
opt-level = 3
