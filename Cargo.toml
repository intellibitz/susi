[build-dependencies]
serde_json = { package = "susi-vendor-serde-json", path = "crates/susi-vendor-serde-json" }

# crates.io candle-core 0.11.0 still depends on tokenizers ^0.22, which pulls a
# second copy alongside tokenizers 0.23.x used elsewhere. Patch to candle main
# (same 0.11.0 package version) which already uses tokenizers 0.23.x — one graph.
[patch.crates-io]
candle-core = { git = "https://github.com/huggingface/candle", rev = "1bbda281093b29a62ab2331b239894778b3aefb2" }
candle-nn = { git = "https://github.com/huggingface/candle", rev = "1bbda281093b29a62ab2331b239894778b3aefb2" }
candle-transformers = { git = "https://github.com/huggingface/candle", rev = "1bbda281093b29a62ab2331b239894778b3aefb2" }
candle-kernels = { git = "https://github.com/huggingface/candle", rev = "1bbda281093b29a62ab2331b239894778b3aefb2" }
candle-metal-kernels = { git = "https://github.com/huggingface/candle", rev = "1bbda281093b29a62ab2331b239894778b3aefb2" }
# reqwest's `rustls` feature hard-wires aws-lc-rs, and ra2a requests it
# (reqwest default features) with no opt-out. The vendored copy maps
# `rustls` to ring instead — see vendor/README.md.
reqwest = { path = "vendor/reqwest" }

# GPU backends live in susi-vendor-candle. Root forwards features through
# susi-gemi so `cargo build -p susi --features cuda|mkl|metal` enables the
# inference stack without the CLI package owning Candle dependencies.
[features]
default = []
cuda = ["susi-gemi/cuda"]
mkl = ["susi-gemi/mkl"]
metal = ["susi-gemi/metal"]
# Enable with: RUSTFLAGS='--cfg tokio_unstable' cargo build --features tokio-console
tokio-console = ["dep:console-subscriber"]

[profile.release]
opt-level = 3 # High performance
# Thin LTO (not fat): ~10x faster compile/link than fat LTO on this workspace,
# low RAM, avoids multi-hour link hangs on large crates (susi-daemon → candle/
# wasmer/…). Cross-crate opts still apply; runtime delta vs fat is small.
lto = "thin"
# Parallel LLVM codegen within each crate. codegen-units=1 serializes the
# heaviest units (susi-daemon, candle, wasmer) and dominates cold install time.
codegen-units = 16
incremental = false # Release artifacts should not carry incremental caches
panic = "abort"
strip = true

# Max-opt distribution profile for published release binaries (CI). Not used
# by the one-line installer — that path stays on [profile.release] above.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.dev]
# Line-tables-only debug info: panic backtraces and test failures still get
# file:line, but DWARF emission and link I/O drop sharply on this dep tree
# (candle/wasmer/ort are multi-hundred-MB debug payloads).
debug = "line-tables-only"
# Optimize dependencies in debug builds. This greatly improves runtime performance of
# non-release builds without significantly slowing down compilation of the core code!
#
# `"*"` outranks `[profile.dev.build-override]`, so it also compiles proc-macros
# at -O3 — code that only runs inside rustc. A cold `cargo build --timings`
# (28 cores) spent ~1500s of unit time optimizing proc-macros, with
# syn → serde_derive gating `serde` until t=125s. Named entries beat `"*"`:
# the proc-macros below each took >=15s at -O3 and go back to rustc's default.
#
# headless_chrome is the build's tail: its CDP bindings are one huge crate
# compiled alone for the last ~50s. -O3 → -O0 cut it 110s → 31s in isolation
# (codegen 78s → 4s); it drives a browser over a websocket, so its own code
# speed is not what a dev run waits on.
#
# libwild (wasmer-compiler's in-process linker): -O3 → -O0 cut it 57s → 13s
# in isolation, and compiling a 1.8 MB wasm module took 60.0ms vs 59.3ms —
# no measurable runtime cost.
#
# zstd-sys's C build gates zstd → wasmer-wasix, the cold build's tail: it
# starts at t=27s but, starved of jobserver tokens by ~28 rustc jobs, ends at
# t=244s (21s in isolation). -O1 cuts its C compile 20.6s → 7.9s; only dev
# compression speed (tantivy store, wasmer-wasix) pays for it.
[profile.dev.package]
"*" = { opt-level = 3 }
headless_chrome = { opt-level = 0 }
libwild = { opt-level = 0 }
zstd-sys = { opt-level = 1 }
async-trait = { opt-level = 0 }
bon-macros = { opt-level = 0 }
bytecheck_derive = { opt-level = 0 }
bytemuck_derive = { opt-level = 0 }
clap_derive = { opt-level = 0 }
curve25519-dalek-derive = { opt-level = 0 }
derive_more-impl = { opt-level = 0 }
displaydoc = { opt-level = 0 }
enum-iterator-derive = { opt-level = 0 }
enumset_derive = { opt-level = 0 }
futures-macro = { opt-level = 0 }
multiversion-macros = { opt-level = 0 }
num_enum_derive = { opt-level = 0 }
phf_macros = { opt-level = 0 }
pin-project-internal = { opt-level = 0 }
prost-derive = { opt-level = 0 }
ptr_meta_derive = { opt-level = 0 }
rkyv_derive = { opt-level = 0 }
rmcp-macros = { opt-level = 0 }
schemars_derive = { opt-level = 0 }
serde_derive = { opt-level = 0 }
serde_repr = { opt-level = 0 }
strum_macros = { opt-level = 0 }
thiserror-impl = { opt-level = 0 }
tokio-macros = { opt-level = 0 }
tracing-attributes = { opt-level = 0 }
typetag-impl = { opt-level = 0 }
yoke-derive = { opt-level = 0 }
zerocopy-derive = { opt-level = 0 }
zerofrom-derive = { opt-level = 0 }
zeroize_derive = { opt-level = 0 }
zerovec-derive = { opt-level = 0 }
