    "crates/susi-abi",
    "crates/susi-paths",
    "crates/susi-build-os-ucrt",
    "crates/susi-build-policy",
    "crates/susi-cli-defs",
    "crates/susi-windows-runtime",
    "crates/susi-error",
    "crates/susi-core",
    "crates/susi-vendor-criterion",
    "crates/susi-vendor-proptest",
    "crates/susi-vendor-tempfile",
    "crates/susi-vendor-wasmtime",
    "crates/susi-vendor-syn",
    "crates/susi-native-client",
    "crates/susi-config",
    "crates/susi-leaf-services",
    "crates/susi-daemon-runtime",
    "crates/susi-sandbox-client",
