    "crates/susi-tools",
    "crates/susi-gemi-models",
    "crates/susi-gemi",
    "crates/susi-gmcp",
    "crates/susi-gawd-agents",
    "crates/susi-gawd-swarm",
    "crates/susi-gawd-a2a",
    "crates/susi-gawd", "crates/susi-unsafe-ratchet", "crates/susi-daemon", "crates/susi-server",
    "crates/susi-harness",
    "crates/susi-vendor-anyhow",
    "crates/susi-vendor-axum",
    "crates/susi-vendor-chacha20poly1305",
    "crates/susi-vendor-clap",
    "crates/susi-vendor-console-subscriber",
    "crates/susi-vendor-dashmap",
    "crates/susi-vendor-ed25519-dalek",
    "crates/susi-vendor-getrandom",
    "crates/susi-vendor-hex",
    "crates/susi-vendor-http-body-util",
    "crates/susi-vendor-hyper",
    "crates/susi-vendor-hyper-util",
    "crates/susi-vendor-libc",
    "crates/susi-vendor-parking-lot",
    "crates/susi-vendor-rcgen",
    "crates/susi-vendor-regex",
    "crates/susi-vendor-serde",
    "crates/susi-vendor-serde-json",
    "crates/susi-vendor-sha1",
    "crates/susi-vendor-sha2",
    "crates/susi-vendor-shlex",
    "crates/susi-vendor-signal-hook",
    "crates/susi-vendor-windows-registry",
    "crates/susi-vendor-tokio",
    "crates/susi-vendor-tokio-rustls",
