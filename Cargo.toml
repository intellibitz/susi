[workspace]
members = [
    ".",
    "xtask",
    "crates/susi-paths",
    "crates/susi-error",
    "crates/susi-core",
    "crates/susi-native",
    "crates/susi-config",
    "crates/susi-sandbox",
    "crates/susi-agents",
    "crates/susi-tools",
    "crates/susi-gemi-models",
    "crates/susi-gemi",
    "crates/susi-gmcp",
    "crates/susi-gawd-agents",
    "crates/susi-gawd-swarm",
    "crates/susi-gawd-a2a",
    "crates/susi-gawd", "crates/susi-daemon", "crates/susi-server",
]

[package]
name = "susi"
version = "0.11.0"
edition = "2021"
authors = ["IntelliBitz", "Muthu Ramadoss", "SUSI EAI Core"]
description = "susi: evidence-gated AI agent substrate. Open-admit OpenAI-compat/MCP/protocol peers, consensus swarm, HMAC audit, absolute truth, bearer-authenticated host ports."
license = "Apache-2.0"
repository = "https://github.com/intellibitz/susi"
homepage = "https://github.com/intellibitz/susi"
publish = false
# Last toolchain this was actually built and tested against; CI tracks
# `stable` rather than pinning to this, so treat it as a floor, not a
# guarantee earlier versions work.
rust-version = "1.98"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
# Root package mirrors the workspace deny set (it keeps its own
# `missing_docs` rust lint, which is intentionally not workspace-wide).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
too_many_arguments = "warn"
complexity = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Hard-denied: production code returns typed `EaiResult`s; panic-capable
# macros require an inline `#[allow]` + justification comment (the audit
# trail), same pattern as `#[allow(unsafe_code)]` on justified FFI sites.
# Test code is exempt via `#![cfg_attr(test, allow(...))]` crate shims.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
too_many_arguments = "warn"
complexity = { level = "warn", priority = -1 }

[workspace.dependencies]
susi-core = { path = "crates/susi-core" }
susi-native = { path = "crates/susi-native" }
susi-sandbox = { path = "crates/susi-sandbox" }
susi-gemi-models = { path = "crates/susi-gemi-models" }
susi-gemi = { path = "crates/susi-gemi" }
susi-gmcp = { path = "crates/susi-gmcp" }
susi-gawd-agents = { path = "crates/susi-gawd-agents" }
susi-gawd-swarm = { path = "crates/susi-gawd-swarm" }
susi-gawd-a2a = { path = "crates/susi-gawd-a2a" }
susi-gawd = { path = "crates/susi-gawd" }
susi-agents = { path = "crates/susi-agents" }
susi-tools = { path = "crates/susi-tools" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dashmap = "6.2"
reqwest = { version = "0.13.5", features = ["json", "blocking", "query"] }
hex = "0.4"
once_cell = "1.21"
tracing = "0.1"
sha2 = "0.11.0"
getrandom = "0.4"
tokio = { version = "1.53", features = ["full", "tracing"] }
flume = "0.12.0"
parking_lot = "0.12"
url = "2.5"
criterion = "0.5"

[dev-dependencies]
serde_json = { workspace = true }

[dependencies]
susi-daemon = { path = "crates/susi-daemon" }
susi-server = { path = "crates/susi-server" }
susi-core = { workspace = true }
susi-native = { workspace = true }
susi-sandbox = { workspace = true }
susi-gemi = { workspace = true }
susi-gmcp = { workspace = true }
susi-gawd = { workspace = true }
susi-agents = { workspace = true }
susi-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.6", features = ["derive", "env"] }
signal-hook = "0.4.4"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tokio = { workspace = true }
# Optional: only needed for tokio-console / RUSTFLAGS='--cfg tokio_unstable'.
# Keeping it off the default graph drops console-subscriber (+ its tonic path)
# from cold release builds.
console-subscriber = { version = "0.5.0", optional = true }
rayon = "1.12"
parking_lot = { workspace = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "winerror"] }

[build-dependencies]
serde_json = { workspace = true }

# crates.io candle-core 0.11.0 still depends on tokenizers ^0.22, which pulls a
# second copy alongside tokenizers 0.23.x used elsewhere. Patch to candle main
# (same 0.11.0 package version) which already uses tokenizers 0.23.x — one graph.
[patch.crates-io]
candle-core = { git = "https://github.com/huggingface/candle", rev = "1bbda281093b29a62ab2331b239894778b3aefb2" }
candle-nn = { git = "https://github.com/huggingface/candle", rev = "1bbda281093b29a62ab2331b239894778b3aefb2" }
candle-transformers = { git = "https://github.com/huggingface/candle", rev = "1bbda281093b29a62ab2331b239894778b3aefb2" }
candle-kernels = { git = "https://github.com/huggingface/candle", rev = "1bbda281093b29a62ab2331b239894778b3aefb2" }
candle-metal-kernels = { git = "https://github.com/huggingface/candle", rev = "1bbda281093b29a62ab2331b239894778b3aefb2" }

# GPU backends live in susi-gemi (and models). Root only forwards features so
# `cargo build -p susi --features cuda|mkl|metal` enables the inference stack
# without the CLI package owning Candle dependencies.
[features]
default = []
cuda = ["susi-gemi/cuda", "susi-daemon/cuda", "susi-server/cuda"]
mkl = ["susi-gemi/mkl"]
metal = ["susi-gemi/metal"]
# Enable with: RUSTFLAGS='--cfg tokio_unstable' cargo build --features tokio-console
tokio-console = ["dep:console-subscriber"]


[profile.release]
opt-level = 3 # High performance
# Thin LTO (not fat): ~10x faster compile/link than fat LTO on this workspace,
# low RAM, avoids multi-hour link hangs on large crates (susi-daemon → candle/
# wasmer/…). Cross-crate opts still apply; runtime delta vs fat is small.
lto = "thin"
# Parallel LLVM codegen within each crate. codegen-units=1 serializes the
# heaviest units (susi-daemon, candle, wasmer) and dominates cold install time.
codegen-units = 16
incremental = false # Release artifacts should not carry incremental caches
panic = "abort"
strip = true

# Max-opt distribution profile for published release binaries (CI). Not used
# by the one-line installer — that path stays on [profile.release] above.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.dev]
# Optimize dependencies in debug builds. This greatly improves runtime performance of
# non-release builds without significantly slowing down compilation of the core code!
[profile.dev.package."*"]
opt-level = 3
