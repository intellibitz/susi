[package]
name = "susi-engine"
version = "0.1.2023008"
edition = "2021"
authors = ["IntelliBitz", "Muthu Ramadoss", "SUSI EAI Core"]
description = "susi-engine: EAI: Exponential Intelligence for Any AI. - GAWD, GEMI & GMCP Multi-Agent Engine"
license = "Apache-2.0"
repository = "https://github.com/intellibitz/susi"
homepage = "https://github.com/intellibitz/susi"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.23.2"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.0"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
ureq = { version = "3.4.2", features = ["json"] }
wasmer = { version = "7", features = ["cranelift", "sys"] }
wasmer-wasix = { version = "0.704.2", features = ["sys"] }
wasmer-types = "7"
bytes = "1.0"
hex = "0.4"
base64 = "0.23.1"
once_cell = "1.19"
libc = "0.2"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
image = "0.25"
hound = "3.5"
shlex = "2.0"
signal-hook = "0.4.4"
md5 = "0.8.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", optional = true }
sha2 = "0.11.0"
tokio = { version = "1.37", features = ["full", "tracing"] }
console-subscriber = "0.5.0"
flume = "0.12.0"
rayon = "1.10"
parking_lot = "0.12"
crossbeam = "0.8"
rmcp = { version = "3.4.0", features = ["server", "client"] }
qdrant-client = "1.11"
fastembed = "7.0.1"
syn = { version = "3.0.6", features = ["full", "visit"] }
bollard = "0.21.1"
tantivy = "0.26"
headless_chrome = "1.0"
url = "2.5"
regex = "1.11"
futures = "0.3"
tokio-stream = "0.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { version = "0.11.0" }
candle-nn = { version = "0.11.0" }
candle-transformers = { version = "0.11.0" }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.11.0", features = ["metal", "accelerate"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "winerror"] }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
otlp = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry-otlp"]



[profile.release]
opt-level = 3 # High performance
lto = "thin" # Thin LTO: 10x faster compilation, low RAM overhead, eliminates link-time hangs
codegen-units = 16 # Hardware-saturated parallel codegen
incremental = true # Speed up iterative builds
panic = "abort"
strip = true
