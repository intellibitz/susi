[alias]
xb = "run --package xtask -- build"
# Faster test runner: per-test process isolation, better scheduling than
# libtest's per-binary thread pools. Requires `cargo install cargo-nextest`.
xn = "nextest run --workspace --locked"

# Linkers for Linux.
#
# x86_64 sets NO linker and no linker flag: rustc links with its bundled
# ld.lld by default (since Rust 1.90, verified on 1.99.0). It used to set
# `linker = ".cargo/fast-linker"` - a wrapper preferring mold - plus
# `-Clinker-features=-lld` to hand linking to it. mold bought ~0.5 s per large
# link (2.4-2.6 s vs ~3.0 s for the `susi` bin after touching main.rs) and cost
# far more:
#
#   Cargo resolves a relative `linker` to an ABSOLUTE path inside the current
#   worktree and passes it as `-C linker=...`; that path is part of every unit's
#   fingerprint. So no two worktrees could ever share a compiled crate - not the
#   workspace crates and not the 637 registry crates either - and each one
#   overwrote the other's artifacts in a shared target dir. scripts/susi-worktree.sh
#   has pointed new worktrees at one shared target for exactly this reason, and
#   it never delivered: a fresh worktree compiled 716 crates in 656 s, and the
#   shared target grew to 425 GB. With a path-independent config, a worktree
#   created after a warm build compiled 81 crates (79 workspace, 2 registry) in
#   176 s.
#
# Do not set a repo-relative `linker` (or any flag that embeds a worktree path)
# for a target developers build on; tests/ci_workflow_perf.rs pins this.
#
# aarch64 keeps the wrapper: rustc self-contains lld only on x86_64 Linux (on
# other targets `-Clinker-features` is unstable, which broke the linux-aarch64
# release build of v0.16.0), and the only aarch64 Linux builds are the CI release
# leg, which has one checkout and so no worktree to share with.
[target.aarch64-unknown-linux-gnu]
linker = ".cargo/fast-linker"
